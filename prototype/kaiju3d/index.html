<title>怪獣3D試作</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
/* Layout: one TV screen (16:10) in a dark studio; the 3D view fills it and the HUD sits on top. */
:root {
  --studio: #15181e; --bezel: #2b2f37; --telop: #0f2a4a; --red: #d33a2c; --gold: #ffd34d; --text: #f5f3ee; --muted: #aab3bf; --ink: #2f3e36;
  --f-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --f-body: 'M PLUS 1p', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--studio); color: var(--text); font-family: var(--f-body); box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 10px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; overflow-x: hidden;
}
.tv { width: min(100%, 1120px, calc((100dvh - 64px) * 1.6)); padding: 10px; background: var(--bezel); border-radius: 22px; box-sizing: border-box; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.screen { position: relative; width: 100%; aspect-ratio: 16 / 10; container-type: inline-size; overflow: hidden; border-radius: 12px; background: #000; --u: calc(100cqw / 1200); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; inset: 0; pointer-events: none; font-size: calc(var(--u) * 24); }
.live { position: absolute; left: calc(var(--u) * 22); top: calc(var(--u) * 20); display: flex; gap: calc(var(--u) * 8); font-weight: 800; }
.live span { padding: calc(var(--u) * 4) calc(var(--u) * 14); border-radius: calc(var(--u) * 4); background: var(--telop); }
.live span:first-child { background: var(--red); }
.count { position: absolute; right: calc(var(--u) * 24); top: calc(var(--u) * 16); text-align: right; font-family: var(--f-display); font-size: calc(var(--u) * 44); line-height: 1.1; text-shadow: 0 0 calc(var(--u) * 6) #000, 0 calc(var(--u) * 3) 0 var(--ink); font-variant-numeric: tabular-nums; }
.count small { display: block; font-family: var(--f-body); font-weight: 800; font-size: calc(var(--u) * 22); color: var(--gold); }
.telop { position: absolute; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: calc(var(--u) * 128) 1fr; min-height: calc(var(--u) * 78); background: rgba(15, 42, 74, .92); transform: translateY(100%); transition: transform .25s ease; }
.telop.on { transform: none; }
.telop b { display: grid; place-items: center; background: var(--red); font-size: calc(var(--u) * 30); }
.telop div { padding: calc(var(--u) * 8) calc(var(--u) * 20); }
.telop div p { margin: 0; font-size: calc(var(--u) * 24); font-weight: 800; }
.telop div span { color: var(--gold); font-size: calc(var(--u) * 21); }
.prompt { position: absolute; left: 50%; top: calc(var(--u) * 84); transform: translateX(-50%); background: rgba(12, 22, 38, .86); border: calc(var(--u) * 3) solid var(--gold); border-radius: calc(var(--u) * 10); padding: calc(var(--u) * 8) calc(var(--u) * 22); font-weight: 800; white-space: nowrap; transition: opacity .4s; }
.sfx { position: absolute; font-family: var(--f-display); color: #fff; font-size: calc(var(--u) * 64); -webkit-text-stroke: calc(var(--u) * 3) var(--ink); paint-order: stroke fill; pointer-events: none; animation: pop .5s ease-out forwards; }
@keyframes pop { from { transform: scale(1.6) rotate(-8deg); opacity: 0; } 20% { opacity: 1; } to { transform: scale(1) rotate(-8deg); opacity: 0; } }
.modes { position: absolute; left: calc(var(--u) * 22); bottom: calc(var(--u) * 96); display: flex; gap: calc(var(--u) * 8); pointer-events: auto; }
.modes button { font-family: var(--f-body); font-weight: 800; font-size: calc(var(--u) * 22); border-radius: calc(var(--u) * 10); padding: calc(var(--u) * 8) calc(var(--u) * 18); border: calc(var(--u) * 3) solid #fff; background: rgba(15, 42, 74, .8); color: #fff; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--gold); color: var(--telop); border-color: var(--ink); }
.modes button:focus-visible { outline: calc(var(--u) * 4) solid #8fd0ff; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; font-weight: 800; color: var(--muted); }
.hint { color: var(--muted); font-size: 12px; text-align: center; max-width: 60ch; margin: 0; }
@media (orientation: portrait) {
  .tv { position: fixed; top: 50%; left: 50%; width: min(calc(100dvh - 24px), calc((100vw - 24px) * 1.6 - 20px)); transform: translate(-50%, -50%) rotate(90deg); }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { .sfx { animation-duration: .01s; } }
</style>

<div class="tv"><div class="screen" id="screen">
  <div class="loading" id="loading">セットを組み立て中……</div>
  <div class="hud">
    <div class="live"><span>LIVE</span><span id="where">中継：駅前ビル街（怪獣目線）</span></div>
    <div class="count"><span id="money">¥0</span><small id="downs">倒壊 0棟</small></div>
    <div class="prompt" id="prompt">タップでパンチ（左右交互）。ビルの前で殴ると崩れる</div>
    <div class="modes"><button id="mPov" aria-pressed="true">怪獣目線</button><button id="mThird" aria-pressed="false">引き</button></div>
    <div class="telop" id="telop"><b>速報</b><div><p id="tHead">―</p><span id="tSub">―</span></div></div>
  </div>
</div></div>
<p class="hint">3D試作（駅前ビル街のサンドバッグだけ）。タップ／クリック／スペースでパンチ、「怪獣目線」「引き」で視点を切り替え。</p>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const $ = id => document.getElementById(id);
const screenEl = $('screen');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
screenEl.prepend(renderer.domElement);
$('loading').remove();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xb9d7e6);
scene.fog = new THREE.Fog(0xc9dde6, 160, 520);
const camera = new THREE.PerspectiveCamera(58, 1.6, 0.5, 1200);
scene.add(camera);

// ---------- light: a bright studio "sun" with soft shadows ----------
scene.add(new THREE.HemisphereLight(0xdfefff, 0x8a7e68, 1.35));
const sun = new THREE.DirectionalLight(0xfff2dc, 2.4);
sun.position.set(-90, 160, 60);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -160, right: 160, top: 160, bottom: -160, near: 10, far: 500 });
sun.shadow.bias = -0.0006;
scene.add(sun, sun.target);

// ---------- textures made on the fly ----------
function canvasTex(w, h, paint, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  paint(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
const windowTex = base => canvasTex(128, 256, (g, w, h) => {
  g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let y = 8; y < h - 8; y += 18) for (let x = 8; x < w - 10; x += 16) { g.fillStyle = Math.random() < 0.15 ? '#ffe8a8' : '#55697a'; g.fillRect(x, y, 10, 11); }
  g.fillStyle = 'rgba(0,0,0,.12)'; g.fillRect(0, h - 10, w, 10);
});
const noiseTex = canvasTex(256, 256, (g, w, h) => {
  const im = g.createImageData(w, h);
  for (let i = 0; i < im.data.length; i += 4) { const v = 200 + Math.random() * 55; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
  g.putImageData(im, 0, 0);
}, [4, 4]);
const roadTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#6a675f'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#efe9d6'; for (let y = 0; y < h; y += 64) g.fillRect(w / 2 - 4, y, 8, 34);
  g.fillStyle = 'rgba(0,0,0,.08)'; for (let i = 0; i < 300; i++) g.fillRect(Math.random() * w, Math.random() * h, 3, 3);
}, [1, 30]);
const dustTex = canvasTex(64, 64, (g) => { const r = g.createRadialGradient(32, 32, 2, 32, 32, 32); r.addColorStop(0, 'rgba(235,228,212,1)'); r.addColorStop(1, 'rgba(235,228,212,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); });

// ---------- the miniature set ----------
const ground = new THREE.Mesh(new THREE.PlaneGeometry(900, 1600), new THREE.MeshStandardMaterial({ color: 0x9c967d, roughness: 1 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const road = new THREE.Mesh(new THREE.PlaneGeometry(46, 1600), new THREE.MeshStandardMaterial({ map: roadTex, roughness: 0.95 }));
road.rotation.x = -Math.PI / 2; road.position.y = 0.05; road.receiveShadow = true; scene.add(road);
const BCOL = ['#e7d9b8', '#c8d6d9', '#d9c3c0', '#dfe3d2', '#cfc6e0', '#e9d1a8'];
const mats = BCOL.map(c => new THREE.MeshStandardMaterial({ map: windowTex(c), roughness: 0.85 }));
const roofMat = new THREE.MeshStandardMaterial({ color: 0x9aa3a0, roughness: 0.9 });
function building(w, h, d, mi) {
  const g = new THREE.Group();
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), [mats[mi], mats[mi], roofMat, roofMat, mats[mi], mats[mi]]);
  m.position.y = h / 2; m.castShadow = m.receiveShadow = true; g.add(m);
  const tank = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 4, 10), roofMat); tank.position.set(w * 0.2, h + 2, 0); tank.castShadow = true; g.add(tank);
  g.userData = { w, h, d, mi };
  return g;
}
// buildings lining the street (scenery) and buildings standing in the way (the punching bags)
for (let z = 60; z > -1200; z -= 34) for (const side of [-1, 1]) {
  const w = 20 + Math.random() * 10, h = 20 + Math.random() * 50, d = 22;
  const b = building(w, h, d, Math.floor(Math.random() * 6)); b.position.set(side * (40 + w / 2 + Math.random() * 6), 0, z); scene.add(b);
}
const trees = new THREE.MeshStandardMaterial({ color: 0x4f7d48, roughness: 1 });
for (let z = 40; z > -1200; z -= 26) for (const side of [-1, 1]) { const t = new THREE.Mesh(new THREE.ConeGeometry(3.2, 9, 8), trees); t.position.set(side * 26, 4.5, z); t.castShadow = true; scene.add(t); }
const carCols = [0xd33a2c, 0x3f7fc0, 0xf4f0e2, 0xffd34d];
for (let z = 20; z > -1100; z -= 45) { const c = new THREE.Mesh(new THREE.BoxGeometry(4, 3, 8), new THREE.MeshStandardMaterial({ color: carCols[Math.floor(Math.random() * 4)], roughness: 0.4, metalness: 0.2 })); c.position.set((Math.random() < 0.5 ? -1 : 1) * 10, 1.5, z); c.castShadow = true; scene.add(c); }
const targets = [];
for (let i = 0; i < 10; i++) {
  const w = 30 + Math.random() * 10, h = 38 + Math.random() * 34, d = 24;
  const b = building(w, h, d, i % 6); b.position.set(0, 0, -70 - i * 95); scene.add(b);
  b.userData.hp = Math.ceil(h / 18); b.userData.max = b.userData.hp; targets.push(b);
}

// ---------- the kaiju (an original suit: chubby, round spikes, a zipper on its back) ----------
const suit = new THREE.MeshStandardMaterial({ color: 0x6f9a7a, roughness: 0.78, bumpMap: noiseTex, bumpScale: 0.4 });
const suitDark = new THREE.MeshStandardMaterial({ color: 0x5c8466, roughness: 0.8, bumpMap: noiseTex, bumpScale: 0.4 });
const bellyMat = new THREE.MeshStandardMaterial({ color: 0xead9ad, roughness: 0.85 });
const spikeMat = new THREE.MeshStandardMaterial({ color: 0xe2a64c, roughness: 0.6 });
const blackMat = new THREE.MeshStandardMaterial({ color: 0x1f2a24, roughness: 0.3 });
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf4f0e2, roughness: 0.6 });
const sph = (r, m, sx = 1, sy = 1, sz = 1) => { const o = new THREE.Mesh(new THREE.SphereGeometry(r, 32, 24), m); o.scale.set(sx, sy, sz); o.castShadow = true; return o; };
function makeKaiju() {
  const k = new THREE.Group();
  const body = sph(14, suit, 1, 1.3, 0.95); body.position.y = 36; k.add(body);
  const belly = sph(10.5, bellyMat, 0.9, 1.15, 0.6); belly.position.set(0, 33, -6.5); k.add(belly);
  for (let i = 0; i < 4; i++) { const ln = new THREE.Mesh(new THREE.TorusGeometry(8.5 - Math.abs(i - 1.5) * 1.2, 0.25, 6, 30, Math.PI), new THREE.MeshStandardMaterial({ color: 0xc9b583 })); ln.position.set(0, 26 + i * 5, -11.5); ln.rotation.set(Math.PI / 2 - 0.25, 0, 0); k.add(ln); }
  const head = new THREE.Group(); head.position.set(0, 57, -2); k.add(head);
  head.add(sph(10, suit, 1, 0.9, 1));
  const snout = sph(7, suitDark, 1, 0.75, 1.1); snout.position.set(0, -2, -7); head.add(snout);
  for (const sx of [-1, 1]) {
    const eye = sph(1.4, blackMat); eye.position.set(sx * 4.2, 3, -8.2); head.add(eye);
    const hl = sph(0.45, whiteMat); hl.position.set(sx * 4.2 + 0.5, 3.5, -9.4); head.add(hl);
    const ch = sph(1.8, new THREE.MeshStandardMaterial({ color: 0xe88f86, transparent: true, opacity: 0.5 }), 1, 0.5, 0.4); ch.position.set(sx * 6.5, -0.5, -7.5); head.add(ch);
    const nos = sph(0.6, blackMat); nos.position.set(sx * 1.8, -1, -14.3); head.add(nos);
  }
  // back spikes (rounded) and a zipper down the back of the suit
  [[0, 62, 8, 3], [0, 52, 12, 4], [0, 42, 14, 4.4], [0, 32, 13.6, 4], [0, 22, 11, 3.2]].forEach(([x, y, z, r]) => { const c = new THREE.Mesh(new THREE.ConeGeometry(r, r * 2.4, 12), spikeMat); c.position.set(x, y, z); c.rotation.x = 0.5; c.castShadow = true; k.add(c); });
  const zip = new THREE.Mesh(new THREE.BoxGeometry(0.8, 26, 0.6), new THREE.MeshStandardMaterial({ color: 0x3a3a3a, metalness: 0.6, roughness: 0.3 })); zip.position.set(3.2, 38, 13.6); zip.rotation.x = -0.12; k.add(zip);
  // tail: tapering spheres
  const tail = []; for (let i = 0; i < 7; i++) { const s = sph(6.5 - i * 0.75, suit); s.position.set(0, 18 - i * 2.2, 12 + i * 5.5); k.add(s); tail.push(s); }
  // legs and feet
  const legs = [];
  for (const sx of [-1, 1]) {
    const leg = new THREE.Group(); leg.position.set(sx * 7, 18, 0); k.add(leg);
    const th = sph(6, suit, 1, 1.3, 1); th.position.y = -6; leg.add(th);
    const ft = sph(5.5, suit, 1.1, 0.6, 1.5); ft.position.set(0, -15, -2); leg.add(ft);
    for (let t = -1; t <= 1; t++) { const toe = sph(1.3, whiteMat); toe.position.set(t * 2.5, -15.5, -9.5); leg.add(toe); }
    legs.push(leg);
  }
  // arms (used in the third-person view)
  const arms = [];
  for (const sx of [-1, 1]) {
    const a = new THREE.Group(); a.position.set(sx * 13, 44, -2); k.add(a);
    const up = new THREE.Mesh(new THREE.CapsuleGeometry(3.2, 9, 6, 14), suit); up.position.set(0, -4, -3); up.rotation.x = 0.9; up.castShadow = true; a.add(up);
    const fist = sph(4, suit); fist.position.set(0, -8, -9); a.add(fist);
    arms.push(a);
  }
  k.userData = { head, legs, arms, tail };
  return k;
}
const kaiju = makeKaiju(); scene.add(kaiju);
kaiju.position.set(0, 0, -6);
kaiju.rotation.y = 0;

// first-person arms: forearm + fist that come up from the bottom of the view
function makePovArm(side) {
  const g = new THREE.Group();
  const fore = new THREE.Mesh(new THREE.CapsuleGeometry(3.4, 18, 8, 16), suit); fore.rotation.x = Math.PI / 2; fore.position.z = 8; g.add(fore);
  const fist = sph(5.2, suit, 1.1, 0.95, 1); g.add(fist);
  for (let i = -1; i <= 1; i++) { const kn = sph(1.3, suitDark); kn.position.set(i * 2.6, 2.2, -4.3); g.add(kn); }
  g.userData = { rest: new THREE.Vector3(side * 13, -11, -22), side };
  g.position.copy(g.userData.rest);
  camera.add(g);
  return g;
}
const povArms = [makePovArm(-1), makePovArm(1)];
const povSnout = sph(9, suitDark, 1.4, 0.6, 1); povSnout.position.set(0, -15, -18); camera.add(povSnout);
for (const sx of [-1, 1]) { const n = sph(1.3, blackMat); n.position.set(sx * 3.5, -12.6, -24.5); camera.add(n); }

// ---------- post-processing: a shallow depth of field makes the set read as a miniature ----------
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bokeh = new BokehPass(scene, camera, { focus: 80, aperture: 0.00006, maxblur: 0.008 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

// ---------- debris, dust and the punch ----------
const chunks = [], dusts = [];
const chunkGeoCache = {};
function collapse(b) {
  const { w, h, d, mi } = b.userData;
  const p = b.position.clone();
  scene.remove(b);
  const nx = 3, ny = Math.max(4, Math.round(h / 9)), nz = 2;
  const cw = w / nx, ch = h / ny, cd = d / nz;
  const key = `${cw.toFixed(1)}_${ch.toFixed(1)}_${cd.toFixed(1)}`;
  const geo = chunkGeoCache[key] || (chunkGeoCache[key] = new THREE.BoxGeometry(cw * 0.96, ch * 0.96, cd * 0.96));
  for (let ix = 0; ix < nx; ix++) for (let iy = 0; iy < ny; iy++) for (let iz = 0; iz < nz; iz++) {
    const m = new THREE.Mesh(geo, mats[mi]);
    m.position.set(p.x - w / 2 + cw * (ix + 0.5), ch * (iy + 0.5), p.z - d / 2 + cd * (iz + 0.5));
    m.castShadow = true;
    const away = -1;   // pushed away from the kaiju (towards -z)
    m.userData = { v: new THREE.Vector3((Math.random() - 0.5) * 18, 4 + Math.random() * 12 + iy * 1.2, away * (10 + Math.random() * 26) * (iy / ny + 0.3)), av: new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(4), delay: (ny - iy) * 0.02, life: 0 };
    scene.add(m); chunks.push(m);
  }
  for (let i = 0; i < 26; i++) puff(p.x + (Math.random() - 0.5) * w, 4 + Math.random() * h * 0.5, p.z + (Math.random() - 0.5) * d, 10 + Math.random() * 14);
}
function puff(x, y, z, s) {
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: dustTex, transparent: true, depthWrite: false, opacity: 0.85 }));
  sp.position.set(x, y, z); sp.scale.set(s, s, s); sp.userData = { life: 0, grow: 10 + Math.random() * 12, vy: 2 + Math.random() * 3 };
  scene.add(sp); dusts.push(sp);
}

let mode = 'pov', money = 0, downs = 0, hitstop = 0, shake = 0, punchT = 1, punchSide = 0, walkPhase = 0, telopTimer = 0;
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
function sfx(text, x, y) {
  const el = document.createElement('div'); el.className = 'sfx'; el.textContent = text;
  el.style.left = `calc(var(--u) * ${x})`; el.style.top = `calc(var(--u) * ${y})`;
  screenEl.querySelector('.hud').appendChild(el); setTimeout(() => el.remove(), 600);
}
function news(head, sub) { $('tHead').textContent = head; $('tSub').textContent = sub; $('telop').classList.add('on'); telopTimer = 3.2; }
const front = () => targets.find(b => b.parent && b.position.z < kaiju.position.z);
const gap = () => { const b = front(); return b ? kaiju.position.z - (b.position.z + b.userData.d / 2) : Infinity; };
function punch() {
  $('prompt').style.opacity = 0;
  if (punchT < 0.45) return;
  punchT = 0; punchSide ^= 1;
  const b = front();
  if (!b || gap() > 40) { sfx('ブンッ', 520, 300); return; }
  setTimeout(() => {       // the fist lands a moment later
    hitstop = 0.07; shake = 1;
    b.userData.hp--;
    const p = b.position;
    for (let i = 0; i < 6; i++) puff(p.x + (Math.random() - 0.5) * 10, 20 + Math.random() * 14, p.z + b.userData.d / 2, 5 + Math.random() * 5);
    b.children[0].rotation.z = (Math.random() - 0.5) * 0.04 * (b.userData.max - b.userData.hp);
    sfx(['ドゴッ', 'バキッ', 'ボコッ'][Math.floor(Math.random() * 3)], 460 + Math.random() * 200, 220 + Math.random() * 120);
    if (b.userData.hp <= 0) {
      const v = b.userData.w * b.userData.h * b.userData.d * 9e4;
      money += v; downs++; shake = 2.2; hitstop = 0.12;
      collapse(b);
      $('money').textContent = yen(money); $('downs').textContent = `倒壊 ${downs}棟`;
      news(`怪獣、駅前のビルを殴り倒す　${downs}棟目`, `このビルの被害額 ${yen(v)}　／　累計 ${yen(money)}`);
      setTimeout(() => sfx('ガラガラガラ', 380, 380), 120);
    }
  }, 90);
}
screenEl.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; punch(); });
window.addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { if (document.activeElement && document.activeElement.tagName === 'BUTTON') return; e.preventDefault(); punch(); } if (e.key === 'c') setMode(mode === 'pov' ? 'third' : 'pov'); });
function setMode(m) {
  mode = m;
  $('mPov').setAttribute('aria-pressed', m === 'pov'); $('mThird').setAttribute('aria-pressed', m === 'third');
  $('where').textContent = m === 'pov' ? '中継：駅前ビル街（怪獣目線）' : '中継：駅前ビル街（引き）';
  povArms.forEach(a => a.visible = m === 'pov'); povSnout.visible = m === 'pov';
  camera.children.forEach(c => { if (c.isMesh && c !== povSnout) c.visible = m === 'pov'; });
  kaiju.visible = m === 'third';
  camera.fov = m === 'pov' ? 62 : 48; camera.updateProjectionMatrix();
}
$('mPov').onclick = () => setMode('pov');
$('mThird').onclick = () => setMode('third');
setMode('pov');

// ---------- resize to the TV screen ----------
function resize() {
  const w = screenEl.clientWidth, h = screenEl.clientHeight;
  renderer.setSize(w, h, false); composer.setSize(w, h);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(screenEl); resize();

// ---------- loop ----------
const clock = new THREE.Clock();
const tmp = new THREE.Vector3();
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  if (telopTimer > 0) { telopTimer -= dt; if (telopTimer <= 0) $('telop').classList.remove('on'); }
  const frozen = hitstop > 0; hitstop = Math.max(0, hitstop - dt);
  punchT = Math.min(1, punchT + dt * 2.6);
  // walk until a building is in reach
  const walking = gap() > 34;   // stop a little short so the whole building fills the view
  if (walking && !frozen) { kaiju.position.z -= dt * 26; walkPhase += dt * 7; }
  const bob = walking ? Math.abs(Math.sin(walkPhase)) * 1.4 : 0;
  const U = kaiju.userData;
  U.legs[0].rotation.x = walking ? Math.sin(walkPhase) * 0.35 : 0; U.legs[1].rotation.x = -U.legs[0].rotation.x;
  U.tail.forEach((s, i) => { s.position.x = Math.sin(walkPhase * 0.5 + i * 0.6) * i * 0.6; });
  kaiju.position.y = bob;
  // punching arms: fast out, slower back
  const ext = punchT < 0.18 ? punchT / 0.18 : Math.max(0, 1 - (punchT - 0.18) / 0.35);
  U.arms.forEach((a, i) => { a.rotation.x = i === punchSide ? -1.2 * ext : 0.1; });
  povArms.forEach((a, i) => {
    const r = a.userData.rest, p = i === punchSide ? ext : 0;
    a.position.set(r.x * (1 - 0.55 * p), r.y + 9 * p + (walking ? Math.sin(walkPhase + i * Math.PI) * 0.8 : 0), r.z - 44 * p);
    a.rotation.set(-0.15 + 0.2 * p, -a.userData.side * 0.25 * (1 - p), 0);
  });
  // cameras
  const sh = shake > 0 ? shake : 0; shake = Math.max(0, shake - dt * 4);
  const jx = (Math.random() - 0.5) * sh * 1.6, jy = (Math.random() - 0.5) * sh * 1.6;
  const target = front();
  if (mode === 'pov') {
    camera.position.set(jx, 58 + bob * 1.4 + jy, kaiju.position.z - 4);
    tmp.set(0, target ? 40 : 46, kaiju.position.z - 60);
    camera.lookAt(tmp);
    bokeh.uniforms.focus.value = target ? Math.max(20, gap() + 18) : 80;
    bokeh.uniforms.aperture.value = 0.00003;
  } else {
    // over the shoulder from the sidewalk side: the suit's back (and zipper) in front, the building beyond
    camera.position.set(30 + jx, 50 + jy, kaiju.position.z + 72);
    tmp.set(-2, 34, kaiju.position.z - 30);
    camera.lookAt(tmp);
    bokeh.uniforms.focus.value = camera.position.distanceTo(tmp);
    bokeh.uniforms.aperture.value = 0.00012;
  }
  sun.position.set(kaiju.position.x - 90, 160, kaiju.position.z + 60); sun.target.position.set(0, 0, kaiju.position.z - 30);
  // debris physics
  if (!frozen) {
    for (const c of chunks) {
      const u = c.userData;
      if (u.delay > 0) { u.delay -= dt; continue; }
      u.life += dt;
      if (u.life > 8) continue;
      u.v.y -= 60 * dt;
      c.position.addScaledVector(u.v, dt);
      c.rotation.x += u.av.x * dt; c.rotation.y += u.av.y * dt; c.rotation.z += u.av.z * dt;
      if (c.position.y < 1.5) { c.position.y = 1.5; u.v.y *= -0.25; u.v.x *= 0.6; u.v.z *= 0.6; u.av.multiplyScalar(0.5); }
    }
    for (const d of dusts) { const u = d.userData; u.life += dt; const s = d.scale.x + u.grow * dt; d.scale.set(s, s, s); d.position.y += u.vy * dt; d.material.opacity = Math.max(0, 0.85 - u.life * 0.32); }
    for (let i = dusts.length - 1; i >= 0; i--) if (dusts[i].userData.life > 2.8) { scene.remove(dusts[i]); dusts[i].material.dispose(); dusts.splice(i, 1); }
  }
  composer.render(dt);
  requestAnimationFrame(tick);
}
tick();
</script>
