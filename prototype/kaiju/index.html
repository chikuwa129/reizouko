<title>怪獣育成（仮）</title>

<style>
/* Layout: one TV screen centered in a dark studio. Everything inside the screen is sized in
   screen units (--u = 1/1200 of the screen width), so the game scales like a TV picture. */
:root {
  --studio: #15181e;
  --bezel: #2b2f37;
  --paper: #f3ecdb;
  --paper-ink: #3a2f25;
  --ink: #2f3e36;
  --telop: #0f2a4a;
  --relay: #3a6fb0;
  --red: #d33a2c;
  --gold: #ffd34d;
  --text: #f5f3ee;
  --muted: #aab3bf;
  --panel: rgba(12, 22, 38, 0.86);
  --good: #7fd18b;
  --bad: #ff8a7a;
  --f-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif;
  --f-body: 'M PLUS 1p', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--studio);
  color: var(--text);
  font-family: var(--f-body);
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  overflow-x: hidden;
}
.tv {
  width: min(100%, 1120px, calc((100dvh - 64px) * 1.6));
  padding: 10px;
  background: var(--bezel);
  border-radius: 22px;
  box-shadow: 0 0 0 2px #3a3f49 inset, 0 18px 50px rgba(0,0,0,0.5);
  box-sizing: border-box;
}
.screen {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 10;
  container-type: inline-size;
  overflow: hidden;
  border-radius: 12px;
  background: #000;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
  --u: calc(100cqw / 1200);
}
.layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#stage { position: absolute; inset: 0; }
#bg.dim { filter: brightness(0.55) saturate(0.8); }

#ui { position: absolute; inset: 0; font-size: calc(var(--u) * 24); line-height: 1.45; }
#ui * { box-sizing: border-box; }
.hint { color: var(--muted); font-size: 12px; text-align: center; max-width: 60ch; }

/* generic buttons */
.btn {
  font-family: var(--f-body);
  font-weight: 800;
  font-size: calc(var(--u) * 26);
  color: var(--telop);
  background: var(--gold);
  border: calc(var(--u) * 4) solid var(--ink);
  border-radius: calc(var(--u) * 10);
  padding: calc(var(--u) * 10) calc(var(--u) * 30);
  cursor: pointer;
  box-shadow: 0 calc(var(--u) * 5) 0 var(--ink);
}
.btn:active { transform: translateY(calc(var(--u) * 4)); box-shadow: 0 calc(var(--u) * 1) 0 var(--ink); }
.btn:focus-visible, .cmd:focus-visible { outline: calc(var(--u) * 5) solid #8fd0ff; outline-offset: calc(var(--u) * 3); }

/* proposal sheet (title) */
.sheet {
  position: absolute; inset: calc(var(--u) * 40) calc(var(--u) * 160);
  background: var(--paper); color: var(--paper-ink);
  border-radius: calc(var(--u) * 6);
  box-shadow: 0 calc(var(--u) * 12) calc(var(--u) * 40) rgba(0,0,0,0.5);
  padding: calc(var(--u) * 46) calc(var(--u) * 64);
  display: flex; flex-direction: column; gap: calc(var(--u) * 14);
  background-image: repeating-linear-gradient(transparent 0 calc(var(--u) * 47), rgba(58,47,37,0.09) calc(var(--u) * 47) calc(var(--u) * 48));
}
.sheet .meta { display: flex; justify-content: space-between; font-size: calc(var(--u) * 20); letter-spacing: 0.08em; }
.sheet h1 { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 78); margin: calc(var(--u) * 10) 0 0; letter-spacing: 0.04em; text-wrap: balance; }
.sheet .lede { font-size: calc(var(--u) * 26); margin: 0; }
.sheet ul { margin: 0; padding-left: 1.2em; font-size: calc(var(--u) * 22); }
.sheet .row { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 20); }
.stamp {
  font-family: var(--f-display); color: var(--red); border: calc(var(--u) * 6) double var(--red);
  border-radius: calc(var(--u) * 8); padding: calc(var(--u) * 4) calc(var(--u) * 18); font-size: calc(var(--u) * 34);
  transform: rotate(-9deg); opacity: 0.85;
}
.strike { text-decoration: line-through; text-decoration-thickness: calc(var(--u) * 6); text-decoration-color: var(--red); }

/* program title card */
.titlecard { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, rgba(43,77,120,0.82) 0, rgba(12,22,38,0.9) 70%); }
#fx.tod-night { filter: brightness(0.8) saturate(0.85); }
#fx.tod-morning { filter: sepia(0.12) saturate(1.08); }
.logo {
  font-family: var(--f-display); font-size: calc(var(--u) * 100); color: var(--gold); white-space: nowrap;
  -webkit-text-stroke: calc(var(--u) * 5) var(--red); paint-order: stroke fill;
  text-shadow: calc(var(--u) * 6) calc(var(--u) * 8) 0 #0a0f18; letter-spacing: 0.02em; line-height: 1.05; text-align: center;
  animation: zoomIn 0.5s cubic-bezier(.2,1.6,.4,1) both;
}
.logo small { display: block; font-size: 0.32em; -webkit-text-stroke: 0; color: #fff; text-shadow: none; letter-spacing: 0.3em; }
.ep-title { font-family: var(--f-display); font-size: calc(var(--u) * 50); color: #fff; text-align: center; animation: zoomIn 0.4s ease-out both; max-width: calc(var(--u) * 1080); margin-inline: auto; text-wrap: balance; }
.ep-title .num { display: block; color: var(--gold); font-size: 0.6em; letter-spacing: 0.2em; }
@keyframes zoomIn { from { transform: scale(1.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.skip { position: absolute; right: calc(var(--u) * 24); bottom: calc(var(--u) * 20); color: var(--muted); font-size: calc(var(--u) * 20); }

/* command menu (status + commands) */
.topbar {
  position: absolute; left: 0; right: 0; top: 0; height: calc(var(--u) * 64);
  display: flex; align-items: center; gap: calc(var(--u) * 18); padding: 0 calc(var(--u) * 22);
  background: linear-gradient(var(--panel), rgba(12,22,38,0.6));
}
.chip { font-weight: 800; border-radius: calc(var(--u) * 6); padding: calc(var(--u) * 2) calc(var(--u) * 14); font-size: calc(var(--u) * 22); white-space: nowrap; }
.chip.time { background: var(--gold); color: var(--telop); }
.chip.alert { background: #555c66; color: #fff; }
.chip.alert.lv1 { background: #6c7a3a; } .chip.alert.lv2 { background: var(--relay); } .chip.alert.lv3 { background: var(--red); } .chip.alert.lv4 { background: #8a1c6a; }
.ep { font-family: var(--f-display); font-size: calc(var(--u) * 26); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.money { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 800; font-size: calc(var(--u) * 26); color: var(--gold); white-space: nowrap; }
.money span { color: var(--muted); font-weight: 500; font-size: 0.8em; margin-right: 0.4em; }

.status {
  position: absolute; left: calc(var(--u) * 18); top: calc(var(--u) * 82); width: calc(var(--u) * 330);
  background: var(--panel); border: calc(var(--u) * 3) solid #2c4a6e; border-radius: calc(var(--u) * 12);
  padding: calc(var(--u) * 14) calc(var(--u) * 18); display: flex; flex-direction: column; gap: calc(var(--u) * 8);
}
.status h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 28); }
.stat { display: grid; grid-template-columns: calc(var(--u) * 70) 1fr calc(var(--u) * 56); align-items: center; gap: calc(var(--u) * 8); font-size: calc(var(--u) * 20); }
.bar { height: calc(var(--u) * 14); background: #233247; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--good); border-radius: 99px; }
.bar.hp i { background: linear-gradient(90deg, #ff8a7a, #ffd34d 45%, #7fd18b); }
.stat b { text-align: right; font-variant-numeric: tabular-nums; }
.belly { font-size: calc(var(--u) * 19); color: var(--muted); }

.cmds {
  position: absolute; right: calc(var(--u) * 18); top: calc(var(--u) * 82); bottom: calc(var(--u) * 18); width: calc(var(--u) * 430);
  display: flex; flex-direction: column; gap: calc(var(--u) * 8);
}
.cmds h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 26); text-shadow: 0 2px 0 #000; }
.cmd {
  display: grid; grid-template-columns: 1fr auto; gap: 0 calc(var(--u) * 10); align-items: center; text-align: left;
  font-family: var(--f-body); color: var(--text); background: var(--panel);
  border: calc(var(--u) * 3) solid #2c4a6e; border-radius: calc(var(--u) * 12);
  padding: calc(var(--u) * 7) calc(var(--u) * 16); cursor: pointer; font-size: calc(var(--u) * 19);
}
.cmd:hover:not(:disabled) { border-color: var(--gold); }
.cmd strong { font-size: calc(var(--u) * 25); font-weight: 800; }
.cmd .rest { font-size: calc(var(--u) * 17); color: var(--gold); margin-left: 0.6em; font-weight: 500; }
.cmd .what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.cmd .what { color: var(--muted); grid-column: 1 / 2; }
.cmd .risk { grid-row: 1 / 3; grid-column: 2; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.cmd .risk small { display: block; font-size: calc(var(--u) * 16); color: var(--muted); font-weight: 500; }
.cmd .risk.high { color: var(--bad); }
.cmd:disabled { opacity: 0.55; cursor: not-allowed; }
.cmd:disabled .what { color: var(--bad); }

/* in-game prompts */
.prompt {
  position: absolute; left: 50%; top: calc(var(--u) * 90); transform: translateX(-50%);
  background: var(--panel); border-radius: calc(var(--u) * 10); padding: calc(var(--u) * 8) calc(var(--u) * 24);
  font-weight: 800; font-size: calc(var(--u) * 26); white-space: nowrap; border: calc(var(--u) * 3) solid var(--gold);
}
.pads { position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 16); display: flex; justify-content: space-between; padding: 0 calc(var(--u) * 24); pointer-events: none; }
.pad {
  pointer-events: auto; width: calc(var(--u) * 210); height: calc(var(--u) * 120); border-radius: calc(var(--u) * 20);
  font-family: var(--f-display); font-size: calc(var(--u) * 34); color: #fff; background: rgba(15, 42, 74, 0.72);
  border: calc(var(--u) * 4) solid rgba(255,255,255,0.75); cursor: pointer;
}
.pad.lit { background: rgba(255, 211, 77, 0.85); color: var(--telop); }
.pad.next { border-color: var(--gold); }

/* news result */
.news {
  position: absolute; left: calc(var(--u) * 30); right: calc(var(--u) * 30); bottom: calc(var(--u) * 24);
  background: rgba(10, 24, 44, 0.94); border-radius: calc(var(--u) * 10); overflow: hidden;
  display: grid; grid-template-columns: calc(var(--u) * 170) 1fr; min-height: calc(var(--u) * 300);
  border: calc(var(--u) * 3) solid #2c4a6e;
}
.news .label {
  font-family: var(--f-display); display: grid; place-items: center; text-align: center; color: #fff;
  font-size: calc(var(--u) * 36); line-height: 1.15; padding: calc(var(--u) * 12); background: #555c66;
}
.news.lv1 .label { background: #6c7a3a; } .news.lv2 .label { background: var(--relay); } .news.lv3 .label { background: var(--red); }
.news.lv4 .label { background: linear-gradient(160deg, #8a1c6a, #d33a2c); }
.news .body { padding: calc(var(--u) * 16) calc(var(--u) * 26); display: flex; flex-direction: column; gap: calc(var(--u) * 6); min-width: 0; }
.news .head { font-weight: 800; font-size: calc(var(--u) * 34); line-height: 1.3; text-wrap: balance; }
.news ul { margin: 0; padding-left: 1.1em; font-size: calc(var(--u) * 22); color: #dfe6ee; }
.news li { animation: lineIn 0.3s ease-out both; }
@keyframes lineIn { from { opacity: 0; transform: translateX(calc(var(--u) * 20)); } }
.news .row { display: flex; align-items: flex-end; justify-content: space-between; gap: calc(var(--u) * 16); margin-top: auto; flex-wrap: wrap; }
.news .gain { font-size: calc(var(--u) * 21); color: var(--good); }
.news .gain .minus { color: var(--bad); }
.news .dmg { font-variant-numeric: tabular-nums; color: var(--gold); font-weight: 800; font-size: calc(var(--u) * 36); white-space: nowrap; }
.news .dmg small { color: var(--muted); font-weight: 500; font-size: calc(var(--u) * 20); margin-right: 0.5em; }
.news .label small { display: block; font-family: var(--f-body); font-size: calc(var(--u) * 17); font-weight: 500; opacity: 0.85; margin-top: calc(var(--u) * 6); }

/* episode end */
.board {
  position: absolute; inset: calc(var(--u) * 28); background: var(--panel); border-radius: calc(var(--u) * 14);
  border: calc(var(--u) * 3) solid #2c4a6e; padding: calc(var(--u) * 26) calc(var(--u) * 36);
  display: flex; flex-direction: column; gap: calc(var(--u) * 14); overflow: hidden;
}
.board h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 40); }
.board .kpi { display: flex; gap: calc(var(--u) * 26); flex-wrap: wrap; }
.board .kpi div { font-size: calc(var(--u) * 20); color: var(--muted); }
.board .kpi b { display: block; font-size: calc(var(--u) * 44); color: #fff; font-variant-numeric: tabular-nums; line-height: 1.1; }
.voices { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u) * 12); }
.voice { background: var(--paper); color: var(--paper-ink); border-radius: calc(var(--u) * 8); padding: calc(var(--u) * 10) calc(var(--u) * 16); font-size: calc(var(--u) * 21); transform: rotate(var(--r, 0deg)); }
.voice small { display: block; color: #7a6a58; font-size: calc(var(--u) * 16); }
.board .foot { margin-top: auto; display: flex; justify-content: flex-end; gap: calc(var(--u) * 16); align-items: center; }
.preview { font-family: var(--f-display); font-size: calc(var(--u) * 46); line-height: 1.3; color: #fff; text-wrap: balance; }
.preview em { font-style: normal; color: var(--gold); }
.bill { background: var(--paper); color: var(--paper-ink); border-radius: calc(var(--u) * 6); padding: calc(var(--u) * 20) calc(var(--u) * 30); display: flex; flex-direction: column; gap: calc(var(--u) * 6); font-size: calc(var(--u) * 22); }
.bill .line { display: flex; justify-content: space-between; gap: calc(var(--u) * 20); font-variant-numeric: tabular-nums; border-bottom: 1px dashed rgba(58,47,37,0.3); }
.bill .total { font-weight: 800; font-size: calc(var(--u) * 32); border-bottom: none; color: var(--red); }


/* dialogue (villain monologue) */
.dialog {
  position: absolute; left: calc(var(--u) * 40); right: calc(var(--u) * 40); bottom: calc(var(--u) * 30);
  min-height: calc(var(--u) * 190); background: rgba(8, 6, 18, 0.9); border: calc(var(--u) * 4) solid #7a4cff;
  border-radius: calc(var(--u) * 14); padding: calc(var(--u) * 26) calc(var(--u) * 34);
  font-size: calc(var(--u) * 32); line-height: 1.6; color: #f2ecff;
}
.dialog .who {
  position: absolute; top: calc(var(--u) * -24); left: calc(var(--u) * 28); background: #7a4cff; color: #fff;
  font-weight: 800; font-size: calc(var(--u) * 22); padding: calc(var(--u) * 4) calc(var(--u) * 18); border-radius: calc(var(--u) * 6);
}
.dialog .more { position: absolute; right: calc(var(--u) * 20); bottom: calc(var(--u) * 12); font-size: calc(var(--u) * 20); color: #b9a6ff; }
.skipbtn { position: absolute; right: calc(var(--u) * 24); top: calc(var(--u) * 20); font-size: calc(var(--u) * 20); padding: calc(var(--u) * 6) calc(var(--u) * 18); }
/* new-kaiju card */
.kcard { position: absolute; left: 50%; top: calc(var(--u) * 70); transform: translateX(-50%); text-align: center; }
.kcard .kind { color: var(--gold); font-weight: 800; letter-spacing: 0.25em; font-size: calc(var(--u) * 24); }
.kcard .kname { font-family: var(--f-display); font-size: calc(var(--u) * 80); color: #fff; -webkit-text-stroke: calc(var(--u) * 3) var(--ink); paint-order: stroke fill; line-height: 1.1; animation: zoomIn 0.4s ease-out both; }
.kcard .kpart { margin-top: calc(var(--u) * 6); display: inline-block; background: var(--panel); padding: calc(var(--u) * 6) calc(var(--u) * 18); border-radius: calc(var(--u) * 8); font-size: calc(var(--u) * 22); }
.cmds .back { align-self: flex-start; }
.pinbtn { position: absolute; width: calc(var(--u) * 100); height: calc(var(--u) * 100); border-radius: 50%; background: transparent; border: 0; cursor: pointer; }
.pinbtn:focus-visible { outline: calc(var(--u) * 5) solid #8fd0ff; }
.mapinfo { position: absolute; left: calc(var(--u) * 756); width: calc(var(--u) * 420); top: calc(var(--u) * 370); background: var(--panel); border: calc(var(--u) * 3) solid #2c4a6e; border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 16) calc(var(--u) * 20); display: flex; flex-direction: column; gap: calc(var(--u) * 8); }
.mapinfo strong { font-family: var(--f-display); font-weight: 400; font-size: calc(var(--u) * 32); }
.mapinfo p { margin: 0; font-size: calc(var(--u) * 22); }
.mapinfo .row { display: flex; gap: calc(var(--u) * 12); flex-wrap: wrap; margin-top: calc(var(--u) * 6); }
.moves { position: absolute; left: calc(var(--u) * 20); right: calc(var(--u) * 20); bottom: calc(var(--u) * 18); display: grid; grid-template-columns: repeat(auto-fit, minmax(calc(var(--u) * 260), 1fr)); gap: calc(var(--u) * 10); }
.moves .cmd { grid-template-columns: 1fr; }
.moves .cmd .what { white-space: normal; }
.cmds .note { font-size: calc(var(--u) * 19); color: var(--gold); background: var(--panel); border-radius: calc(var(--u) * 10); padding: calc(var(--u) * 6) calc(var(--u) * 14); }
.reveal { font-size: calc(var(--u) * 26); margin: 0; }
.reveal b { color: var(--red); }

#bg.cctv, #fx.cctv { filter: grayscale(1) contrast(1.15) brightness(0.9); }
@keyframes roll { from { transform: translateY(0); } to { transform: translateY(calc(-100% - var(--u) * 760)); } }
@media (prefers-reduced-motion: reduce) {
  .logo, .ep-title, .news li, .kcard .kname { animation: none; }
}
</style>

<div class="tv">
  <div class="screen" id="screen">
    <div id="stage">
      <svg id="bg" class="layer" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice" aria-hidden="true"></svg>

  </div>
</div>
<p class="hint">横向き推奨。タップ / クリック、またはキーボード（スペース・Enter・←→）で遊べます。試作版：全13話（1クール）。</p>

<script>
'use strict';
/* =====================================================================
   ART  (SVG strings, coordinates in a 1200x750 frame)
   ===================================================================== */
const INK = '#2f3e36';
const PALETTES = [
  { id: 'green', name: '緑', skin: '#6f9a7a', snout: '#7aa585', dark: '#5c8466', belly: '#ead9ad', line: '#c9b583', spike: '#e2a64c' },
  { id: 'red', name: '赤', skin: '#b4574a', snout: '#c46a5c', dark: '#8f4038', belly: '#f0d6a8', line: '#cfae7a', spike: '#3b3b3b' },
  { id: 'blue', name: '青', skin: '#5e7fa6', snout: '#7092b8', dark: '#48688c', belly: '#dfe6ea', line: '#b8c4cc', spike: '#9fe3ff' },
  { id: 'purple', name: '紫', skin: '#7e649a', snout: '#9078ab', dark: '#634d7c', belly: '#efe2c0', line: '#cdbb8d', spike: '#ffd34d' },
  { id: 'ochre', name: '黄土色', skin: '#b99a4a', snout: '#c8aa5c', dark: '#94783a', belly: '#f3ead0', line: '#d6c69c', spike: '#6b3f2a' },
  { id: 'gray', name: '灰色', skin: '#7b7f86', snout: '#8d9198', dark: '#5f6369', belly: '#e8d9c0', line: '#c7b89e', spike: '#d33a2c' },
];
const EYES = { dot: 'つぶら', slant: 'つり目', cyclops: '一つ目', tri: '三つ目', half: '半目' };
const SPIKES = { round: '丸い背びれ', crystal: '結晶の背びれ', plate: '板状の背びれ' };
const PATTERNS = { none: '無地', spots: 'まだら模様', stripes: 'しま模様' };
const BASE_LOOK = { ...PALETTES[0], base: 'dino', eyes: 'dot', spikes: 'round', pattern: 'none' };
let LOOK = BASE_LOOK;

/* ---------- nunchaku kata (2D) ---------- */
const easeOut = t => 1 - (1 - t) * (1 - t);
const easeInOut = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function makeTrack(keys) {
  return f => {
    let i = 0;
    while (i < keys.length - 1 && keys[i + 1].f <= f) i++;
    const a = keys[i], b = keys[Math.min(i + 1, keys.length - 1)];
    if (a === b || f <= a.f) return { ...a, behind: !!a.behind };
    const t0 = (f - a.f) / (b.f - a.f);
    const t = (b.ease || easeInOut)(Math.min(1, Math.max(0, t0)));
    const L = k => a[k] + (b[k] - a[k]) * t;
    return { hx: L('hx'), hy: L('hy'), psi: L('psi'), phi: L('phi'), behind: !!((a.behind && b.behind) || (b.behind && t0 > 0.6) || (a.behind && t0 < 0.4)) };
  };
}
function kataGeom(st) {
  const dx = Math.cos(st.psi * D2R), dy = Math.sin(st.psi * D2R);
  const tx = st.hx + 150 * dx, ty = st.hy + 150 * dy;
  const fx = Math.cos(st.phi * D2R), fy = Math.sin(st.phi * D2R);
  return { held: (href) => carBetween(st.hx - 12 * dx, st.hy - 12 * dy, tx, ty, { href }), tx, ty, ax: tx + 38 * fx, ay: ty + 38 * fy, bx: tx + 198 * fx, by: ty + 198 * fy };
}
function kataKaiju(track, f, o = {}) {
  const st = track(f), g = kataGeom(st);
  let nun = '';
  if (!o.snapped) {
    let ghosts = '';
    for (const [k, op] of [[0.5, 0.32], [1.0, 0.16]]) {
      if (f - k < 0 || o.noGhost) continue;
      const s2 = track(f - k);
      if (Math.abs(s2.phi - st.phi) < 12) continue;
      const g2 = kataGeom(s2);
      ghosts += carBetween(g2.ax, g2.ay, g2.bx, g2.by, { op, href: o.href });
    }
    nun = ghosts + `<path d="M${g.tx} ${g.ty} L ${g.ax} ${g.ay}" stroke="${INK}" stroke-width="9" fill="none" stroke-dasharray="8 6" stroke-linecap="round"/>` + carBetween(g.ax, g.ay, g.bx, g.by, { href: o.href });
  }
  const behind = st.behind;
  return (behind ? nun : '') + kb() + arm(st.hx, st.hy) + head(o.expr || 'serious', o.tilt || 0) + (behind ? '' : nun) +
    g.held(o.href) + `<circle cx="${st.hx}" cy="${st.hy}" r="27" fill="${LOOK.skin}" stroke="${INK}" stroke-width="5"/>`;
}

function swimmer(cx, cy, s, rot, beta, o = {}) {

function bgFor(loc = G.loc, tod) {

const isEmpty = loc => Object.values(G.stock[loc]).every(n => n <= 0);
function checkRuins() {
  for (const loc of Object.keys(LOCS)) if (isEmpty(loc) && G.ruin[loc].at === null) { G.ruin[loc].at = G.ep; G.ruin[loc].count++; }
}
const repairLeft = loc => G.ruin[loc].count - (G.ep - G.ruin[loc].at);   // 1st time: next episode, 2nd: two episodes, ...
function doRepairs() {
  const fixed = [];
  for (const loc of Object.keys(LOCS)) {
    const r = G.ruin[loc];
    if (r.at === null || repairLeft(loc) > 0) continue;
    for (const [a, d] of Object.entries(LOCS[loc].acts)) G.stock[loc][a] = d.n;
    if (loc === 'city') { G.flags.blackout = false; G.flags.cracks = false; G.city = makeCity(); }
    if (loc === 'dam') G.flags.damBroken = false;
    r.at = null; fixed.push(loc);
  }
  return fixed;
}
function withRepairNews(next) {
  const fixed = G.repaired || []; G.repaired = [];
  if (!fixed.length) return next();
  const names = fixed.map(l => LOCS[l].name).join('と');
  G.turn = Math.min(G.turn, 0);
  showNews({
    loc: fixed[0], ok: true,
    head: `人間たちの努力で、${names}が復旧`,
    lines: ['作業員のべ12万人が昼夜をとわず復旧にあたった', '担当者「次に壊されたら、直すのにもっと時間がかかります」', '怪獣が戻ってこないことを祈る声も'],
    gains: {}, dmg: 0, alert: -15, cat: '復旧',
  }, next);
}
function flattenRate() {
  const tot = G.city.length + Object.values(LOCS).reduce((a, l) => a + Object.values(l.acts).reduce((x, d) => x + d.n, 0), 0);
  const gone = G.city.filter(b => b.st >= 2).length + Object.entries(G.stock).reduce((a, [loc, st]) => a + Object.entries(st).reduce((x, [id, n]) => x + (LOCS[loc].acts[id].n - n), 0), 0);
  return Math.round(100 * gone / tot);
}

/* =====================================================================
   RUNTIME (fixed 20 fps animation clock)
   ===================================================================== */
const $bg = document.getElementById('bg');
const $fx = document.getElementById('fx');
const $ui = document.getElementById('ui');
const $stage = document.getElementById('stage');
const $screen = document.getElementById('screen');
let scene = null, frame = 0, acc = 0, last = 0, dirty = true;

function setScene(sc) {
  scene = sc; frame = 0; acc = 0; dirty = true;
  $stage.style.transform = '';
  if (sc.bg !== undefined) $bg.innerHTML = typeof sc.bg === 'function' ? sc.bg() : sc.bg;
  $bg.className.baseVal = 'layer ' + (sc.bgClass || '');
  $fx.className.baseVal = 'layer ' + (sc.fxClass || '') + (sc.noTod ? '' : ' tod-' + TOD);
  $ui.innerHTML = '';
  if (sc.enter) sc.enter();
}
function loop(ts) {
  if (!last) last = ts;
  acc += Math.min(250, ts - last); last = ts;
  while (acc >= 50) {
    acc -= 50;
    if (scene && scene.tick) { scene.tick(frame); dirty = true; }
    frame++;
  }
  if (dirty && scene) {
    dirty = false;
    if (scene.draw) { const s = scene.draw(frame); if (s !== null) $fx.innerHTML = DEFS_DYN + s; }
    const sh = scene.shake ? scene.shake(frame) : null;
    $stage.style.transform = sh ? `translate(${sh[0] / 12}cqw, ${sh[1] / 12}cqw)` : '';
  }
  requestAnimationFrame(loop);
}
$screen.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  if (!scene) return;
  if (scene.onSide) {
    const r = $screen.getBoundingClientRect();
    scene.onSide(e.clientX - r.left < r.width / 2 ? 'L' : 'R');
  } else if (scene.onTap) scene.onTap(e);
});
window.addEventListener('keydown', e => {
  if (!scene) return;
  if ((e.key === 'ArrowLeft' || e.key === 'a') && scene.onSide) { scene.onSide('L'); e.preventDefault(); return; }
  if ((e.key === 'ArrowRight' || e.key === 'd') && scene.onSide) { scene.onSide('R'); e.preventDefault(); return; }
  if ((e.key === 'ArrowUp' || e.key === 'w') && scene.onSide) { scene.onSide('T'); e.preventDefault(); return; }
  if (e.key === ' ' || e.key === 'Enter') {
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
    if (scene.onTap) { scene.onTap(e); e.preventDefault(); }
    else if (scene.onSide && scene.wantsTap) { scene.onSide('T'); e.preventDefault(); }
  }
});
const h = (html) => { $ui.innerHTML = html; };
const focusBtn = id => { const b = document.getElementById(id); if (b) b.focus(); return b; };

      else { msg = have ? `${L.name}には、まだ使えそうなものが${have}種類ありそう。` : '何もなさそう。'; btn = `<button class="btn" id="go">${L.name}へ行く</button>`; }
      h(`${Object.entries(MAP_PINS).filter(([k]) => statusOf(k) !== 'locked').map(([k, [x, y]]) =>
          `<button class="pinbtn" data-k="${k}" style="left:calc(var(--u)*${x - 50});top:calc(var(--u)*${y - 50})" aria-label="${LOCS[k].name}"></button>`).join('')}
        <div class="mapinfo"><strong>${L.name}</strong><p>${msg}</p><div class="row">${btn}<button class="btn back" id="back">もどる</button></div></div>`);
      $ui.querySelectorAll('.pinbtn').forEach(b => b.onclick = () => { sel = b.dataset.k; dirty = true; this.ui(); });
      const go = document.getElementById('go'); if (go) { go.onclick = () => sceneMove(sel); go.focus(); }
      document.getElementById('back').onclick = () => sceneMenu();
    },
  });
}

// ---- move: walk off to search somewhere else ----
function sceneMove(dest) {
  countAct('move');
  setScene({
    bg: () => bgFor(),
    tick(f) { if (f > 40) this.finish(); },
    onTap() { if (frame > 8) this.finish(); },
    draw(f) {
      const x = -120 + f * 22, bob = Math.abs(Math.sin(f * 0.5)) * -14;
      let out = `<g transform="translate(${x} ${bob})">${kb()}${arm(735, 470)}${head('serious')}</g>`;
      if (f % 10 < 5) out += sfx(200 + f * 10, 600, 'のっし', 40, 0);
      return out + liveBadge('中継：' + here().name);
    },
    finish() {
      if (this.ended) return; this.ended = true;
      const from = here().name;
      G.loc = dest;
      G.epLog.push('move');
      showNews({
        loc: dest, ok: true,
        head: `怪獣、${from}を離れ${LOCS[dest].name}方面へ`,
        lines: ['「何かを探しているようだった」と目撃者', '移動ルートの国道が足あとで陥没', `${LOCS[dest].name}の周辺に注意が呼びかけられている`],
        gains: { hp: -5 }, dmg: 0.4e9, alert: 4, kpop: 1, cat: '道路',
      });
    },
  });
}

// ---- minigame: nunchaku kata (rhythm) ----
function sceneNunchaku() {
  const LEAD = 34;
  const BEATS = [
    { f: 11, label: '振り下ろし' }, { f: 22, label: '受け' }, { f: 34, label: '持ち替え' },
    { f: 47, label: '振り下ろし' }, { f: 58, label: '受け' }, { f: 87, label: 'キメ' },
  ];
  const W = clamp(2.3 * (0.55 + 0.45 * G.hp / 100) * (1 + G.tec / 120), 1.3, 4.2);
  const S = { mode: 'play', judged: BEATS.map(() => null), failAt: 0, failK: 0, flash: null };
  const th = thingHere('nunchaku'), href = th.href, locName = here().name;
  G.stock[G.loc].nunchaku -= 1;
  const k = f => f - LEAD;
  setScene({
    bg: () => bgFor(),
    enter() { h(`<div class="prompt">マーカーが円に重なった瞬間にタップ！</div>`); },
    tick(f) {
      const kk = k(f);
      if (S.mode === 'play') {
        if (kk === 0) $ui.innerHTML = '';
        BEATS.forEach((b, i) => { if (S.judged[i] === null && kk > b.f + W) { S.judged[i] = 'miss'; this.fail(f, kk); } });
        if (kk >= 112) this.finish(true);
      } else if (S.mode === 'fail' && f - S.failAt > 66) this.finish(false);
    },
    fail(f, kk) { if (S.mode !== 'play') return; S.mode = 'fail'; S.failAt = f; S.failK = clamp(kk, 0, 111); },
    onTap() {
      if (S.mode !== 'play') return;
      const kk = k(frame);
      let best = -1, bd = 1e9;
      BEATS.forEach((b, i) => { if (S.judged[i] === null) { const d = Math.abs(kk - b.f); if (d < bd) { bd = d; best = i; } } });
      if (best < 0) return;
      if (bd <= W) { S.judged[best] = bd <= W / 2 ? 'great' : 'good'; S.flash = { f: frame, text: bd <= W / 2 ? 'カンペキ' : 'よし' }; }
      else if (bd <= 9) { S.judged[best] = 'miss'; this.fail(frame, kk); }
    },
    shake(f) {
      if (S.mode === 'play') { const kk = k(f); for (const sf of [11, 47]) if (kk >= sf && kk < sf + 3) return [[12, -6], [-9, 5], [5, -2]][kk - sf]; }
      else if (S.mode === 'fail') { const j = f - S.failAt; if (j < 5) return [[14, -6], [-12, 8], [9, -4], [-6, 3], [3, -1]][j]; }
      return null;
    },
    draw(f) {
      const kk = k(f);
      let out = '';
      if (S.mode === 'play') {
        out += kataAt(clamp(kk, 0, 111), { href });
        if (kk >= 11 && kk < 19) out += dust(kk - 11, 380);
        if (kk >= 11 && kk < 18) out += sfx(250, 520, 'ズドン', 56, -6);
        if (kk >= 47 && kk < 55) out += mirror(dust(kk - 47, 380));
        if (kk >= 47 && kk < 54) out += sfx(800, 520, 'ズドン', 56, 6);
        if (kk >= 22 && kk < 31) out += sfx(760, 250, 'フッ', 44, 0);
        if (kk >= 31 && kk < 38) out += sfx(780, 300, 'クルッ', 44, 8);
        if (kk >= 69 && kk < 87) out += sfx(120, 150, 'ヒュンヒュン', 40, 10);
        if (kk >= 87) out += sfx(110, 270, 'アチョー', 64, 8) + star(640, 250, 16, '#fff6a8');
        if (kk >= 95) out += `<g><rect x="420" y="80" width="360" height="60" rx="8" fill="#fff" stroke="${INK}" stroke-width="4"/>
          <text x="600" y="122" font-family="${SFX_FONT}" font-size="34" fill="${INK}" text-anchor="middle">型、完了。</text></g>`;
        if (S.flash && f - S.flash.f < 8) out += sfx(560, 190, S.flash.text, 40, -6);
        out += `<rect x="0" y="650" width="1200" height="100" fill="#0f2a4a" opacity="0.8"/>
          <circle cx="170" cy="700" r="${30 + W * 4}" fill="#ffd34d" opacity="0.25"/>
          <circle cx="170" cy="700" r="34" fill="none" stroke="#ffd34d" stroke-width="6"/>`;
        BEATS.forEach((b, i) => {
          const x = 170 + (b.f - kk) * 16;
          if (x < 110 || x > 1240) return;
          const j = S.judged[i];
          const col = j === 'great' ? '#7fd18b' : j === 'good' ? '#bfe6f5' : '#fff';
          out += `<circle cx="${x}" cy="700" r="24" fill="${col}" stroke="${INK}" stroke-width="5"/>
            <text x="${x}" y="676" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="22" fill="#fff" text-anchor="middle">${b.label}</text>`;
        });
      } else {
        const j = f - S.failAt;
        const kf = S.failK, mir = kf >= 34;
        if (j < 6) {
          out += kataAt(kf, { expr: 'dizzy', tilt: -10, noGhost: true, href }) + star(mir ? 655 : 545, 270, 70 - j * 6) + sfx(330, 220, 'ゴンッ', 64, -8);
        } else {
          const hand = `${kb()}${carBetween(765, 390, 810, 550, { href })}${arm(770, 400)}`;
          const t = clamp((j - 6) / 13, 0, 1);
          const fly = j < 20 ? `<use href="#${href}" transform="translate(${560 - 410 * t} ${330 + 65 * t - 260 * Math.sin(Math.PI * t)}) rotate(${j * 47}) scale(${1 - 0.85 * t})"/>` : '';
          const e = j - 20;
          const boom = e >= 0 && e < 22 ? `<circle cx="140" cy="380" r="${10 + Math.min(e, 10) * 9}" fill="#ffd34d" opacity="${Math.max(0, 0.9 - e * 0.05)}"/>
            <circle cx="140" cy="380" r="${6 + Math.min(e, 10) * 6}" fill="#ff8a3d" opacity="${Math.max(0, 0.9 - e * 0.05)}"/>` : '';
          const smoke = e >= 0 ? `<g fill="#6d6d6d" opacity="${Math.min(0.85, e * 0.08)}"><circle cx="130" cy="${360 - e * 3}" r="${20 + e * 1.2}"/><circle cx="160" cy="${340 - e * 3.5}" r="${16 + e}"/></g>` : '';
          const body = (mir ? mirror : (x => x))(hand + head(e > 6 ? 'surprised' : 'dizzy', e > 6 ? 0 : -6 + 4 * Math.sin(j)));
          out += boom + smoke + body + fly;
          if (j < 14) out += sfx(250, 160, 'ひゅ〜', 40, -20);
          if (e >= 0 && e < 10) out += sfx(60, 300, 'ドーン', 40, -6);
          if (e > 6) out += sfx(mir ? 380 : 760, 230, 'あ', 60, 0);
        }
      }
      return out + liveBadge('中継：' + locName);
    },
    finish(ok) {
      if (this.ended) return; this.ended = true;
      const greats = S.judged.filter(x => x === 'great').length;
      const restTxt = `残りの${th.thing}：${G.stock[G.loc].nunchaku}${th.unit}`;
      if (ok) {
        const perfect = greats === BEATS.length;
        G.epLog.push(perfect ? 'kataPerfect' : 'kata');
        showNews({
          loc: G.loc, ok: true,
          head: perfect ? `怪獣、${th.thing}でヌンチャクの型を完璧に披露` : `怪獣、${locName}で${th.thing}をヌンチャクにしてトレーニング`,
          lines: [`${th.thing}を1${th.unit}使用、周辺の地面に深いひび`, perfect ? '専門家「持ち替えの所作が美しい。教本に載せたい」' : '近隣の住民「朝から地響きで目が覚めた」', restTxt],
          gains: { tec: perfect ? 9 : 6, pow: 5, hp: -25 }, dmg: 1.2e9 + greats * 0.1e9, alert: 12, kpop: perfect ? 8 : 4,
          cat: '交通', flags: G.loc === 'city' ? { cracks: true } : null,
        });
      } else {
        G.stock[G.loc].nunchaku = Math.max(0, G.stock[G.loc].nunchaku - 1);
        G.flags.blackout = true;
        G.epLog.push('kataFail');
        showNews({
          loc: G.loc, ok: false,
          head: `すっぽ抜けた${th.thing}が隣県に落下　変電所が停止し3県で停電`,
          lines: ['怪獣はヌンチャクの型の途中で自分の頭を強打した模様', `落下した${th.thing}は隣県の変電所に直撃`, '3県の約40万世帯で停電、信号機も停止', `回収不能のものを含め、${restTxt}`],
          gains: { tec: 2, pow: 2, hp: -25 }, dmg: 12.1e9, alert: 26, kpop: 2, hpop: 4, cat: '交通・電力',
        });
      }
    },
  });
}

// ---- minigame: power-line jump rope ----
function sceneRope() {
  const J = Math.round(14 * (0.72 + 0.28 * G.hp / 100) * (1 + G.sta / 200));
  const GOAL = 8;
  const S = { mode: 'intro', phi: Math.PI, om: 0.2, jumpT: -1, count: 0, failAt: 0 };
  setScene({
    bg: () => bgFor(),
    enter() { h(`<div class="prompt">縄が足もとに来たらタップでジャンプ！（${GOAL}回）</div>`); },
    yoff() { return S.jumpT >= 0 ? -120 * Math.sin(Math.PI * S.jumpT / J) : 0; },
    tick(f) {
      if (S.mode === 'intro') { if (f >= 28) { S.mode = 'play'; $ui.innerHTML = ''; } return; }
      if (S.mode === 'play') {
        if (S.jumpT >= 0) { S.jumpT++; if (S.jumpT >= J) S.jumpT = -1; }
        S.phi += S.om;
        if (S.phi >= 2 * Math.PI) {
          S.phi -= 2 * Math.PI;
          if (this.yoff() < -38) { S.count++; S.om = Math.min(0.36, S.om + 0.015); if (S.count >= GOAL) { S.mode = 'done'; S.doneAt = f; } }
          else { S.mode = 'fail'; S.failAt = f; }
        }
      } else if (S.mode === 'done' && f - S.doneAt > 30) this.finish(true);
      else if (S.mode === 'fail' && f - S.failAt > 56) this.finish(false);
    },
    onTap() { if (S.mode === 'play' && S.jumpT < 0) S.jumpT = 0; },
    shake(f) { if (S.mode === 'fail') { const j = f - S.failAt; if (j < 5) return [[12, -6], [-10, 6], [7, -3], [-4, 2], [2, -1]][j]; if (j >= 22 && j < 26) return [[0, 14], [0, -10], [0, 6], [0, -2]][j - 22]; } return null; },
    draw(f) {
      let out = '';
      if (S.mode !== 'fail') {
        const y = this.yoff();
        const LH = [430, 450 + y], RH = [770, 440 + y];
        const target = 445 + 255 * Math.cos(S.phi) + y;
        const cy = 2 * target - (LH[1] + RH[1]) / 2;
        const rope = `<path d="M${LH[0]} ${LH[1]} Q 600 ${cy} ${RH[0]} ${RH[1]}" stroke="#1d1d1d" stroke-width="12" fill="none"/><path d="M${LH[0]} ${LH[1]} Q 600 ${cy} ${RH[0]} ${RH[1]}" stroke="#8a8a8a" stroke-width="4" fill="none"/>`;
        const front = Math.sin(S.phi) > 0;
        const k = `<g transform="translate(0 ${y})">${torso()}${backArm(430, 450)}${arm(770, 440)}${head(S.mode === 'done' ? 'happy' : 'serious')}</g>`;
        out += `<ellipse cx="600" cy="668" rx="${150 + y * 0.4}" ry="16" fill="#000" opacity="0.18"/>`;
        out += (front ? '' : rope) + k + (front ? rope : '');
        if (Math.cos(S.phi) > 0.93 && S.mode === 'play') out += sfx(640, 720, 'バチッ', 32, 0);
        out += `<text x="1160" y="110" font-family="${SFX_FONT}" font-size="60" fill="#fff" stroke="${INK}" stroke-width="8" paint-order="stroke" text-anchor="end">${S.count} / ${GOAL}</text>`;
        if (S.mode === 'done') out += sfx(360, 220, 'ピタッ', 56, -6);
      } else {
        const j = f - S.failAt;
        const t = clamp((j - 5) / 16, 0, 1);
        const rot = 75 * easeInOut(t), x = 600 + 260 * easeInOut(t), yy = 450 + 90 * easeInOut(t);
        const tangle = `<path d="M560 640 q 40 -30 80 0 q 40 30 80 0" stroke="#2e2e2e" stroke-width="7" fill="none"/>`;
        out += `<g transform="translate(${x - 600} ${yy - 450}) rotate(${rot} 600 640)">${kb()}${arm(735, 470)}${head(j < 22 ? 'surprised' : 'dizzy')}${tangle}</g>`;
        if (j < 6) out += star(600, 650, 60 - j * 6) + sfx(380, 560, 'バチバチッ', 48, -6);
        if (j >= 22 && j < 30) out += sfx(820, 430, 'ドシーン', 56, -6);
        if (j >= 28) out += `<rect width="1200" height="750" fill="#fff" opacity="${Math.max(0, 0.9 - (j - 28) * 0.3)}"/>`;
        if (j >= 31) out += `<rect width="1200" height="750" fill="#07102a" opacity="${Math.min(0.6, (j - 31) * 0.1)}"/>` + sfx(480, 300, 'ブツッ', 64, 0);
      }
      return out + liveBadge('中継：' + here().name);
    },
    finish(ok) {
      if (this.ended) return; this.ended = true;
      if (ok) {
        G.stock[G.loc].rope -= 1;
        G.epLog.push('rope');
        showNews({
          loc: G.loc, ok: true,
          head: `怪獣、${thingHere('rope').thing}を引き抜いて縄跳び　8回連続`,
          lines: ['跳ぶたびに火花、一帯で瞬間的な停電が8回', '電力会社「縄跳びは想定していなかった」', `使える送電線：残り${G.stock[G.loc].rope}本`],
          gains: { sta: 6, tec: 4, hp: -25 }, dmg: 0.8e9, alert: 10, kpop: 5, cat: '電力',
        });
      } else {
        G.stock[G.loc].rope = 0; G.flags.blackout = true;
        G.epLog.push('ropeFail');
        showNews({
          loc: 'city', ok: false,
          head: '怪獣、送電線の縄跳びで足を取られ変電所に転倒　県全域で停電',
          lines: ['電線が足に絡まり、そのまま変電所へ倒れ込んだ', '県内全域で停電、復旧のめどは立っていない', '送電線はすべて使用不能に'],
          gains: { sta: 2, tec: 1, hp: -25 }, dmg: 25.4e9, alert: 28, kpop: 2, hpop: 5, cat: '電力',
        });
      }
    },
  });
}

// ---- minigame: dam lake front crawl ----
function sceneSwim() {
  const LV = 420;
  const tw = 0.075 * (0.6 + 0.4 * G.hp / 100) * (1 + G.tec / 150);
  const P = 12, FIRST = 24;                      // a stroke every P frames; arms enter the water on the beat
  const W = clamp(2.4 * (0.6 + 0.4 * G.hp / 100) * (1 + G.tec / 150), 1.4, 3.6);
  const base = 2.4 + G.sta / 60;
  const S = { mode: 'swim', x: 170, vx: base, beta: 30, judged: {}, flash: null, turnAt: 0, p: 0, endAt: 0, startF: 0 };
  const beatAt = k => FIRST + k * P;
  setScene({
    bg: () => bgFor('dam'),
    enter() { h(`<div class="prompt" id="pr">手が水に入る瞬間にタップで加速！（外しても泳ぎ続ける）</div>`); },
    onTap() {
      if (S.mode === 'swim') {
        const k = Math.round((frame - FIRST) / P);
        if (k < 0 || S.judged[k]) return;
        const d = Math.abs(frame - beatAt(k));
        if (d <= W) { S.judged[k] = 'hit'; S.vx += 2.6 * (1 + G.sta / 160); S.flash = { f: frame, text: d <= W / 2 ? 'ナイス' : 'よし' }; }
        else S.judged[k] = 'miss';
      } else if (S.mode === 'turn') {
        S.mode = Math.abs(S.p - 0.7) <= tw ? 'good' : 'bad'; S.endAt = frame;
      }
    },
    tick(f) {
      if (f === 50) { const pr = document.getElementById('pr'); if (pr) pr.remove(); }
      if (S.mode === 'swim') {
        S.x += S.vx; S.vx = Math.max(base, S.vx * 0.93);
        S.beta = 30 + 180 * (f - FIRST) / P;
        if (S.x >= 620) {
          S.mode = 'turn'; S.turnAt = f;
          h(`<div class="prompt">ターン！　針が黄色に入った瞬間にタップ</div>`);
        }
      } else if (S.mode === 'turn') {
        S.p = (f - S.turnAt) / 34;
        if (S.p > 1.05) { S.mode = 'bad'; S.endAt = f; }
      } else if (S.mode === 'good' || S.mode === 'bad') {
        if (f - S.endAt === 1) $ui.innerHTML = '';
        if (S.mode === 'good' && f - S.endAt > 40) this.finish(true);
        if (S.mode === 'bad' && f - S.endAt > 70) this.finish(false);
      }
    },
    shake(f) { if (S.mode === 'bad') { const j = f - S.endAt - 10; if (j >= 0 && j < 4) return [[12, -5], [-10, 6], [7, -3], [-4, 2]][j]; } return null; },
    draw(f) {
      let out = '';
      if (S.mode === 'swim' || S.mode === 'turn') {
        const sp = ((f - FIRST) / P) % 4, br = sp > 2.2 && sp < 3.4 ? Math.sin((sp - 2.2) / 1.2 * Math.PI) : 0;   // breathe every 4th stroke
        const sw = swimmer(S.x, LV + 2 + 4 * Math.sin(f * 0.9), 0.5, 90, S.beta, { breathe: br, wag: 25 * Math.sin(f * (0.6 + S.vx * 0.15)) });
        const [hx, hy] = sw.hand;
        out += waterClip(sw.far + sw.body + sw.near, LV);
        if (S.vx > 0.8) out += `<g fill="#fff" opacity="0.9"><ellipse cx="${S.x - 175}" cy="${LV - 4 - 8 * Math.abs(Math.sin(f * 1.3))}" rx="${16 + 6 * Math.sin(f * 1.3)}" ry="8"/><ellipse cx="${S.x - 150}" cy="${LV - 2}" rx="12" ry="6"/></g>`;
        if (hy > LV - 10 && hy < LV + 30 && hx > S.x && S.vx > 1) out += `<ellipse cx="${hx}" cy="${LV}" rx="26" ry="9" fill="#fff" opacity="0.95"/>` + sfx(hx - 30, LV - 50, 'バシャ', 32, -6);
        if (br > 0.6) out += sfx(S.x + 40, LV - 90, 'ぷはっ', 34, 0);
        if (S.flash && f - S.flash.f < 8) out += sfx(S.x + 60, LV - 130, S.flash.text, 36, -4);
        if (S.mode === 'swim') {
          out += `<rect x="0" y="650" width="1200" height="100" fill="#0f2a4a" opacity="0.8"/>
            <circle cx="170" cy="700" r="${30 + W * 4}" fill="#ffd34d" opacity="0.25"/><circle cx="170" cy="700" r="34" fill="none" stroke="#ffd34d" stroke-width="6"/>`;
          const k0 = Math.max(0, Math.floor((f - FIRST) / P) - 1);
          for (let k = k0; k < k0 + 8; k++) {
            const x = 170 + (beatAt(k) - f) * 16;
            if (x < 110 || x > 1240) continue;
            const j = S.judged[k];
            out += `<circle cx="${x}" cy="700" r="20" fill="${j === 'hit' ? '#7fd18b' : j === 'miss' ? '#888' : '#fff'}" stroke="${INK}" stroke-width="5"/>`;
          }
        }
        const prog = clamp((S.x - 170) / 450, 0, 1);
        out += `<rect x="300" y="160" width="600" height="14" rx="7" fill="#0f2a4a" opacity="0.7"/><rect x="300" y="160" width="${600 * prog}" height="14" rx="7" fill="#ffd34d"/>
          <text x="910" y="174" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="20" fill="#fff" stroke="${INK}" stroke-width="4" paint-order="stroke">壁まで</text>`;
        if (S.mode === 'turn') {
          const cx = 600, cy = 260, r = 90;
          const ang = p => (200 + p * 140) * D2R;
          const arc = (p0, p1, col, w) => `<path d="M${cx + r * Math.cos(ang(p0))} ${cy + r * Math.sin(ang(p0))} A ${r} ${r} 0 0 1 ${cx + r * Math.cos(ang(p1))} ${cy + r * Math.sin(ang(p1))}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;
          out += `<circle cx="${cx}" cy="${cy}" r="${r + 30}" fill="#0f2a4a" opacity="0.75"/>` + arc(0, 1, '#556', 18) + arc(0.7 - tw, 0.7 + tw, '#ffd34d', 20) +
            `<line x1="${cx}" y1="${cy}" x2="${cx + (r + 12) * Math.cos(ang(clamp(S.p, 0, 1)))}" y2="${cy + (r + 12) * Math.sin(ang(clamp(S.p, 0, 1)))}" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
            <text x="${cx}" y="${cy + 40}" font-family="${SFX_FONT}" font-size="30" fill="#fff" text-anchor="middle">ターン</text>`;
        }
      } else {
        const j = f - S.endAt;
        if (j < 10) {
          const t = j / 9, rot = 90 + 180 * easeInOut(t);
          const sw = swimmer(S.x + 70 * t, LV + 22 + 70 * Math.sin(Math.PI * Math.min(1, t * 1.1)), 0.5, rot, 200 + j * 10, {});
          out += waterClip(sw.far + sw.body + sw.near, LV) + sfx(500, LV - 70, 'クイックターン', 36, -4);
        } else if (S.mode === 'good') {
          const t = clamp((j - 10) / 30, 0, 1);
          const sw = swimmer(700 - 260 * easeOut(t), LV + 40 - 30 * t, 0.5, 270, 330 + j * 8, {});
          out += waterClip(sw.far + sw.body + sw.near, LV) + sfx(520, 240, 'スーッ', 48, -4) + sfx(380, 330, 'きれいなターン', 36, 0);
        } else {
          const k = j - 10;
          if (k < 6) {
            const sw = swimmer(700 - k * 4, LV + 92, 0.5, 270, 330, {});
            out += waterClip(sw.far + sw.body + sw.near, LV) + star(822, LV + 95, 60 - k * 5) + sfx(600, 360, 'ドンッ', 60, -6);
          } else if (k < 16) {
            const c = k - 6;
            const sw = swimmer(640, LV + 30, 0.5, 220 - c * 4, 330, { expr: c > 4 ? 'surprised' : 'serious' });
            out += waterClip(sw.far + sw.body + sw.near, LV) + `<g stroke="${INK}" stroke-width="3" fill="none"><path d="M840 300 L850 360 L835 410 L858 470 L845 ${520 + c * 4}"/>
              ${c > 3 ? '<path d="M850 360 L875 380"/><path d="M835 410 L822 440"/>' : ''}</g>` + (c > 4 ? sfx(520, 280, 'ピシッ…', 42, -4) : '');
          } else {
            if (k === 16) $bg.innerHTML = DEFS_BG();
            const t = clamp((k - 16) / 44, 0, 1);
            const lv = LV + 150 * Math.min(1, t * 1.6), flood = Math.min(1, t * 1.4);
            const kx = 760 + 330 * t, ky = 470 + 70 * t - 30 * Math.sin(t * 9);
            out += damBg(lv, 1, flood) + kaijuAt(kx, ky, 0.5, k * 22, 'surprised') + (k < 30 ? sfx(900, 260, 'ドドドド', 48, -8) : sfx(Math.min(kx - 80, 1050), ky - 120, 'あ〜', 50, 0));
          }
        }
      }
      return out + liveBadge('中継：' + LOCS.dam.name);
    },
    finish(ok) {
      if (this.ended) return; this.ended = true;
      if (ok) {
        G.stock.dam.swim -= 1;
        G.epLog.push('swim');
        showNews({
          loc: 'dam', ok: true,
          head: '怪獣、ダム湖で本格クロール　ターンも完璧',
          lines: ['息継ぎは4かきに1回、教科書どおりのフォーム', '大波でボート乗り場が流される', 'ダム管理事務所「壁を蹴る瞬間は生きた心地がしなかった」'],
          gains: { sta: 8, hp: -30 }, dmg: 0.25e9, alert: 6, kpop: 5, cat: '水道・観光',
        });
      } else {
        G.stock.dam.swim = 0; G.flags.damBroken = true;
        G.epLog.push('damFail');
        showNews({
          loc: 'dam', ok: false,
          head: 'ダム決壊　怪獣ごと下流へ　流域に避難指示',
          lines: ['クイックターンで壁を強く蹴りすぎた模様', '下流の住宅地が浸水、家屋が流される', '怪獣は約8km流されたのち、自力で岸に上がった', '下流の水力発電所も停止'],
          gains: { sta: 3, hp: -30 }, dmg: 87.3e9, alert: 34, kpop: 3, hpop: 6, cat: '治水・電力',
        });
      }
    },
  });
}

// ---- minigame: the office district as a punching bag ----
function sceneSandbag() {
  const KX = 380, REACH0 = 470, REACH1 = 640, LIMIT = 260;
  const cols = ['#e7d9b8', '#c8d6d9', '#d9c3c0', '#dfe3d2', '#cfc6e0', '#e9d1a8'];
  const blds = [];
  let x = 640;
  for (let i = 0; i < 14; i++) {
    const gas = i === 6;
    const w = gas ? 150 : 110 + (i * 37) % 70, h = gas ? 150 : 180 + (i * 53) % 170;
    blds.push({ x, w, h, col: cols[i % cols.length], hp: gas ? 1 : Math.ceil(h / 110), max: gas ? 1 : Math.ceil(h / 110), gas, down: -1, val: gas ? 8e9 : (h * w) * 0.9e5, sign: i === 3 });
    x += w + 36;
  }
  const power = 1 + G.pow / 40;
  const S = { mode: 'intro', d: 0, punchAt: -99, arm: 0, combo: 0, lastHit: -99, pops: [], dmg: 0, count: 0, gas: false, endAt: 0, debris: [] };
  setScene({
    bg: () => DEFS_BG() + `<rect width="1200" height="750" fill="url(#sky)"/>${skyDeco()}
      <g fill="#fff" opacity="0.8"><ellipse cx="190" cy="120" rx="90" ry="26"/><ellipse cx="1040" cy="90" rx="80" ry="22"/></g>
      <g filter="url(#blurFar)" fill="#8fa3ad">${[0, 1, 2, 3, 4, 5, 6, 7].map(i => `<rect x="${i * 160}" y="${330 + (i % 3) * 30}" width="${100 + (i % 2) * 40}" height="260"/>`).join('')}</g>
      <rect x="0" y="600" width="1200" height="150" fill="#9c967d"/><rect x="0" y="640" width="1200" height="40" fill="#7d7a72"/>${todTint()}`,
    enter() { h(`<div class="prompt" id="pr">ビルを殴って進め！ リズムよく殴るとコンボ（${LIMIT / 20}秒）</div>`); },
    target() { return blds.find(b => b.down < 0 && b.x - S.d < REACH1 && b.x + b.w - S.d > REACH0 - 40); },
    onTap() {
      if (S.mode !== 'play') return;
      if (frame - S.punchAt < 3) return;
      S.punchAt = frame; S.arm ^= 1;
      const b = this.target();
      if (!b || b.x - S.d > REACH1) return;
      const gap = frame - S.lastHit;
      S.combo = gap >= 3 && gap <= 9 ? S.combo + 1 : 0;
      S.lastHit = frame;
      b.hp -= power * (1 + S.combo * 0.12);
      if (b.hp <= 0) {
        b.down = frame;
        const v = b.val * (1 + S.combo * 0.05);
        S.dmg += v; S.count++;
        if (b.gas) S.gas = true;
        if (b.sign) S.blue = true;
        S.pops.push({ f: frame, x: b.x - S.d + b.w / 2, text: b.gas ? 'ガスタンク！' : '¥' + (v / 1e8).toFixed(1) + '億' });
        for (let i = 0; i < 8; i++) S.debris.push({ f: frame, x: b.x - S.d + b.w / 2, y: 600 - b.h / 2, vx: (Math.random() - 0.3) * 18, vy: -Math.random() * 18, s: 10 + Math.random() * 14 });
      }
    },
    tick(f) {
      if (S.mode === 'intro') { if (f >= 24) { S.mode = 'play'; S.t0 = f; } return; }
      if (f === 60) { const pr = document.getElementById('pr'); if (pr) pr.remove(); }
      if (S.mode === 'play') {
        const b = this.target();
        const blocked = b && b.x - S.d < REACH1 - 10;
        if (!blocked) S.d += 7;
        if (f - S.t0 >= LIMIT || S.d > blds[blds.length - 1].x + 300) { S.mode = 'end'; S.endAt = f; $ui.innerHTML = ''; }
      } else if (S.mode === 'end' && f - S.endAt > 30) this.finish();
      S.debris = S.debris.filter(p => f - p.f < 24);
    },
    shake(f) {
      const last = blds.reduce((m, b) => Math.max(m, b.down), -99);
      const j = f - last;
      if (j >= 0 && j < 4) return [[10, -6], [-8, 5], [5, -3], [-2, 1]][j];
      if (f - S.lastHit < 2) return [4, -2];
      return null;
    },
    draw(f) {
      let out = '';
      for (const b of blds) {
        const sx = b.x - S.d;
        if (sx > 1250 || sx + b.w < -50) continue;
        if (b.down >= 0) {
          const k = f - b.down;
          if (b.gas) {
            if (k < 24) out += `<circle cx="${sx + b.w / 2}" cy="520" r="${Math.min(k, 10) * 30}" fill="#ffd34d" opacity="${Math.max(0, 1 - k * 0.04)}"/><circle cx="${sx + b.w / 2}" cy="520" r="${Math.min(k, 10) * 18}" fill="#ff8a3d"/>`;
            out += `<path d="M${sx} 600 q ${b.w / 2} -30 ${b.w} 0 Z" fill="#6d6d6d"/>`;
          } else {
            const sink = clamp(k / 12, 0, 1);
            if (sink < 1) out += `<g transform="translate(0 ${b.h * sink}) rotate(${sink * (b.x % 2 ? 6 : -6)} ${sx + b.w / 2} 600)" opacity="${1 - sink * 0.3}">${bldArt(sx, 600, b.w, b.h, b.col, 1)}</g>`;
            out += bldArt(sx, 600, b.w, b.h, b.col, 2);
            if (k < 20) out += `<g fill="#e8e1cf" opacity="${0.9 - k * 0.04}"><ellipse cx="${sx + b.w / 2}" cy="${590 - k * 2}" rx="${b.w * 0.6 + k * 6}" ry="${30 + k * 3}"/></g>`;
          }
        } else if (b.gas) {
          out += `<g stroke="${INK}" stroke-width="4"><rect x="${sx + 20}" y="560" width="10" height="40" fill="#9aa3a0"/><rect x="${sx + b.w - 30}" y="560" width="10" height="40" fill="#9aa3a0"/>
            <circle cx="${sx + b.w / 2}" cy="${600 - b.h / 2 - 10}" r="${b.w / 2 - 6}" fill="#e9eef2"/></g>
            <text x="${sx + b.w / 2}" y="${600 - b.h / 2}" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="20" fill="#d33a2c" text-anchor="middle">ガス</text>`;
        } else {
          out += bldArt(sx, 600, b.w, b.h, b.col, b.hp < b.max ? 1 : 0);
          if (b.sign) out += `<rect x="${sx + 8}" y="${600 - b.h - 36}" width="${b.w - 16}" height="32" rx="4" fill="#2f6fd0" stroke="${INK}" stroke-width="3"/>
            <text x="${sx + b.w / 2}" y="${600 - b.h - 13}" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="18" fill="#fff" text-anchor="middle">ブルー商事</text>`;
        }
      }
      // kaiju (walks or punches)
      const t = f - S.punchAt, punching = t >= 0 && t < 5;
      const walk = S.mode === 'play' && !punching ? -Math.abs(Math.sin(f * 0.4)) * 8 : 0;
      const reach = punching ? (t < 2 ? 1 : 1 - (t - 2) / 3) : 0;
      const fh = S.arm === 0 && punching ? [735 + 150 * reach, 380 - 20 * reach] : [735, 470];
      const bh = S.arm === 1 && punching ? [700 + 150 * reach, 400] : [508, 490];
      out += `<g transform="translate(${KX - 600} ${walk - 20})">${torso()}${S.arm === 1 && punching ? backArm(bh[0], bh[1]) : backArmStub()}${arm(fh[0], fh[1])}${head(punching ? 'roar' : S.mode === 'end' ? 'happy' : 'serious')}</g>`;
      if (punching && t < 3) out += star(KX + 270, 400, 34, '#fff6a8');
      for (const p of S.debris) {
        const k = f - p.f;
        out += `<rect x="${p.x + p.vx * k}" y="${p.y + p.vy * k + 1.2 * k * k}" width="${p.s}" height="${p.s * 0.7}" fill="#d9d4c3" stroke="${INK}" stroke-width="2" transform="rotate(${k * 25} ${p.x + p.vx * k} ${p.y + p.vy * k + 1.2 * k * k})"/>`;
      }
      for (const p of S.pops) if (f - p.f < 18) out += sfx(p.x - 60, 300 - (f - p.f) * 3, p.text, 40, -4);
      if (S.combo >= 2 && f - S.lastHit < 12) out += sfx(KX - 260, 220, `コンボ×${S.combo}`, 44, -6);
      if (punching && t === 0) out += sfx(KX + 200, 300, ['ドゴッ', 'バキッ', 'ボコッ'][f % 3], 44, -8);
      const left = S.mode === 'play' ? Math.max(0, (LIMIT - (f - S.t0)) / 20) : S.mode === 'intro' ? LIMIT / 20 : 0;
      out += `<g font-family="${SFX_FONT}" fill="#fff" stroke="${INK}" stroke-width="7" paint-order="stroke">
        <text x="1160" y="110" font-size="48" text-anchor="end">${left.toFixed(1)}秒</text>
        <text x="1160" y="170" font-size="40" text-anchor="end">${S.count}棟</text></g>`;
      if (S.mode === 'end') out += sfx(420, 240, 'スッキリ', 64, -6);
      return out + liveBadge('中継：' + here().name);
    },
    finish() {
      if (this.ended) return; this.ended = true;
      G.stock[G.loc].sandbag -= 1;
      G.epLog.push(S.count >= 8 ? 'sandbagBig' : 'sandbag');
      breakCity(Math.ceil(S.count / 2));
      showNews({
        loc: G.loc, ok: true,
        head: `怪獣、${thingHere('sandbag').thing}をサンドバッグにして進む　${S.count}棟が倒壊`,
        lines: [
          S.count >= 8 ? '専門家「ワンツーからのフックが正確。完全にボクサーの動き」' : '殴るたびにビルが一棟ずつ崩れていった',
          S.gas ? 'ガスタンクも殴られ、大爆発が起きた' : '避難はすでに完了しており、けが人はいなかった',
          `駅前のビル街：残り${G.stock[G.loc].sandbag ? 'わずか' : 'ほぼ更地'}`,
        ],
        gains: { pow: 5 + Math.min(4, Math.floor(S.count / 3)), tec: 2, hp: S.gas ? -30 : -20 }, dmg: S.dmg, alert: 14, kpop: 3 + S.count, cat: '建物', extra: { blueSign: !!S.blue },
      });
    },
  });
}

// ---- minigame: highway running (alternate steps, jump the toll gates) ----
function sceneRun() {
  const GOAL = 2600, OBST = [520, 980, 1420, 1900, 2300];
  const JT = Math.round(15 * (0.75 + 0.25 * G.hp / 100) * (1 + G.sta / 200));
  const S = { mode: 'run', d: 0, v: 0, jumpT: -1, passed: new Set(), failAt: 0, doneAt: 0, phase: 0, failObs: 0 };
  const KX = 470;  // kaiju's front foot on screen
  const top = 10 + G.sta / 12;
  setScene({
    bg: DEFS_BG() + `<rect width="1200" height="750" fill="url(#sky)"/>${skyDeco()}
      <g fill="#fff" opacity="0.8"><ellipse cx="190" cy="120" rx="90" ry="26"/><ellipse cx="1040" cy="90" rx="80" ry="22"/></g>${todTint()}`,
    enter() { h(`<div class="prompt" id="pr">料金所の手前でタップしてジャンプ！</div>`); },
    yoff() { return S.jumpT >= 0 ? -160 * Math.sin(Math.PI * S.jumpT / JT) : 0; },
    onTap() { if (S.mode === 'run' && S.jumpT < 0) S.jumpT = 0; },
    tick(f) {
      if (f === 40) { const pr = document.getElementById('pr'); if (pr) pr.remove(); }
      if (S.mode === 'run') {
        S.v = Math.min(top + S.d / 600, S.v + 0.6);
        S.d += S.v; S.phase += S.v / 40;
        if (S.jumpT >= 0) { S.jumpT++; if (S.jumpT >= JT) S.jumpT = -1; }
        for (const o of OBST) {
          const x = KX + 60 + (o - S.d);
          if (S.passed.has(o) || x > KX + 70 || x < KX - 90) continue;
          if (this.yoff() < -70) { if (x < KX - 60) S.passed.add(o); }
          else { S.mode = 'fail'; S.failAt = f; S.failObs = o; $ui.innerHTML = ''; return; }
        }
        if (S.d >= GOAL) { S.mode = 'done'; S.doneAt = f; $ui.innerHTML = ''; }
      } else if (S.mode === 'done' && f - S.doneAt > 30) this.finish(true);
      else if (S.mode === 'fail' && f - S.failAt > 52) this.finish(false);
    },
    shake(f) { if (S.mode === 'fail') { const j = f - S.failAt - 10; if (j >= 0 && j < 5) return [[0, 16], [0, -12], [8, 6], [-4, -2], [2, 1]][j]; } return null; },
    draw(f) {
      const d = S.d;
      let out = '';
      // far buildings (parallax), ground, elevated highway
      for (let i = -1; i < 6; i++) { const x = ((i * 260 - d * 0.3) % 1560 + 1560) % 1560 - 200; out += `<rect x="${x}" y="${360 + (i % 3) * 25}" width="${90 + (i % 2) * 40}" height="${200}" fill="#8fa3ad" opacity="0.8"/>`; }
      out += `<rect x="0" y="520" width="1200" height="230" fill="#9c967d"/>`;
      for (let i = -1; i < 8; i++) { const x = ((i * 220 - d) % 1760 + 1760) % 1760 - 220; out += `<rect x="${x}" y="640" width="34" height="110" fill="#b9b4a3" stroke="${INK}" stroke-width="3"/>`; }
      out += `<rect x="0" y="600" width="1200" height="42" fill="#7d7a72" stroke="${INK}" stroke-width="3"/><rect x="0" y="590" width="1200" height="10" fill="#c9c5ba" stroke="${INK}" stroke-width="2"/>`;
      for (let i = -1; i < 14; i++) { const x = ((i * 100 - d) % 1400 + 1400) % 1400 - 100; out += `<rect x="${x}" y="619" width="50" height="5" fill="#f4f0e2"/>`; }
      for (let i = 0; i < 6; i++) { const x = ((i * 330 + 120 - d * 1.15) % 1980 + 1980) % 1980 - 200; out += `<g transform="translate(${x} 604)"><rect x="-22" y="-14" width="44" height="16" rx="4" fill="${['#d33a2c', '#3f7fc0', '#f4f0e2'][i % 3]}" stroke="${INK}" stroke-width="2"/></g>`; }
      // toll gates
      for (const o of OBST) {
        const x = KX + 60 + (o - d);
        if (x < -150 || x > 1350) continue;
        const broken = S.mode === 'fail' && S.failObs === o && f - S.failAt > 4;
        out += broken
          ? `<g transform="translate(${x} 600)" stroke="${INK}" stroke-width="3"><rect x="-70" y="-30" width="50" height="16" fill="#d9d4c3" transform="rotate(-30 -45 -22)"/><rect x="10" y="-20" width="60" height="16" fill="#d9d4c3" transform="rotate(25 40 -12)"/><rect x="-30" y="-14" width="22" height="14" fill="#f4f0e2"/></g>`
          : `<g transform="translate(${x} 600)" stroke="${INK}" stroke-width="3">
              <rect x="-60" y="-78" width="120" height="16" fill="#d9d4c3"/><rect x="-56" y="-62" width="8" height="62" fill="#b9b4a3"/><rect x="48" y="-62" width="8" height="62" fill="#b9b4a3"/>
              <rect x="-22" y="-40" width="18" height="40" fill="#f4f0e2"/><rect x="6" y="-40" width="18" height="40" fill="#f4f0e2"/>
              <text x="0" y="-65" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="13" fill="${INK}" stroke="none" text-anchor="middle">料金所</text></g>`;
      }
      // kaiju
      const y = this.yoff();
      if (S.mode === 'fail') {
        const j = f - S.failAt, t = clamp(j / 12, 0, 1);
        out += `<g transform="translate(${KX - 600 - 60} ${-40}) rotate(${6 + 80 * easeInOut(t)} 560 640)">${kb()}${arm(760, 470)}${head(j < 12 ? 'surprised' : 'dizzy')}</g>`;
        if (j > 10 && j < 30) out += sfx(560, 360, 'ズデーン', 64, -6);
        if (j > 24) out += `<g stroke="${INK}" stroke-width="3" fill="#7d7a72"><path d="M700 600 l40 30 l-30 20 Z"/><path d="M820 600 l-20 40 l40 10 Z"/></g>` + sfx(760, 480, 'ガラガラ', 40, 6);
      } else {
        const bob = -Math.abs(Math.sin(S.phase * Math.PI)) * 12;
        out += `<g transform="translate(${KX - 600 - 60} ${y + bob - 40}) rotate(6 560 640)">${kb()}${arm(780, 440)}${head(S.mode === 'done' ? 'happy' : 'serious')}</g>`;
        if (y === 0) out += `<g fill="#e8e1cf" opacity="0.8"><ellipse cx="${KX - 160}" cy="598" rx="${20 + S.v * 2}" ry="10"/></g>` + (Math.floor(S.phase) % 2 ? sfx(KX - 260, 560, 'ドスドス', 36, -4) : '');
        if (S.mode === 'done') out += sfx(700, 240, 'ゴール！', 64, -6);
      }
      const prog = clamp(S.d / GOAL, 0, 1);
      out += `<rect x="300" y="160" width="600" height="14" rx="7" fill="#0f2a4a" opacity="0.7"/><rect x="300" y="160" width="${600 * prog}" height="14" rx="7" fill="#ffd34d"/>
        <text x="910" y="174" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="20" fill="#fff" stroke="${INK}" stroke-width="4" paint-order="stroke">ゴール</text>`;
      return out + liveBadge('中継：' + here().name);
    },
    finish(ok) {
      if (this.ended) return; this.ended = true;
      if (ok) {
        G.stock[G.loc].run -= 1;
        G.epLog.push('run');
        showNews({
          loc: G.loc, ok: true,
          head: `怪獣、${thingHere('run').thing}をランニング　障害物を${OBST.length}か所とび越える`,
          lines: ['料金は払っていない模様', '足あとで路面が波打ち、あちこちで段差', `走れる高速道路：残り${G.stock[G.loc].run}回`],
          gains: { sta: 7, pow: 3, hp: -25 }, dmg: 2.2e9, alert: 10, kpop: 5, cat: '道路',
        });
      } else {
        G.stock[G.loc].run = 0;
        G.epLog.push('runFail');
        showNews({
          loc: 'city', ok: false,
          head: '怪獣、料金所でつまずきジャンクションごと転倒',
          lines: ['ジャンプのタイミングが合わず、料金所に足を引っかけた', '転倒の衝撃でジャンクションの高架が崩落', '首都圏の高速道路は終日通行止め'],
          gains: { sta: 2, hp: -25 }, dmg: 34.5e9, alert: 26, kpop: 2, hpop: 5, cat: '道路',
        });
      }
    },
  });
}

// ---- minigame: skipping a container ship across the bay ----
function sceneSkip() {
  const S = { mode: 'power', t0: 0, pv: 0, av: 0, power: 0, angle: 0, n: 0, over: false, at: 0, dur: 0, xs: [] };
  const REL = [600, 330], WY = 505;
  setScene({
    bg: () => bgFor('port'),
    enter() { h(`<div class="prompt" id="pr">強さ：針が黄色に入ったらタップ（赤は強すぎ）</div>`); },
    tick(f) {
      if (S.mode === 'power') S.pv = (1 - Math.cos((f - S.t0) * 0.16)) / 2;
      else if (S.mode === 'angle') S.av = (1 - Math.cos((f - S.t0) * 0.14)) / 2;
      else if (S.mode === 'throw' && f - S.at > S.dur) this.finish();
    },
    onTap() {
      if (S.mode === 'power') { S.power = S.pv; S.mode = 'angle'; S.t0 = frame; h(`<div class="prompt">角度：低いほどよく跳ねる。タップで投げる</div>`); }
      else if (S.mode === 'angle') { S.angle = S.av; this.launch(); }
    },
    launch() {
      S.over = S.power > 0.92;
      const q = Math.max(0, 1 - Math.abs(S.power - 0.72) / 0.72) * (1 - S.angle);
      S.n = S.over || S.angle > 0.78 ? 0 : clamp(Math.round(q * 6 + G.tec / 30), 0, 9);
      let x = REL[0] - (150 + S.power * 220), L = 110 + S.power * 200;
      S.xs = [x];
      for (let i = 0; i < S.n; i++) { L *= 0.74; x -= L; S.xs.push(x); }
      S.dur = 8 + (S.over ? 20 : 8 + S.n * 7) + 26;
      S.mode = 'throw'; S.at = frame; $ui.innerHTML = '';
    },
    draw(f) {
      let out = '';
      const t = S.mode === 'throw' ? f - S.at : -1;
      // kaiju on the quay, facing left, ship raised overhead until it's thrown
      const wind = t < 0 ? 0 : t < 6 ? t / 6 : 1;
      const hand = t < 0 ? [760, 300] : t < 6 ? [760 - 60 * wind, 300 - 40 * wind] : [820, 430];
      const holding = t < 6;
      const ship = holding ? `<use href="#cship" transform="translate(${hand[0] + 20} ${hand[1] - 50}) rotate(${-8 - 10 * wind}) scale(0.9)"/>` : '';
      out += `<g transform="translate(270 40)">${mirror(`${kb()}${ship}${arm(hand[0], hand[1])}${head(t >= 0 && t < 10 ? 'roar' : 'serious')}`)}</g>`;
      if (t >= 0 && t < 10) out += sfx(560, 220, 'どっせい', 48, -6);
      if (S.mode === 'power' || S.mode === 'angle') {
        // power gauge
        out += `<g><rect x="300" y="170" width="600" height="24" rx="12" fill="#0f2a4a" opacity="0.8"/>
          <rect x="${300 + 600 * 0.6}" y="170" width="${600 * 0.25}" height="24" fill="#ffd34d"/>
          <rect x="${300 + 600 * 0.92}" y="170" width="${600 * 0.08}" height="24" fill="#d33a2c"/>
          <rect x="${300 + 600 * (S.mode === 'power' ? S.pv : S.power) - 5}" y="160" width="10" height="44" rx="3" fill="#fff" stroke="${INK}" stroke-width="3"/>
          <text x="290" y="190" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="20" fill="#fff" stroke="${INK}" stroke-width="4" paint-order="stroke" text-anchor="end">強さ</text></g>`;
        if (S.mode === 'angle') {
          const a = (8 + S.av * 52) * D2R;
          out += `<path d="M${REL[0]} ${REL[1] + 120} l -200 0" stroke="#fff" stroke-width="3" stroke-dasharray="8 6"/>
            <path d="M${REL[0]} ${REL[1] + 120} l ${-200 * Math.cos(a)} ${-200 * Math.sin(a)}" stroke="#ffd34d" stroke-width="8" stroke-linecap="round"/>
            <text x="${REL[0] - 220}" y="${REL[1] + 100}" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="20" fill="#fff" stroke="${INK}" stroke-width="4" paint-order="stroke" text-anchor="end">角度</text>`;
        }
      }
      if (t >= 6) {
        const k = t - 6;
        if (S.over) {
          const u = clamp(k / 20, 0, 1);
          if (k < 20) out += `<use href="#cship" transform="translate(${REL[0] - (REL[0] - 60) * u} ${REL[1] + 40 + 60 * u}) rotate(${k * 18}) scale(${0.9 - 0.6 * u})"/>`;
          const e = k - 20;
          if (e >= 0) out += `<circle cx="60" cy="430" r="${Math.min(e, 10) * 12}" fill="#ffd34d" opacity="${Math.max(0, 0.9 - e * 0.04)}"/><g fill="#6d6d6d" opacity="${Math.min(0.85, e * 0.08)}"><circle cx="70" cy="${400 - e * 3}" r="${24 + e}"/><circle cx="40" cy="${380 - e * 3.5}" r="${18 + e}"/></g>`;
          if (e >= 0 && e < 14) out += sfx(80, 330, 'ドーン', 48, -6);
          if (e > 8) out += sfx(820, 200, 'あ', 60, 0);
        } else {
          // first arc from the hand to the water, then shrinking hops
          const pts = [[REL[0], REL[1] + 40], ...S.xs.map(x => [x, WY])];
          const seg = Math.floor(k / 7), u = (k % 7) / 7;
          let hops = 0;
          if (seg < pts.length - 1) {
            const [x0, y0] = pts[seg], [x1, y1] = pts[seg + 1];
            const hgt = seg === 0 ? 60 : 70 * Math.pow(0.72, seg);
            const x = x0 + (x1 - x0) * u, y = y0 + (y1 - y0) * u - hgt * Math.sin(Math.PI * u);
            out += `<use href="#cship" transform="translate(${x} ${y}) rotate(${seg === 0 ? 10 : 0}) scale(0.7)"/>`;
            hops = seg;
          } else {
            hops = pts.length - 1;
            const [lx] = pts[pts.length - 1];
            const sink = clamp((k - (pts.length - 1) * 7) / 10, 0, 1);
            out += `<g opacity="${1 - sink}"><use href="#cship" transform="translate(${lx} ${WY + 20 * sink}) rotate(${-20 * sink}) scale(0.7)"/></g>`;
            out += `<ellipse cx="${lx}" cy="${WY + 4}" rx="${40 + 30 * sink}" ry="10" fill="#fff" opacity="${1 - sink * 0.6}"/>` + sfx(lx - 40, WY - 90, 'ドボン', 40, -4);
          }
          for (let i = 1; i <= Math.min(hops, S.xs.length - 1); i++) out += `<ellipse cx="${S.xs[i]}" cy="${WY + 4}" rx="30" ry="8" fill="#fff" opacity="0.8"/>`;
          if (hops >= 1) out += sfx(Math.max(60, S.xs[Math.min(hops, S.xs.length - 1)] - 30), WY - 60, 'パシャ', 32, -6);
          out += `<text x="1160" y="110" font-family="${SFX_FONT}" font-size="60" fill="#fff" stroke="${INK}" stroke-width="8" paint-order="stroke" text-anchor="end">${Math.max(0, hops - 0)}回</text>`;
        }
      }
      return out + liveBadge('中継：' + LOCS.port.name);
    },
    finish() {
      if (this.ended) return; this.ended = true;
      G.stock.port.skip -= 1;
      const restTxt = `残りのコンテナ船：${G.stock.port.skip}隻`;
      if (S.over) {
        G.epLog.push('skipFail');
        showNews({
          loc: 'port', ok: false,
          head: '怪獣が投げたコンテナ船、跳ねずに対岸の港へ直撃',
          lines: ['力みすぎて水面に当たらず、まっすぐ飛んでいった模様', '対岸の港のクレーン3基が倒壊', '積み荷のコンテナ約2,000個が散乱', restTxt],
          gains: { pow: 3, tec: 1, hp: -20 }, dmg: 41.2e9, alert: 24, kpop: 2, hpop: 5, cat: '港湾',
        });
      } else if (S.n >= 3) {
        G.epLog.push('skip');
        showNews({
          loc: 'port', ok: true,
          head: `怪獣、コンテナ船で水切り　${S.n}回跳ねる`,
          lines: ['専門家「コンテナ船の水切りとしては世界記録」', '波で沿岸の釣り船が一斉に転覆', restTxt],
          gains: { tec: 3 + S.n, pow: 4, hp: -20 }, dmg: 1.4e9 + S.n * 0.25e9, alert: 9, kpop: 3 + S.n, cat: '港湾',
        });
      } else {
        G.epLog.push('skipSink');
        showNews({
          loc: 'port', ok: true,
          head: `コンテナ船、${S.n === 0 ? '1回も跳ねずに' : S.n + '回で'}沈没`,
          lines: ['角度が高すぎたか、力が足りなかった模様', '沈んだ船の引き上げには3か月かかる見込み', restTxt],
          gains: { tec: 2, pow: 2, hp: -20 }, dmg: 2.6e9, alert: 8, kpop: 1, cat: '港湾',
        });
      }
    },
  });
}

// ---- eat: a mug of crude straight from the refinery ----
function sceneEat() {
  setScene({
    bg: () => bgFor('port'),
    tick(f) { if (f > 54) this.finish(); },
    onTap() { if (frame > 12) this.finish(); },
    draw(f) {
      // phases: pour (0-16) -> lift (16-22) -> gulp (22-40) -> ahh (40+)
      const level = f < 16 ? f / 16 : f < 22 ? 1 : f < 40 ? 1 - (f - 22) / 18 : 0;
      const lift = clamp((f - 16) / 6, 0, 1);
      const hx = 820 - 90 * lift, hy = 400 - 70 * lift;
      const tilt = f >= 22 && f < 40 ? -55 : f >= 40 ? -10 : -10 * lift;
      const mug = `<g transform="translate(${hx + 40} ${hy - 30}) rotate(${tilt})">
        <rect x="-55" y="-85" width="110" height="160" rx="12" fill="#dfeff7" opacity="0.55" stroke="${INK}" stroke-width="5"/>
        <rect x="-49" y="${69 - 148 * level}" width="98" height="${148 * level}" rx="8" fill="#2a1d12"/>
        ${level > 0.05 ? `<ellipse cx="0" cy="${69 - 148 * level}" rx="50" ry="14" fill="#cdb98a" stroke="${INK}" stroke-width="3"/>` : ''}
        <path d="M55 -50 q 45 0 45 45 q 0 45 -45 45" fill="none" stroke="${INK}" stroke-width="16"/>
        <path d="M55 -50 q 45 0 45 45 q 0 45 -45 45" fill="none" stroke="#dfeff7" stroke-width="8"/>
      </g>`;
      const pour = f < 16 ? `<path d="M861 314 Q 862 340 862 ${hy - 110}" stroke="#2a1d12" stroke-width="16" fill="none"/>` : '';
      const mustache = f >= 40 ? `<ellipse cx="686" cy="336" rx="24" ry="8" fill="#cdb98a" stroke="${INK}" stroke-width="2"/>` : '';
      let out = `${kb()}${pour}${mug}${arm(hx, hy)}${head(f >= 40 ? 'happy' : 'serious')}${mustache}`;
      if (f < 16) out += sfx(940, 200, 'ドボドボ', 44, -6);
      if (f >= 22 && f < 40) out += sfx(820, 200, 'ゴクゴク', 54, -6);
      if (f >= 40) out += sfx(760, 230, 'ぷはー', 60, -4);
      return out + liveBadge('中継：' + LOCS.port.name);
    },
    finish() {
      if (this.ended) return; this.ended = true;
      G.oil += 1; G.stock.port.eat -= 1;
      G.epLog.push('eat');
      showNews({
        loc: 'port', ok: true,
        head: '怪獣、コンビナートの原油をジョッキで一気飲み',
        lines: ['貯蔵タンクの配管から直接ジョッキに注いだ模様', '専門家「体内に石油がたまると、倒された時が心配」', `お腹の中の石油：${G.oil}杯`],
        gains: { pow: 6, hp: 25 }, dmg: 3.4e9, alert: 8, kpop: 4, cat: '燃料',
      });
    },
  });
}

// ---- sleep ----
function sceneSleep() {
  setScene({
    bg: () => bgFor(),
    tick(f) { if (f > 40) this.finish(); },
    onTap() { if (frame > 8) this.finish(); },
    draw(f) {
      const breath = 1 + 0.02 * Math.sin(f * 0.3);
      return `<g transform="translate(600 560) rotate(-90) scale(${0.85 * breath} 0.85) translate(-600 -450)">${kb()}${head('sleep')}</g>` +
        sfx(760 + (f % 20), 300 - (f % 20) * 4, 'Zzz', 48 + (f % 20), -10) + liveBadge('中継：' + here().name);
    },
    finish() {
      if (this.ended) return; this.ended = true;
      G.epLog.push('sleep');
      showNews({
        loc: G.loc, ok: true,
        head: `怪獣、${here().name}のど真ん中で昼寝`,
        lines: ['いびきの振動で窓ガラス約2,000枚が割れる', '寝返りで駐車場が1つなくなった', '起こしに行く人はいなかった'],
        gains: { hp: 100 }, dmg: 0.06e9, alert: 3, kpop: 2, cat: '建物',
      });
    },
  });
}

// ---- news (result) ----
function showNews(r, after = nextTurn) {
  const before = G.dmg;
  if (r.ok !== undefined && G.epLog.length) checkRequests({ tag: G.epLog[G.epLog.length - 1], loc: r.loc, tod: TOD, extra: r.extra }, r);
  const g = r.gains || {};
  for (const k of ['pow', 'sta', 'tec']) if (g[k]) G[k] = clamp(G[k] + g[k], 0, 100);
  if (g.hp) G.hp = clamp(G.hp + g.hp, 0, 100);
  G.dmg += r.dmg;
  G.alert = clamp(G.alert + r.alert + Math.log10(r.dmg / 1e8 + 1) * 4, 0, 100);
  G.kpop += r.kpop || 0; G.hpop += r.hpop || 0;
  if (r.flags) Object.assign(G.flags, r.flags);
  G.log.push({ cat: r.cat, amount: r.dmg });
  checkRuins();
  if (r.loc === 'city' && r.dmg > 0) breakCity(clamp(Math.round(Math.log10(r.dmg / 1e8 + 1) * 1.1), 0, 5));
  const al = alertLevel();
  const keepFx = $fx.innerHTML;
  setScene({
    bg: undefined, draw: () => null,
    bgClass: al.lv === 0 ? 'cctv' : '', fxClass: al.lv === 0 ? 'cctv' : '',
    enter() {
      $fx.innerHTML = keepFx;
      const names = { pow: '腕力', sta: '持久力', tec: '技術', hp: '体力' };
      const gains = Object.entries(g).map(([k, v]) => `<span class="${v < 0 ? 'minus' : ''}">${names[k]} ${v > 0 ? '+' : ''}${v}</span>`).join('　');
      h(`<div class="news lv${al.lv + 1}">
          <div class="label"><span>${al.name}<small>${al.src}</small></span></div>
          <div class="body">
            <div class="head">${r.head}</div>
            <ul>${r.lines.map((l, i) => `<li style="animation-delay:${0.25 + i * 0.35}s">${l}</li>`).join('')}</ul>
            <div class="row"><span class="gain">${gains}</span>
              <span class="dmg"><small>被害額</small><span id="cnt">${yen(before)}</span></span></div>
          </div>
        </div>
        <div style="position:absolute;right:calc(var(--u)*40);top:calc(var(--u)*24)"><button class="btn" id="next">次へ</button></div>`);
      focusBtn('next').onclick = () => after();
      const t0 = performance.now(), dur = 1200;
      const step = now => {
        const el = document.getElementById('cnt'); if (!el) return;
        const t = Math.min(1, (now - t0) / dur);
        el.textContent = yen(before + (G.dmg - before) * easeOut(t));
        if (t < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    },
  });
}

// ---- episode end: ratings, reactions, villain's word, preview ----
function reactions() {
  const L = G.epLog, pool = [];
  const add = (who, text) => pool.push({ who, text });
  if (L.some(x => x.startsWith('kata'))) add('40代・会社員', '電車返して');
  if (L.includes('kataPerfect')) add('ハガキ・小5', 'ヌンチャクの持ち替え、録画で10回見ました');
  if (L.includes('kataFail')) add('SNS', '停電で後半見られなかった。再放送してほしい');
  if (L.includes('damFail')) add('ハガキ・農家', 'ダムの水が引いたら、うちの畑の水も引きました');
  if (L.includes('swim')) add('SNS', 'クロールのフォームが綺麗すぎる。息継ぎの角度まで正しい');
  if (L.includes('rope') || L.includes('ropeFail')) add('ハガキ・主婦', '縄跳びのたびに電子レンジが止まります');
  if (L.includes('eat')) add('SNS', 'ジョッキで原油を飲む怪獣、ちょっとうらやましい');
  if (L.includes('move')) add('SNS', 'うちの近所に向かって歩いてるの、見えてます');
  if (L.includes('sandbagBig')) add('SNS', 'ビルを殴る音が気持ちよすぎて、録音して目覚ましにした');
  if (L.includes('sandbag')) add('ハガキ・不動産', '駅前の物件、すべて更地になりました');
  if (L.includes('run')) add('ハガキ・料金所職員', '料金所を飛び越えるとき、ちゃんと会釈していました');
  if (L.includes('runFail')) add('SNS', '高速が通行止めで帰省できない');
  if (L.includes('skip')) add('ハガキ・小4', '水切りの回数、家族で数えました');
  if (L.includes('skipFail')) add('ハガキ・港湾関係', '対岸の港で働いています。今日は休みになりました');
  if (L.filter(x => x === 'sleep').length >= 2) add('SNS', '今週ほぼ寝てただけでは？');
  if (G.survived > 6) add('ハガキ・小2', `${G.kaiju}がんばってた。ジャスティアがんばりすぎ`);
  const generic = [
    ['ハガキ・小3', '被害額のケタが多くて数えられません'],
    ['SNS', '今週の怪獣、背中にファスナーが見えた気がする'],
    ['避難所から', '避難所のテレビで見ていました。うちの家が映ってた'],
    ['ハガキ・模型店', 'ミニチュアの線路の出来がすばらしい'],
    ['SNS', `${HERO}、今週も登場が遅い`],
    ['ハガキ・会社員', '今日も通勤電車が運休でした'],
  ];
  if (L.includes('sandbag') || L.includes('sandbagBig')) { add('SNS・会社員', 'オフィスがなくなって、今日は休みになりました。壊してくれてありがとう'); add('SNS', '次はうちの本社もお願いします（切実）'); }
  generic.sort(() => Math.random() - 0.5).forEach(([w, t]) => add(w, t));
  const R = G.requests;
  const thanks = R.thank.splice(0).map(q => ({ who: q.who, text: q.thanks }));
  const fresh = REQUESTS.filter(q => !R.used.includes(q.id) && !R.done.includes(q));
  const picked = [];
  if (fresh.length && G.ep < 2) { const q = fresh[Math.floor(Math.random() * fresh.length)]; R.used.push(q.id); R.active = [q]; picked.push({ who: q.who, text: q.text }); }
  else R.active = [];
  const out = [...thanks, ...picked, ...pool].slice(0, 4);
  return out.sort(() => Math.random() - 0.5);
}

// episode 2 opener: the hyped new weapon lasts five seconds
function sceneSneezeGag() {
  setScene({
    bg: () => bgFor(),
    tick(f) { if (f > 62) this.finish(); },
    onTap() { if (frame > 30) this.finish(); },
    shake(f) { return f >= 24 && f < 28 ? [[10, -4], [-8, 5], [5, -2], [-2, 1]][f - 24] : null; },
    draw(f) {
      const t = clamp((f - 25) / 20, 0, 1);
      const tank = f < 25 ? `<use href="#tank" transform="translate(${1000 - Math.min(f, 15) * 8} 600)"/>`
        : `<use href="#tank" transform="translate(${880 + 300 * t} ${600 - 420 * Math.sin(Math.PI * t * 0.8)}) rotate(${f * 40}) scale(${1 - 0.6 * t})"/>`;
      let out = `<g transform="translate(-120 0)">${kb()}${arm(735, 470)}${head(f < 18 ? 'serious' : f < 25 ? 'surprised' : 'happy', f >= 22 && f < 26 ? 8 : 0)}</g>` + tank;
      if (f < 18) out += sfx(760, 470, '新兵器 メガ放水砲 出動！', 30, 0);
      if (f >= 14 && f < 24) out += sfx(420, 200, 'へ…へ…', 44, -6);
      if (f >= 24 && f < 40) out += sfx(560, 230, 'ヘックシ', 64, -8);
      out += `<text x="1160" y="110" font-family="${SFX_FONT}" font-size="54" fill="#fff" stroke="${INK}" stroke-width="8" paint-order="stroke" text-anchor="end">${Math.max(0, 5 - Math.floor(f / 5))}秒</text>`;
      return out + liveBadge('中継：防衛隊');
    },
    finish() {
      if (this.ended) return; this.ended = true;
      G.turn = -1;
      showNews({
        loc: G.loc, ok: true,
        head: '新兵器「メガ放水砲」、怪獣のくしゃみで5秒で全損',
        lines: [`${G.kaiju}の出現にそなえて、先週の予告で大きく宣伝された新兵器`, '出動から5秒、怪獣のくしゃみで空のかなたへ', '防衛隊「次回作に期待してほしい」'],
        gains: {}, dmg: 30e9, alert: 6, kpop: 4, hpop: -2, cat: '防衛',
      });
    },
  });
}
