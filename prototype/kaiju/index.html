const SPACE_PAL = { id: 'space', name: '漆黒', skin: '#2b2240', snout: '#3a2f55', dark: '#1b1430', belly: '#5a4a7a', line: '#7a6a9a', spike: '#7a4cff' };

// decides the kaiju for episode i (called when the previous episode ends, so the preview can name it)
function setupKaiju(i) {
  const base = baseOf(i), prev = G.look;
  const pick = (arr, cur) => { const c = arr.filter(x => x !== cur); return c.length ? c[Math.floor(Math.random() * c.length)] : arr[0]; };
  G.boss = false;
  if (i === 12 && (G.dmg >= 1.2e12 || flattenRate() >= 45)) {
    G.boss = true; G.parts = [];
    G.look = { ...SPACE_PAL, base: 'space', eyes: 'slant', spikes: 'crystal', pattern: 'none' };
    G.kaiju = BASES.space.first;
    G.lookChanges = ['総帥みずから出撃', '着ぐるみは新規制作（予算の大半を使用）'];
  } else if (base !== prev.base) {
    G.parts = [];
    const palId = pick(BASES[base].pal, prev.id);
    G.look = { ...PALETTES.find(p => p.id === palId), base,
      eyes: pick(Object.keys(EYES), prev.eyes),
      spikes: base === 'rock' ? 'crystal' : base === 'bird' ? 'plate' : pick(Object.keys(SPIKES), prev.spikes),
      pattern: base === 'composite' ? 'spots' : pick(Object.keys(PATTERNS), prev.pattern) };
    G.kaiju = BASES[base].first;
    G.lookChanges = base === 'composite'
      ? ['これまでの着ぐるみのパーツを寄せ集め', '翼・ヒレ・岩の甲羅を移植', 'まだら模様で継ぎ目をごまかす']
      : [`新しい素体：${BASES[base].name}`, `${PALETTES.find(p => p.id === palId).name}の新規塗装`, `目は${EYES[G.look.eyes]}`];
  } else {
    const order = ['eat', 'swim', 'rope', 'nunchaku', 'sandbag', 'run', 'skip', 'sleep', 'move'];
    let best = 'sleep', bn = -1;
    for (const a of order) { const n = G.actCount[a] || 0; if (n > bn) { bn = n; best = a; } }
    let part = PART_OF[best];
    if (G.parts.includes(part)) part = ['horn', 'fins', 'coil', 'chimney', 'nightcap'].find(p => !G.parts.includes(p)) || part;
    G.parts.push(part);
    const palId = pick(PALETTES.map(x => x.id), prev.id);
    G.look = { ...PALETTES.find(x => x.id === palId), base, eyes: pick(Object.keys(EYES), prev.eyes),
      spikes: base === 'rock' ? 'crystal' : pick(Object.keys(SPIKES), prev.spikes), pattern: pick(Object.keys(PATTERNS), prev.pattern) };
    G.kaiju = base === 'composite' ? 'ゴッタマゼラ改' : PREFIX[part] + BASES[base].stem;
    G.lookChanges = [`${PART_NAME[part]}を追加`, `${PALETTES.find(x => x.id === palId).name}に塗り直し`, `目を${EYES[G.look.eyes]}に`, PATTERNS[G.look.pattern] !== '無地' ? `${PATTERNS[G.look.pattern]}を追加` : '模様を塗りつぶし'];
  }
  LOOK = G.look;
  G.kaijuList.push(G.kaiju);
  G.actCount = {};
  G.hp = 100; G.alert = Math.max(0, G.alert - 25);
}

function battleMoves() {

const STAT_NAME = { pow: '腕力', sta: '持久力', tec: '技術' };

function sceneBattle() {
  const KX = 340, HX = 960, idx = G.ep;
  const kind = EP().foe;
  const keys = kind === 'tag' || kind === 'tagFinal' ? ['justia', 'blazer'] : [kind];
  const main = FOES[keys[0]];
  const assist = EP().assist && !G.flags.robotDown;
  const hpMult = (kind === 'tag' ? 1.6 : kind === 'tagFinal' ? 2.1 : main.hp) + (assist ? 0.3 : 0);
  const atkMult = kind === 'tag' ? 1.2 : kind === 'tagFinal' ? 1.35 : main.atk;
  const foeName = keys.length > 1 ? `${FOES.justia.name}＆${FOES.blazer.name}` : main.name;
  const bossMul = G.boss ? 1.5 : 1;
  const heroMax = Math.round((90 + idx * 14) * hpMult);
  const kMax = Math.round((60 + G.sta * 0.8 + G.hp * 0.3) * bossMul);
  const allies = G.allies.slice();
  const S = { mode: 'arrive', round: 0, heroHp: heroMax, kHp: kMax, at: 0, move: null, crit: false, dealt: 0, pop: null, p: 0.75, t0: 0, endAt: 0, collateral: 0, heroMove: '', ally: null };
  const ROUNDS = 3;
  const moves = battleMoves();
  const tod = ['morning', 'noon', 'night'][Math.floor(Math.random() * 3)];
  const todName = { morning: '朝', noon: '昼', night: '夜' }[tod];
  const hitCity = (x) => { if (G.loc === 'city') { breakCity(1); $bg.innerHTML = bgFor(G.loc, tod); } S.crumble = { f: frame, x }; };
  setScene({
    bg: () => bgFor(G.loc, tod),
    enter() { h(`<div class="prompt">${todName}の${here().name}に、${foeName}が現れた！</div>`); },
    choose() {
      S.mode = 'choose';
      h(`<div class="prompt">第${S.round + 1}ラウンド　技を選べ</div>
        <div class="moves">${moves.map(m => {
          const est = Math.round((14 * (0.6 + G[m.stat] / 20) + (m.bonus ? m.bonus() : 0)) * bossMul);
          return `<button class="cmd move" data-m="${m.id}"><strong>${m.name}</strong><span class="what">${STAT_NAME[m.stat]}で威力アップ　威力 約${est}</span></button>`;
        }).join('')}</div>`);
      $ui.querySelectorAll('.move').forEach(b => b.onclick = () => this.act(moves.find(m => m.id === b.dataset.m)));
      const fb = $ui.querySelector('.move'); if (fb) fb.focus();
    },
    act(m) { S.mode = 'kaiju'; S.at = frame; S.move = m; S.crit = false; S.pop = null; h(`<div class="prompt">輪が重なった瞬間にタップで会心！</div>`); },
    onTap() {
      if (S.mode === 'kaiju') { const t = frame - S.at; if (!S.critTried && t >= 3 && t <= 11) { S.critTried = true; S.crit = Math.abs(t - 9) <= 1.5; } }
      else if (S.mode === 'beam') { S.p = Math.min(0.95, S.p + this.push); S.lastTap = frame; }

    hurtFoe(dmg) {
      S.heroHp = Math.max(0, S.heroHp - dmg); S.dealt += dmg;

      return false;
    },
    tick(f) {
      const t = f - S.at;
      if (S.mode === 'arrive' && f >= 40) this.choose();
      else if (S.mode === 'kaiju') {
        if (t === 10) {
          const m = S.move, st = G[m.stat];
          const dmg = Math.round((14 * (0.6 + st / 20) * (S.crit ? 1.5 : 1) * (0.85 + Math.random() * 0.3) + (m.bonus ? m.bonus() : 0)) * bossMul);
          S.collateral += 0.7e9; hitCity(820 + Math.random() * 300);
          S.pop = { f, text: `${S.crit ? '会心！ ' : ''}-${dmg}`, x: HX - 40, y: 300 };
          $ui.innerHTML = '';
          if (this.hurtFoe(dmg)) return;
        }
        if (t >= 20) {
          if (allies.length) { S.mode = 'ally'; S.at = f; S.ally = allies[S.round % allies.length]; }
          else this.toFoe(f);
        }
      } else if (S.mode === 'ally') {
        if (t === 8) {
          const dmg = Math.round(8 + idx * 1.6 + Math.random() * 4);
          S.pop = { f, text: `-${dmg}`, x: HX - 40, y: 300 }; S.collateral += 0.4e9;
          if (this.hurtFoe(dmg)) return;
        }
        if (t >= 16) this.toFoe(f);

        h(`<div class="prompt">連打で${G.boss ? '闇の光線' : '火'}を吹いて、押し返せ！</div><div class="pads" style="justify-content:center"><button class="pad next" id="padP">${G.boss ? '撃ち返す' : '火を吹く'}</button></div>`);
        document.getElementById('padP').onpointerdown = e => { e.stopPropagation(); this.onTap(); };
      } else if (S.mode === 'beam') {
        const sec = (f - S.t0) / 20;
        S.p -= (0.014 + Math.max(0, sec - 4) * 0.014) * (keys.length > 1 ? 1.15 : 1);
        if (S.p >= 0.95 && G.boss && sec > 3) { S.mode = 'win'; S.at = f; $ui.innerHTML = ''; }   // the boss can overpower the finisher
        if (S.p <= 0) { S.mode = 'boom'; S.endAt = f; G.survived = sec; $ui.innerHTML = ''; }
      } else if (S.mode === 'boom' && f - S.endAt > 64) this.finish(false);
      else if (S.mode === 'win' && t > 56) this.finish(true);
    },
    toFoe(f) { S.mode = 'hero'; S.at = f; S.critTried = false; const k = keys[S.round % keys.length]; S.foeKey = k; S.heroMove = assist && S.round === 1 ? 'ガードロン援護射撃' : FOES[k].moves[Math.floor(Math.random() * 3)]; },
    shake(f) {
      const t = f - S.at;
      if (S.mode === 'kaiju' && t >= 10 && t < 13) return [[12, -6], [-9, 5], [5, -2]][t - 10];
      if (S.mode === 'hero' && t >= 8 && t < 11) return [[-12, 6], [9, -5], [-5, 2]][t - 8];
      if (S.mode === 'win' && t < 8) return [[14, -8], [-12, 8], [10, -5], [-8, 4], [5, -3], [-3, 2], [2, -1], [0, 0]][t];
      if (S.mode === 'boom') { const j = f - S.endAt; if (j < 10) return [[16, -8], [-14, 10], [12, -6], [-10, 6], [8, -4], [-6, 3], [4, -2], [-3, 1], [2, -1], [0, 0]][j]; }
      return null;
    },
    draw(f) {
      let out = '';
      const t = f - S.at;
      // foes
      let hx = HX, hy = 690, hpose = 'stand', hrot = 0;
      if (S.mode === 'arrive') { hy = 690 - Math.max(0, 600 - f * 20); hpose = hy < 690 ? 'fly' : 'stand'; }
      if ((S.mode === 'kaiju' && t >= 10 && t < 16) || (S.mode === 'ally' && t >= 8 && t < 14)) { hx += 50 * Math.sin(((t - (S.mode === 'ally' ? 8 : 10)) / 6) * Math.PI); hrot = 8; }
      const attacker = S.mode === 'hero' ? (S.foeKey || keys[0]) : null;
      if (S.mode === 'finisher' || S.mode === 'beam') hpose = 'beam';
      let foesSvg = '';
      if (keys.length > 1) {
        const k2 = keys[1];
        let x2 = HX + 150, p2 = hpose;
        if (attacker === k2) { const u = t < 8 ? easeOut(t / 8) : 1 - (t - 8) / 12; x2 = HX + 150 - 520 * clamp(u, 0, 1); p2 = 'fly'; }
        foesSvg += `<g transform="translate(${x2} ${hy - 20}) scale(0.8)">${foeArt(k2, p2)}</g>`;
      }
      if (assist) foesSvg += `<g transform="translate(1120 680) scale(0.62)">${robotArt(S.mode === 'hero' && S.round === 1 ? 'beam' : 'stand')}</g>`;
      let mx = hx, mpose = hpose;
      if (attacker === keys[0] && !(assist && S.round === 1)) { const u = t < 8 ? easeOut(t / 8) : 1 - (t - 8) / 12; mx = HX - 380 * clamp(u, 0, 1); mpose = 'fly'; }
      if (S.mode === 'win') { const u = clamp(t / 20, 0, 1); hrot = 80 * u; hy = 690 + 60 * u; mpose = 'down'; }
      foesSvg += `<g transform="translate(${mx} ${hy}) rotate(${hrot}) scale(0.9)">${foeArt(keys[0], mpose)}</g>`;
      // kaiju
      let kx = KX - 600, ky = 0, krot = 0, kexpr = 'serious', kextra = '', handPose = [735, 470], body = null;
      if (S.mode === 'hero' && t >= 8 && t < 14) { kexpr = 'surprised'; kx -= 40 * Math.sin((t - 8) / 6 * Math.PI); }
      if (S.mode === 'win') kexpr = 'happy';
      if (S.mode === 'kaiju') {
        const m = S.move.id, u = clamp(t / 10, 0, 1), back = t > 10 ? clamp((t - 10) / 10, 0, 1) : 0;
        kexpr = 'roar';
        if (m === 'tackle') kx += 360 * easeOut(u) * (1 - back);
        if (m === 'stomp' || m === 'dive') { kx += 420 * u * (1 - back); ky = -(m === 'dive' ? 420 : 260) * Math.sin(Math.PI * u) * (1 - back); }
        if (m === 'tail') { kx += 300 * u * (1 - back); krot = 360 * u; }
        if (m === 'nunchaku') { kx += 240 * easeOut(u) * (1 - back); body = kataAt(clamp(Math.round(4 + t * 0.8), 0, 13), { href: 'car' }); }
        if (m === 'throw' || m === 'bthrow' || m === 'rockdrop') {
          handPose = t < 6 ? [700, 300] : [820, 420];
          if (t < 6) kextra = m === 'throw' ? `<use href="#cship" transform="translate(720 240) rotate(-10) scale(0.7)"/>` : m === 'rockdrop' ? `<path d="M650 120 l 90 -20 l 40 60 l -30 70 l -100 10 l -30 -60 Z" fill="#8d8f93" stroke="${INK}" stroke-width="5"/>` : `<g transform="translate(660 120)">${bldArt(0, 160, 90, 160, '#c8d6d9', 0)}</g>`;
        }
      }
      const kaijuSvg = `<g transform="translate(${kx} ${ky}) rotate(${krot} 600 470)">${body || (kb() + kextra + arm(handPose[0], handPose[1]) + head(kexpr))}</g>`;
      // allies stand behind the kaiju
      let alliesSvg = '';
      allies.forEach((a, i) => {
        const ax = 110 + i * 150, active = S.mode === 'ally' && S.ally === a;
        alliesSvg += a === 'fake' ? `<g transform="translate(${ax} 690) scale(-0.62 0.62)">${heroArtP(active ? 'beam' : 'stand', HPAL.fake)}</g>`
          : `<g transform="translate(${ax} 690) scale(-0.55 0.55)">${robotArt(active ? 'beam' : 'stand', RPAL.mech)}</g>`;
      });
      if (S.mode !== 'boom') out += alliesSvg + kaijuSvg + foesSvg;
      else out += foesSvg;
      // effects
      const beamLine = (a, b, c1, c2, w = 1) => `<path d="M${a[0]} ${a[1]} L ${b[0]} ${b[1]}" stroke="${c1}" stroke-width="${44 * w}" stroke-linecap="round" opacity="0.85"/><path d="M${a[0]} ${a[1]} L ${b[0]} ${b[1]}" stroke="${c2}" stroke-width="${26 * w}" stroke-linecap="round"/><path d="M${a[0]} ${a[1]} L ${b[0]} ${b[1]}" stroke="#fff" stroke-width="${9 * w}" stroke-linecap="round"/>`;
      if (S.mode === 'kaiju') {
        const m = S.move.id;
        const M = [KX - 600 + 712, 336], H = [HX - 20, 420];
        if ((m === 'fire' || m === 'water' || m === 'dark') && t >= 3 && t < 16) {
          const u = clamp((t - 3) / 6, 0, 1), E = [M[0] + (H[0] - M[0]) * u, M[1] + (H[1] - M[1]) * u];
          const c = m === 'fire' ? ['#d33a2c', '#ff8a3d'] : m === 'water' ? ['#2f7fd8', '#9fe3ff'] : ['#3a1f5c', '#a07bff'];
          out += beamLine(M, E, c[0], c[1], m === 'fire' ? 1 + G.oil * 0.15 : 1.2);
        }
        if ((m === 'throw' || m === 'bthrow') && t >= 6 && t <= 10) {
          const u = (t - 6) / 4, px = KX + 160 + (HX - KX - 200) * u, py = 260 + 160 * u - 120 * Math.sin(Math.PI * u);
          out += m === 'throw' ? `<use href="#cship" transform="translate(${px} ${py}) rotate(${t * 30}) scale(0.7)"/>` : `<g transform="translate(${px} ${py}) rotate(${t * 30})">${bldArt(-45, 80, 90, 160, '#c8d6d9', 0)}</g>`;
        }
        if (m === 'rockdrop' && t >= 6 && t <= 10) { const u = (t - 6) / 4; out += `<path transform="translate(${HX - 80} ${-120 + 420 * u})" d="M0 0 l 90 -20 l 40 60 l -30 70 l -100 10 l -30 -60 Z" fill="#8d8f93" stroke="${INK}" stroke-width="5"/>`; }
        if (t >= 2 && t <= 11 && !S.critTried) {
          const r = 30 + (11 - t) * 14;
          out += `<circle cx="${HX - 10}" cy="400" r="34" fill="none" stroke="#ffd34d" stroke-width="6"/><circle cx="${HX - 10}" cy="400" r="${r}" fill="none" stroke="#fff" stroke-width="5" opacity="0.9"/>`;
        }
        if (t >= 10 && t < 16) out += star(HX - 20, 420, 64 - (t - 10) * 6) + sfx(HX - 260, 230, S.move.sfx, 56, -6);
      }
      if (S.mode === 'ally' && t >= 2 && t < 12) {
        const ax = 110 + allies.indexOf(S.ally) * 150 + 90;
        out += S.ally === 'fake' ? beamLine([ax, 470], [HX - 20, 420], '#5a1020', '#ff4040', 0.6) : `<g fill="#ff8a3d">${[0, 1, 2].map(i => `<circle cx="${ax + (HX - ax) * clamp((t - 2 - i) / 6, 0, 1)}" cy="${430 - i * 20}" r="12"/>`).join('')}</g>`;
        if (t >= 8) out += star(HX - 20, 420, 50) + sfx(HX - 300, 230, S.ally === 'fake' ? `ニセ${HERO}光線` : 'メカミサイル', 40, -6);
      }
      if (S.mode === 'hero') {
        if (t < 10) out += sfx(HX - 320, 170, S.heroMove, 40, -4);
        if (assist && S.round === 1 && t >= 2 && t < 10) out += `<g fill="#ff8a3d">${[0, 1, 2].map(i => `<circle cx="${1040 - (1040 - KX) * clamp((t - 2 - i) / 6, 0, 1)}" cy="${380 + i * 20}" r="12"/>`).join('')}</g>`;
        if (t >= 8 && t < 14) out += star(KX + 60, 400, 60 - (t - 8) * 6);
      }
      if (S.pop && f - S.pop.f < 16) out += sfx(S.pop.x, S.pop.y - (f - S.pop.f) * 3, S.pop.text, 50, 0);
      if (S.crumble && f - S.crumble.f < 18) { const k = f - S.crumble.f; out += `<g fill="#e8e1cf" opacity="${0.9 - k * 0.05}"><ellipse cx="${S.crumble.x}" cy="${520 - k * 2}" rx="${50 + k * 5}" ry="${24 + k * 2}"/></g>` + (k < 10 ? sfx(S.crumble.x - 60, 440, 'ガラガラ', 34, 4) : ''); }
      if (S.mode === 'arrive' && f > 20) out += sfx(760, 140, `${foeName}！`, 46, -4);
      if (S.mode === 'beam') {
        const H = [HX - 146, 690 - 0.9 * 350], M = [KX - 600 + 712, 336];
        const C = [M[0] + (H[0] - M[0]) * S.p, M[1] + (H[1] - M[1]) * S.p];
        const pulse = frame - (S.lastTap ?? -99) < 3 ? 1.3 : 1;
        const kc = G.boss ? ['#3a1f5c', '#a07bff'] : ['#d33a2c', '#ff8a3d'];
        out += beamLine(M, C, kc[0], kc[1], pulse) + beamLine(H, C, main.col[0], main.col[1], keys.length > 1 ? 1.3 : 1) + star(C[0], C[1], 50 + 8 * Math.sin(f), '#fff6a8');
        const lab = (x, y, tx, col) => `<text x="${x}" y="${y}" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="24" fill="${col}" stroke="#0f2a4a" stroke-width="6" paint-order="stroke" text-anchor="middle">${tx}</text>`;
        out += lab((M[0] + C[0]) / 2, Math.min(M[1], C[1]) - 40, `${G.kaiju}の${G.boss ? '闇の光線' : '火炎'}`, '#ffd34d') + lab((H[0] + C[0]) / 2, Math.min(H[1], C[1]) - 40, keys.length > 1 ? 'ダブル光線' : main.fin, main.col[1]);
        if (f % 8 < 4) out += sfx(KX - 230, 250, 'ぐぬぬ', 40, -6);
      }
      if (S.mode === 'win') {
        if (t < 24) out += star(HX - 30, 420, 80 - t * 2, '#fff6a8');
        if (t > 10) out += sfx(260, 220, main.robot ? `${main.name}、大破！` : `${foeName}、敗れる！`, 52, -6);
      }
      if (S.mode === 'boom') {
        const j = f - S.endAt, big = 1 + G.oil * 0.35;
        if (j < 4) out += kaijuSvg + `<rect width="1200" height="750" fill="#fff" opacity="${0.9 - j * 0.2}"/>`;
        else if (j < 26) { const r = Math.min(j - 4, 10) * 26 * big; out += `<circle cx="${KX}" cy="460" r="${r}" fill="#ffd34d" opacity="${Math.max(0, 1 - (j - 4) * 0.04)}"/><circle cx="${KX}" cy="460" r="${r * 0.7}" fill="#ff8a3d"/><circle cx="${KX}" cy="460" r="${r * 0.4}" fill="#fff6a8"/>`; }
        else {
          const e = j - 26;
          out += `<g fill="#555" opacity="${Math.max(0.2, 0.9 - e * 0.02)}"><circle cx="${KX - 80}" cy="${430 - e * 4}" r="${90 * big + e * 2}"/><circle cx="${KX + 70}" cy="${400 - e * 5}" r="${80 * big + e * 2}"/><circle cx="${KX}" cy="${330 - e * 6}" r="${70 * big + e * 2}"/></g>`;
          if (G.oil > 0) out += `<g fill="#ff8a3d" opacity="0.8">${[0, 1, 2, 3].map(i => `<path d="M${KX - 150 + i * 90} 660 q 20 -${60 + 20 * G.oil} 40 0 Z"/>`).join('')}</g>`;
          out += sfx(820, 170, main.robot ? 'ミッション完了' : 'ハッ！', 50, -4);
        }
        if (j >= 4 && j < 26) out += sfx(KX - 120, 220, 'ドカーン', 80, -8);
      }
      if (S.mode !== 'arrive' && S.mode !== 'boom' && S.mode !== 'win') {
        const bar = (x, w, frac, col, name, alignR) => `<g font-family="'M PLUS 1p',sans-serif" font-weight="800">
          <rect x="${x}" y="200" width="${w}" height="20" rx="10" fill="#0f2a4a" opacity="0.85"/>
          <rect x="${alignR ? x + w * (1 - frac) : x}" y="200" width="${w * frac}" height="20" rx="10" fill="${col}"/>
          <text x="${alignR ? x + w : x}" y="190" font-size="24" fill="#fff" stroke="${INK}" stroke-width="5" paint-order="stroke" text-anchor="${alignR ? 'end' : 'start'}">${name}</text></g>`;
        out += bar(60, 420, S.kHp / kMax, '#ff8a3d', G.kaiju, false) + bar(720, 420, S.heroHp / heroMax, main.col[1], foeName + (assist ? '＋ガードロン' : ''), true);
        out += `<text x="600" y="218" font-family="${SFX_FONT}" font-size="30" fill="#fff" stroke="${INK}" stroke-width="6" paint-order="stroke" text-anchor="middle">${S.mode === 'beam' || S.mode === 'finisher' ? 'とどめ' : `R${Math.min(S.round + 1, ROUNDS)}/${ROUNDS}`}</text>`;
      }
      return out + liveBadge('中継：' + here().name);
    },
    finish(won) {
      if (this.ended) return; this.ended = true;
      const finalEp = idx === EPISODES.length - 1;
      if (won) {
        if (main.robot) G.flags.robotDown = true; else G.flags.heroBeaten = true;
        G.wins++;
        if (finalEp) G.ending = 'bad';
        G.epLog.push('won');
        return showNews({
          loc: G.loc, ok: false,
          head: main.robot ? `巨大ロボ${main.name}、${G.kaiju}に敗れ大破` : `${foeName}、${G.kaiju}に敗れる`,
          lines: [`${G.kaiju}が${foeName}を打ち負かした（与えたダメージ ${S.dealt}）`, main.robot ? '防衛隊「税金で作ったのに」' : '子どもたちの間に衝撃が走っている', finalEp ? 'このまま番組は最終回を迎える……' : '総帥は満足げだったという'],
          gains: { pow: 3, sta: 3, tec: 3 }, dmg: 4e9 + S.collateral, alert: 10, kpop: 25, hpop: -6, cat: '戦闘',
        }, () => sceneEpisodeEnd());
      }
      if (finalEp) G.ending = 'good';
      const fire = G.oil * 15e9;
      const cornered = S.heroHp / heroMax < 0.45;
      G.epLog.push(cornered ? 'cornered' : 'defeated');
      showNews({
        loc: G.loc, ok: false,
        head: `${foeName}、${G.kaiju}を撃破${G.oil ? '　体内の石油に引火し周辺が炎上' : ''}`,
        lines: [
          cornered ? `${G.kaiju}は${foeName}をあと一歩まで追いつめた（与えたダメージ ${S.dealt}）` : `${G.kaiju}の攻撃は${foeName}にあまり効かなかった（与えたダメージ ${S.dealt}）`,
          `${tod === 'night' ? '夜間の戦闘。' : ''}とどめの${keys.length > 1 ? 'ダブル光線' : main.fin}を${G.survived.toFixed(1)}秒こらえたのち爆発`,
          G.oil ? `体内の石油${G.oil}杯分に引火、消火に数日かかる見込み` : '戦いの巻き添えで周辺の建物多数が倒壊',
        ],
        gains: {}, dmg: 2e9 + fire + S.collateral, alert: 0, kpop: Math.round(S.dealt / 4 + G.survived), hpop: cornered ? 12 : 6, cat: '戦闘・撃破後の被害',
      }, () => sceneEpisodeEnd());
    },
  });
}

/* =====================================================================
   EPISODE END / PREVIEW
   ===================================================================== */
function bossWord() {
  const epDmg = G.dmg - G.epStartDmg;
  if (G.epLog.includes('won')) return 'よくやった。光の巨人も、鉄の巨人も、お前の前では器具にすぎん。';
  if (epDmg > 1e11) return '……見事だ。この星が、少し平らになった。';
  if (G.survived > 6) return `あの光線を${G.survived.toFixed(1)}秒。悪くない。`;
  return 'まだまだだ。この星には、鍛える道具がいくらでもある。';
}
function sceneEpisodeEnd() {
  const epDmg = G.dmg - G.epStartDmg;
  const rating = (5.5 + Math.log10(epDmg / 1e8 + 1) * 3.2 + G.kpop * 0.05 + (G.epLog.includes('won') ? 4 : 0) + Math.random() * 1.2).toFixed(1);
  G.ratings.push(+rating);
  const last = G.ep === EPISODES.length - 1;
  setScene({
    bg: () => bgFor(), bgClass: 'dim', draw: () => '',
    enter() {
      const v = reactions();
      h(`<div class="board">
        <h2>第${G.ep + 1}話　放送終了</h2>
        <div class="kpi"><div>視聴率<b>${rating}%</b></div><div>今週の被害額<b>${yen(epDmg)}</b></div><div>怪獣人気<b>${G.kpop}</b></div><div>ヒーロー人気<b>${G.hpop}</b></div></div>
        <div style="font-weight:800">今週の反響</div>
        <div class="voices">${v.map((x, i) => `<div class="voice" style="--r:${(i % 2 ? 1 : -1) * (0.6 + i * 0.3)}deg">${x.text}<small>${x.who}</small></div>`).join('')}</div>
        <div style="color:#c8b6ff">悪の総帥より：「${bossWord()}」</div>
        <div class="foot"><button class="btn" id="next">${last ? 'エンディングへ' : '次回予告へ'}</button></div>
      </div>`);
      focusBtn('next').onclick = () => { if (last) return sceneEnding(G.ending || 'good'); const prev = G.kaiju; setupKaiju(G.ep + 1); scenePreview(prev); };
    },
  });
}
function scenePreview(prev) {
  const nx = EPISODES[G.ep + 1];
  setScene({
    bg: undefined, draw: () => '', bgClass: 'dim',
    enter() {
      h(`<div class="board" style="justify-content:center;align-items:center;text-align:center">
        <div style="color:var(--gold);font-weight:800;letter-spacing:0.3em">次回予告</div>
        <div class="preview">${fillK(nx.pv(prev))}</div>
        <div class="foot" style="margin-top:calc(var(--u)*20)"><button class="btn" id="next">次の話へ</button></div></div>`);
      focusBtn('next').onclick = () => {
        G.ep++; G.turn = 0; G.epLog = []; G.epStartDmg = G.dmg; G.survived = 0;
        G.repaired = doRepairs();
        if (!G.titled) { G.titled = true; sceneGreenlight(); } else sceneEpisodeTitle();
      };
    },
  });
}

/* =====================================================================
   ENDING: aftermath, the studio, credits, the real bill, after the credits
   ===================================================================== */
function sceneEnding(kind) {
  const lines = kind === 'bad'
    ? [`${HERO}は、立ち上がらなかった。`, 'エンドロールは、音もなく流れた。', '「子どもが泣いた」「ヒーローを返して」――放送局の電話は鳴りやまなかった。', `それでも最終回の視聴率は、番組史上最高の${Math.max(...G.ratings, 20).toFixed(1)}%だった。`]
    : ['怪獣は倒れ、街に平和が戻った。', '人々は、がれきの片づけを始めた。', '……という、番組でした。'];
  let i = 0;
  setScene({
    bg: `<rect width="1200" height="750" fill="#07090d"/>`, draw: () => '', noTod: true,
    enter() { this.paint(); },
    paint() { h(`<div class="titlecard" style="background:transparent"><div class="ep-title" style="font-size:calc(var(--u)*40);max-width:80%;line-height:1.6">${lines[i]}</div><div class="skip">タップで進む</div></div>`); },
    onTap() { i++; if (i >= lines.length) sceneStudio(kind); else this.paint(); },
  });
}
function actorKaiju(x, y, s) {
  // the suit with its head off: an actor's head pokes out, drinking water; the suit head sits on the floor
  return `<g transform="translate(${x} ${y}) scale(${s}) translate(-600 -450)">${kb()}${arm(700, 330)}
    <circle cx="600" cy="300" r="46" fill="#f1c9a5" stroke="${INK}" stroke-width="5"/><path d="M556 286 q 44 -40 88 0" stroke="#fff" stroke-width="14" fill="none"/>
    <circle cx="588" cy="300" r="5" fill="${INK}"/><circle cx="616" cy="300" r="5" fill="${INK}"/>
    <rect x="680" y="250" width="26" height="70" rx="8" fill="#bfe6f5" stroke="${INK}" stroke-width="4" transform="rotate(-35 693 285)"/>
    <g transform="translate(330 330) scale(0.6) translate(-600 -290)">${head('serious')}</g></g>`;
}
function sceneStudio(kind) {
  setScene({
    bg: `<rect width="1200" height="750" fill="#15161a"/>`, noTod: true,
    tick(f) { if (f === 90) h(`<div class="skip">タップで進む</div>`); },
    onTap() { if (frame > 40) sceneCredits(kind); },
    draw(f) {
      const u = easeInOut(clamp(f / 40, 0, 1));
      const w = 1200 * (1 - 0.55 * u), hh = 750 * (1 - 0.55 * u), x = (1200 - w) / 2, y = 30 * u;
      let o = `<rect x="0" y="520" width="1200" height="230" fill="#2a2b30"/>`;
      // set (the last location, now a miniature on a stage)
      o += `<rect x="${x - 10}" y="${y + hh - 10}" width="${w + 20}" height="${40 * u}" fill="#5a4a3a"/>`;
      o += `<svg x="${x}" y="${y}" width="${w}" height="${hh}" viewBox="0 0 1200 750" preserveAspectRatio="xMidYMid slice">${bgFor(G.loc, 'noon')}</svg>`;
      TOD = 'noon';
      if (u > 0.5) {
        const a = (u - 0.5) * 2;
        o += `<g opacity="${a}">
          <path d="M120 0 L 60 0 L 330 330 Z" fill="#fff6c8" opacity="0.18"/><path d="M1080 0 L 1140 0 L 870 330 Z" fill="#fff6c8" opacity="0.18"/>
          <rect x="70" y="40" width="70" height="40" rx="6" fill="#444"/><rect x="1060" y="40" width="70" height="40" rx="6" fill="#444"/>
          <g transform="translate(130 560)" fill="#3a3c44" stroke="#111" stroke-width="3"><rect x="-40" y="-110" width="120" height="70" rx="8"/><circle cx="90" cy="-75" r="26"/><path d="M0 -40 L -40 120 M20 -40 L 20 120 M40 -40 L 80 120"/></g>
          ${[[300, 600], [380, 610], [860, 600], [980, 612], [1080, 600]].map(([px, py], k) => `<g transform="translate(${px} ${py})" fill="#0b0c10"><circle cx="0" cy="-70" r="18"/><rect x="-20" y="-52" width="40" height="70" rx="10"/>${k === 3 ? '<rect x="18" y="-60" width="40" height="30" fill="#eee"/>' : ''}</g>`).join('')}
          <g transform="translate(1000 650)" fill="#7a5a3a"><rect x="-50" y="-60" width="100" height="10"/><rect x="-50" y="-120" width="100" height="50" fill="#2a2a2a"/><text x="0" y="-88" font-family="'M PLUS 1p',sans-serif" font-weight="800" font-size="20" fill="#fff" text-anchor="middle">監督</text><path d="M-40 -50 L -50 0 M40 -50 L 50 0" stroke="#7a5a3a" stroke-width="6"/></g>
          ${actorKaiju(600, 470, 0.42)}
        </g>`;
      }
      if (f >= 40 && f < 70) o += sfx(380, 150, 'カット！', 80, -6);
      if (f >= 64) o += sfx(520, 520, 'おつかれさまでしたー', 40, 0);
      return o;
    },
  });
}
function sceneCredits(kind) {
  const staff = [['制作', '〇〇テレビ　特撮制作部'], ['特技監督', '（架空）'], ['怪獣デザイン', '第2班'], ['着ぐるみ制作・改造', '第2班 造形チーム'], ['ミニチュア制作', '美術部'],
    ['被害額監修', '架空損害保険'], ['ニュース映像', '報道局（全面協力）'], ['出演怪獣', G.kaijuList.join('・')], ['ヒーロー', `${HERO}・ブレイザー`], ['巨大ロボ', 'ガードロン'], ['悪の総帥', 'ガルバドス'], ['そして', 'すべての電車・電線・ダムのみなさん']];
  setScene({
    bg: `<rect width="1200" height="750" fill="#07090d"/>`, draw: () => '', noTod: true,
    enter() {
      h(`<div style="position:absolute;inset:0;overflow:hidden">
        <div class="credits" style="position:absolute;left:0;right:0;top:100%;text-align:center;animation:roll 14s linear forwards">
          <div class="logo" style="font-size:calc(var(--u)*60);margin-bottom:calc(var(--u)*50)">${SHOW}</div>
          ${staff.map(([r, n]) => `<div style="margin-bottom:calc(var(--u)*30)"><div style="color:var(--muted);font-size:calc(var(--u)*22)">${r}</div><div style="font-size:calc(var(--u)*30);font-weight:800">${n}</div></div>`).join('')}

        </div></div><div class="skip">タップでとばす</div>`);
      this.t = setTimeout(() => this.onTap(), 14500);

    onTap() { if (this.done) return; this.done = true; clearTimeout(this.t); sceneRealBill(kind); },
  });
}
function sceneRealBill(kind) {
  const C = G.counts || {};
  const rows = [
    ['ミニチュアセット制作費（13話分）', 13 * 6800000],
    ['火薬・爆破費', (G.ratings.length) * 450000],
    ['着ぐるみ制作・改造費', G.kaijuList.length * 1200000],
    ['着ぐるみクリーニング代', 13 * 120000],
    ['電車・貨物列車模型の買い直し', ((C.nunchaku || 0) + 1) * 38000],
    ['特注ジョッキ（原油用）', ((C.eat || 0) + 1) * 25000],
    ['ビル模型（発泡スチロール）', ((C.sandbag || 0) * 8 + 10) * 9000],
    ['ダム模型の水漏れ修理', G.flags.damBroken ? 280000 : 0],
    ['ロケ弁当', 13 * 85000],
  ].filter(r => r[1] > 0);
  const total = rows.reduce((a, r) => a + r[1], 0);
  setScene({
    bg: `<rect width="1200" height="750" fill="#2a2420"/>`, draw: () => '', noTod: true,
    enter() {
      h(`<div class="board" style="background:var(--paper);color:var(--paper-ink);border-color:#8a7a52">
        <h2>本当のご請求書（制作費）</h2>
        <div class="bill" style="padding:0">${rows.map(([c, v]) => `<div class="line"><span>${c}</span><span>${yen(v)}</span></div>`).join('')}
          <div class="line total"><span>制作費 合計</span><span>${yen(total)}</span></div></div>
        <div style="font-size:calc(var(--u)*22)">劇中の被害総額：<b>${yen(G.dmg)}</b>　／　こっそり叶えた依頼：${G.requests.done.length}件　／　ヒーロー・ロボに勝った回数：${G.wins}回</div>
        <div class="foot"><button class="btn" id="next">エンドロールの後……</button></div>
      </div>`);
      focusBtn('next').onclick = () => scenePostCredits(kind);
    },
  });
}
function scenePostCredits(kind) {
  setScene({
    bg: `<rect width="1200" height="750" fill="#000"/>`, noTod: true,
    tick(f) { if (f === 110) { h(`<div style="position:absolute;inset:0;display:grid;place-items:end center;padding-bottom:calc(var(--u)*40)"><div style="text-align:center"><div class="ep-title" style="font-size:calc(var(--u)*44)">おわり</div>
        ${kind === 'bad' ? '<div style="color:var(--muted);font-size:calc(var(--u)*20);margin:calc(var(--u)*8) 0">（人間側で第1話からやり直すモードは、次の試作で）</div>' : ''}
        <button class="btn" id="again">最初から</button></div></div>`); focusBtn('again').onclick = () => { G = newGame(); LOOK = G.look; sceneProposal(); }; } },
    shake(f) { return f > 20 && f < 40 && f % 2 ? [Math.random() * 10 - 5, Math.random() * 10 - 5] : null; },
    draw(f) {
      let o = '';
      if (f < 20) return o;
      if (f < 46) return sfx(420, 380, 'ゴゴゴゴ……', 70, 0);
      const a = clamp((f - 46) / 30, 0, 1);
      TOD = 'night';
      o += `<g opacity="${a}">${cityBg({ trains: 3, wires: 2 })}</g>`;
      // the shadow of the very first kaiju, as it looked in episode 1
      const keep = [LOOK, G.parts]; LOOK = BASE_LOOK; G.parts = [];
      const sil = `<g transform="translate(560 ${470 - 40 * a}) scale(1.05) translate(-600 -450)" filter="url(#silh)" opacity="${0.92 * a}">${kb()}${arm(735, 470)}${head('serious')}</g>`;
      LOOK = keep[0]; G.parts = keep[1];
      o += `<defs><filter id="silh"><feColorMatrix type="matrix" values="0 0 0 0 0.04  0 0 0 0 0.04  0 0 0 0 0.07  0 0 0 1 0"/></filter></defs>` + sil;
      o += `<g fill="#555" opacity="${0.6 * a}"><circle cx="300" cy="${400 - f * 0.5}" r="60"/><circle cx="820" cy="${380 - f * 0.6}" r="70"/></g>`;
      o += `<rect x="0" y="0" width="1200" height="750" fill="#000" opacity="${Math.max(0, 0.6 - a * 0.4)}"/>`;
      if (f > 60 && f < 90) o += `<circle cx="652" cy="${262 - 40 * a}" r="6" fill="#ffd34d"/><circle cx="695" cy="${256 - 40 * a}" r="6" fill="#ffd34d"/>`;
      return o;
    },
  });
}
