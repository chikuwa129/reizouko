<title>地球さら地化計画</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
/* Layout: an alien invader's war table on one screen. Map with cut-in theatre on the left,
   tabbed order cards on the right (switch by tab or swipe), research tree as an overlay.
   Deliberately one dark look. */
:root {
  --space: #120d1f;
  --panel: #1d1630;
  --panel-2: #261d3f;
  --line: #3b2f5c;
  --text: #efe9f7;
  --muted: #a99fc0;
  --scorch: #e3a252;
  --toxic: #d94fd0;
  --human: #5fb8ff;
  --danger: #ff5a5a;
  --gold: #ffd34d;
  --good: #9be39b;
  --sea: #10284a;
  --f-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --f-dot: 'DotGothic16', 'Osaka-Mono', 'MS Gothic', monospace;
  --f-body: 'M PLUS 1p', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--space);
  background-image: radial-gradient(1px 1px at 12% 20%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 12%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 80%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 66%, #fff7 50%, transparent 51%);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 1280px; height: 100%; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }

/* status strip */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.logo { font-family: var(--f-display); font-size: 20px; letter-spacing: .04em; color: var(--scorch); margin-right: auto; line-height: 1.1; }
.logo small { display: block; font-family: var(--f-dot); font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.stats { display: flex; flex-wrap: wrap; gap: 5px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-family: var(--f-dot); font-variant-numeric: tabular-nums; font-size: 15px; display: flex; gap: 5px; align-items: baseline; }
.stat b { font-weight: normal; font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.stat i { font-style: normal; font-size: 11px; color: var(--good); }
.bar { height: 6px; width: 60px; background: #0006; border-radius: 3px; overflow: hidden; align-self: center; }
.bar i { display: block; height: 100%; background: var(--human); transition: width .4s; }
.hp { color: var(--danger); letter-spacing: 2px; }
.snd { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; }

.main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 12px; min-height: 0; }

/* left: the world */
.world { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.earth { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.earth .big { font-family: var(--f-display); font-size: 30px; color: var(--scorch); font-variant-numeric: tabular-nums; line-height: 1; }
.earth .lbl { font-size: 11px; color: var(--muted); letter-spacing: .1em; }
.earth .goal { margin-left: auto; font-family: var(--f-dot); font-size: 13px; color: var(--muted); text-align: right; }
.gauge { height: 8px; background: #0007; border-radius: 4px; overflow: hidden; position: relative; flex: none; }
.gauge i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #a5602a, var(--scorch)); transition: width .5s; }
.gauge::after { content: ""; position: absolute; left: 95%; top: 0; bottom: 0; width: 2px; background: var(--gold); }
.stage { position: relative; border-radius: 8px; overflow: hidden; background: var(--sea); aspect-ratio: 720 / 330; max-width: 100%; flex: none; }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.reg { cursor: pointer; stroke: #0c1a30; stroke-width: 1; transition: fill .5s; }
.reg.sel { stroke: var(--gold); stroke-width: 2.4; }
.reg.hit { animation: hit .6s; }
@keyframes hit { 0%, 40% { fill: #fff; } }
.rlabel { font-family: var(--f-dot); font-size: 12px; fill: #fff; paint-order: stroke; stroke: #000a; stroke-width: 3px; pointer-events: none; text-anchor: middle; }

.regs { display: flex; flex-wrap: wrap; gap: 4px; }
.regs button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; padding: 4px 8px; font-size: 12px; display: flex; gap: 5px; align-items: baseline; }
.regs button span { font-family: var(--f-dot); color: var(--scorch); font-variant-numeric: tabular-nums; }
.regs button.done span { color: var(--gold); }
.regs button[aria-pressed="true"] { border-color: var(--gold); background: #3a2f12; }
.rinfo { display: grid; grid-template-columns: auto minmax(0, 1fr) auto minmax(0, 1fr); gap: 4px 8px; font-size: 12px; align-items: center; }
.rinfo h3 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 17px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rinfo h3 small { font-family: var(--f-body); font-size: 12px; color: var(--human); }
.rinfo .k { color: var(--muted); }
.rinfo .note { grid-column: 1 / -1; color: var(--muted); }
.mini { height: 8px; background: #0007; border-radius: 4px; overflow: hidden; }
.mini i { display: block; height: 100%; transition: width .5s; }

/* cut-in theatre (over the map) */
.cutin { position: absolute; inset: 0; z-index: 3; background: #000; cursor: pointer; }
.cutin svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px 10px; background: linear-gradient(transparent, #000c 40%); display: flex; align-items: flex-end; gap: 12px; pointer-events: none; }
.cap .nm { font-family: var(--f-display); font-size: clamp(18px, 3.2vw, 30px); line-height: 1.1; text-shadow: 0 2px 0 #000; animation: capin .25s cubic-bezier(.2,1.6,.4,1) both; }
.cap .rg { font-size: 13px; color: var(--muted); }
.cap .val { margin-left: auto; font-family: var(--f-display); font-size: clamp(20px, 3.6vw, 34px); color: var(--scorch); text-shadow: 0 2px 0 #000; animation: capin .3s .35s cubic-bezier(.2,1.6,.4,1) both; white-space: nowrap; }
.cap .val.cool { color: var(--human); }
@keyframes capin { from { transform: scale(1.8); opacity: 0; } }
.stamp { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) rotate(-8deg); font-family: var(--f-display); font-size: clamp(26px, 6vw, 56px); color: var(--gold); border: 5px solid var(--gold); padding: 4px 18px; border-radius: 10px; background: #000a; white-space: nowrap; animation: stamp .35s 1.05s cubic-bezier(.3,1.8,.5,1) both; pointer-events: none; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(3); opacity: 0; } }
.skip { position: absolute; right: 8px; top: 6px; font-size: 11px; color: #fff9; font-family: var(--f-dot); pointer-events: none; }

/* scene pieces */
.scene * { transform-box: fill-box; }
.fall { transform-origin: 50% 100%; animation: fall .9s cubic-bezier(.55,0,.9,.6) both; }
@keyframes fall { 0% { transform: none; } 12% { transform: translateX(-4px) rotate(-2deg); } 100% { transform: translateY(108%) rotate(10deg); } }
.tilt { transform-origin: 50% 100%; animation: tilt .8s ease-out both; }
@keyframes tilt { to { transform: rotate(-9deg) translateY(12px); } }
.flash { animation: flash .45s both; }
@keyframes flash { 0% { opacity: 0; } 8% { opacity: 1; } 22% { opacity: .1; } 34% { opacity: .85; } 100% { opacity: 0; } }
.fire { transform-origin: center; animation: fire 1s ease-out both; }
@keyframes fire { 0% { transform: scale(.05); opacity: 1; } 55% { opacity: 1; } 100% { transform: scale(1.35); opacity: 0; } }
.smoke { transform-origin: center; animation: smoke 1.8s ease-out both; }
@keyframes smoke { 0% { transform: scale(.2); opacity: 0; } 25% { opacity: .9; } 100% { transform: scale(1.7) translateY(-40%); opacity: 0; } }
.streak { animation: streak .4s ease-in both; }
@keyframes streak { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
.gone { animation: gone .2s both; }
@keyframes gone { to { opacity: 0; } }
.appear { animation: appear .3s both; }
@keyframes appear { from { opacity: 0; } }
.grow { transform-origin: 50% 100%; animation: grow .7s cubic-bezier(.2,1.2,.4,1) both; }
@keyframes grow { from { transform: scale(.05); opacity: 0; } }
.rise { animation: rise .9s ease-out both; }
@keyframes rise { from { transform: translateY(var(--fy, 120%)); } }
.drop { animation: drop .8s cubic-bezier(.6,0,1,.8) both; }
@keyframes drop { from { transform: translate(var(--fx, 0), var(--fy, -300px)); } }
.walk { animation: walk 1.4s ease-out both; }
@keyframes walk { from { transform: translateX(var(--fx, 300px)); } }
.bob { animation: bob .5s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-6px); } }
.float { animation: float 1.6s ease-out both; }
@keyframes float { from { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } to { transform: translateY(-90px); opacity: 0; } }
.rain { animation: rain .35s linear infinite; }
@keyframes rain { from { transform: translateY(-40px); } to { transform: translateY(40px); } }
.snow { animation: snow 1.8s linear both; }
@keyframes snow { from { transform: translate(0, -60px); } to { transform: translate(-30px, 300px); } }
.spin { transform-origin: center; animation: spin 1.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.ring { transform-origin: center; animation: ring 1s ease-out both; }
@keyframes ring { from { transform: scale(.1); opacity: 1; } to { transform: scale(1.6); opacity: 0; } }
.draw { animation: draw .9s ease-out both; }
@keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
.scene.quake { animation: quake .5s both; }
.scene.quake-big { animation: quakeBig .8s both; }
@keyframes quake { 0%, 100% { transform: none; } 15% { transform: translate(0, 5px); } 35% { transform: translate(0, -4px); } 55% { transform: translate(0, 3px); } 75% { transform: translate(0, -1px); } }
@keyframes quakeBig { 0%, 100% { transform: none; } 10% { transform: translate(-10px, 7px); } 25% { transform: translate(9px, -6px); } 40% { transform: translate(-7px, 4px); } 55% { transform: translate(5px, -3px); } 70% { transform: translate(-3px, 2px); } 85% { transform: translate(1px, -1px); } }

/* news ticker (over the map, non-blocking) */
.newsbar { position: absolute; left: 8px; right: 8px; top: 8px; z-index: 2; background: #0b0816ee; border: 1px solid var(--line); border-left: 4px solid var(--scorch); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; line-height: 1.45; cursor: pointer; animation: slidein .25s ease-out both; }
.newsbar .t { font-family: var(--f-dot); font-size: 11px; color: var(--muted); letter-spacing: .1em; display: flex; justify-content: space-between; }
.newsbar .row { display: grid; grid-template-columns: 5.5em minmax(0, 1fr); gap: 8px; }
.newsbar .row b { font-family: var(--f-dot); font-weight: normal; font-size: 11px; color: var(--muted); padding-top: 2px; }
.newsbar .row.hot b { color: var(--danger); }
.newsbar .row.good b { color: var(--gold); }
@keyframes slidein { from { transform: translateY(-20px); opacity: 0; } }

/* right: orders */
.orders { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
.ohead { display: flex; align-items: baseline; gap: 8px; }
.ohead h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 17px; }
.ap { margin-left: auto; display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--muted); }
.ap i { width: 14px; height: 14px; border-radius: 50%; background: var(--scorch); box-shadow: 0 0 6px var(--scorch); }
.ap i.used { background: #0006; box-shadow: none; border: 1px solid var(--line); }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 1px solid var(--line); background: var(--panel-2); border-radius: 999px; padding: 4px 10px; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.tab::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.tab[aria-selected="true"] { background: var(--c); color: #160f22; border-color: var(--c); font-weight: 800; }
.tab[aria-selected="true"]::before { background: #160f22; }
.tab .new { font-size: 10px; color: var(--gold); }
.tab[aria-selected="true"] .new { color: #160f22; }
.deck { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: min-content; gap: 6px; align-content: start; touch-action: pan-y; position: relative; }
.deck.slide-l { animation: slideL .2s ease-out; } .deck.slide-r { animation: slideR .2s ease-out; }
@keyframes slideL { from { transform: translateX(30px); opacity: 0; } } @keyframes slideR { from { transform: translateX(-30px); opacity: 0; } }
.act { text-align: left; border: 1px solid var(--line); border-top: 4px solid var(--c, var(--line)); background: var(--panel-2); border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: transform .08s; }
.act:hover:not([disabled]) { border-color: var(--c, var(--muted)); }
.act:active:not([disabled]) { transform: scale(.96); }
.act[disabled] { opacity: .4; cursor: default; }
.act .nm { font-weight: 800; font-size: 15px; line-height: 1.25; }
.act .ds { font-size: 11px; color: var(--muted); line-height: 1.35; }
.act .why { font-size: 11px; color: var(--danger); }
.chips { display: flex; flex-wrap: wrap; gap: 3px; font-family: var(--f-dot); font-size: 12px; }
.chip { padding: 0 5px; border-radius: 4px; background: #0005; }
.chip.s { color: var(--scorch); } .chip.p { color: var(--toxic); } .chip.a { color: var(--human); } .chip.g { color: var(--good); } .chip.c { color: var(--muted); } .chip.res { color: var(--danger); }
.empty { grid-column: 1 / -1; color: var(--muted); font-size: 13px; line-height: 1.6; padding: 4px; }
.swipehint { font-size: 11px; color: var(--muted); text-align: center; }
.foot { display: flex; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 14px; font-weight: 800; position: relative; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--scorch); color: #2a1606; border-color: var(--scorch); }
.btn.primary.ready { animation: ready 1s ease-in-out infinite; }
@keyframes ready { 50% { box-shadow: 0 0 0 4px #e3a25255; } }
.btn[disabled] { opacity: .4; cursor: default; }
.btn .badge { position: absolute; top: -7px; right: -7px; background: var(--gold); color: #2a1606; border-radius: 999px; font-size: 11px; padding: 1px 6px; font-family: var(--f-dot); }
.grow1 { flex: 1; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: #0b0816f0; border: 1px solid var(--good); color: var(--good); padding: 8px 16px; border-radius: 999px; font-family: var(--f-dot); font-size: 15px; z-index: 30; animation: toast 1.3s ease-out both; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { transform: translate(-50%, 20px); opacity: 0; } 15% { transform: translate(-50%, 0); opacity: 1; } 80% { opacity: 1; } 100% { opacity: 0; } }

/* overlays */
.ov { position: fixed; inset: 0; background: #07040fe6; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 24px; color: var(--scorch); text-wrap: balance; }
.card p { margin: 0; line-height: 1.75; }
.kicker { font-family: var(--f-dot); font-size: 13px; color: var(--muted); letter-spacing: .12em; }
.news { border-top: 2px solid var(--scorch); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.news .row { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; font-size: 14px; }
.news .row b { font-family: var(--f-dot); font-weight: normal; font-size: 12px; color: var(--muted); }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }

.tree { width: min(1180px, 100%); height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.tree header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tree header h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 20px; margin-right: auto; }
.tscroll { overflow: auto; flex: 1; min-height: 0; }
.tdetail { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; min-height: 72px; }
.tdetail .tx { flex: 1; min-width: 220px; font-size: 13px; line-height: 1.6; }
.tdetail .tx strong { font-size: 16px; }
.node { cursor: pointer; }
.node rect { stroke-width: 1.5; }
.node text { font-family: var(--f-body); font-size: 13px; font-weight: 800; pointer-events: none; }
.node .cost { font-family: var(--f-dot); font-size: 11px; font-weight: normal; }
.node.locked { opacity: .32; }
.node.avail rect { animation: glow 1.6s ease-in-out infinite; }
.node.afford rect { stroke-width: 3; }
@keyframes glow { 50% { stroke-opacity: .35; } }
.node.sel rect { stroke: var(--gold) !important; stroke-width: 3; }
.rowlbl { font-family: var(--f-dot); font-size: 12px; }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .deck { min-height: 230px; }
  .regs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .regs button { flex: none; }
  .cutin { position: fixed; left: 0; right: 0; top: 0; bottom: auto; aspect-ratio: 720 / 330; max-height: 60vh; z-index: 15; box-shadow: 0 10px 30px #000c; }
  .logo small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scene *, .scene, .newsbar, .toast, .stamp, .cap * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="logo">地球さら地化計画<small>サラチ星人 地球侵略作戦卓</small></div>
    <div class="stats" id="stats"></div>
    <button class="snd" id="snd" aria-pressed="true">音 ON</button>
  </div>
  <div class="main">
    <section class="world">
      <div class="earth">
        <div><div class="lbl">地球さら地率</div><div class="big" id="gsar">0.0%</div></div>
        <div><div class="lbl">平均汚染</div><div class="big" id="gpol" style="color:var(--toxic);font-size:20px">0</div></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="gauge"><i id="ggauge" style="width:0"></i></div>
      <div class="stage" id="stage">
        <svg id="map" viewBox="0 0 720 330" role="img" aria-label="世界地図。地域をタップして選ぶ"></svg>
        <div id="news"></div>
        <div id="cut"></div>
      </div>
      <div class="regs" id="regs" role="group" aria-label="地域を選ぶ"></div>
      <div class="rinfo" id="rinfo"></div>
    </section>
    <section class="orders">
      <div class="ohead"><h2>作戦</h2><div class="ap" id="ap"></div></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="deck" id="deck" role="tabpanel"></div>
      <div class="swipehint">左右にスワイプでも切り替え</div>
      <div class="foot">
        <button class="btn" id="btnTree">研究ツリー</button>
        <button class="btn primary grow1" id="btnEnd">今月を終える</button>
      </div>
    </section>
  </div>
</div>
<div id="ovl"></div>

<script>
// ---------- world ----------
const P = (lon, lat) => [(lon + 180) * 2, (90 - lat) * 2 - 20];
const REG = [
  { id: 'na', name: '北米', w: 5, trait: { space: .25, weapon: .2 }, tt: '隕石迎撃と防空網が強い（宇宙-25%・兵器-20%）',
    polys: [[[-165,65],[-140,70],[-95,72],[-75,62],[-60,50],[-80,32],[-82,25],[-97,20],[-105,22],[-117,32],[-125,48],[-140,60]],

function cityRow(ix, nFall, t, mode) {
  const out = [], bl = [];
  let x = 14;
  while (x < 706) { const w = R(44, 76); bl.push({ x, w, h: R(70, 185) }); x += w + R(4, 10); }
  const order = bl.map((b, i) => [Math.abs(b.x + b.w / 2 - ix), i]).sort((a, b) => a[0] - b[0]).slice(0, nFall).map(p => p[1]);
  bl.forEach((b, i) => {
    const k = order.indexOf(i), cls = k >= 0 ? mode : '';
    const sh = pick(['#5b6578', '#4d566a', '#6a7286', '#575f72']);
    out.push(`<g class="${cls}" style="${d(t + Math.max(0, k) * .06)}"><rect x="${b.x}" y="${GY - b.h}" width="${b.w}" height="${b.h}" fill="${sh}"/><rect x="${b.x}" y="${GY - b.h}" width="${b.w}" height="${b.h}" fill="url(#win)"/><rect x="${b.x}" y="${GY - b.h}" width="${b.w}" height="5" fill="#0003"/></g>`);
  });
  return `<g clip-path="url(#above)">${out.join('')}</g>`;
}

  if ($('tbuy')) $('tbuy').onclick = () => {
    if (G.rp < n.cost) return;
    G.rp -= n.cost; G.owned[n.id] = 1;
    if (n.id === 'crew' || n.id === 'h3') G.ap++;
    if (n.id === 'h3') G.hp++;
    sfx('build');
    const t = n.act && n.act.t !== 'none' ? n.br : null;
    toast(`研究完了：${n.name}${t && !G.seenTab[t] ? `　「${BR[t].name}」タブが増えた` : ''}`);
    save(); refreshTree();
  };
}
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1400); }

// ---------- save ----------
function save() { if (window.FAST) return; try { localStorage.setItem('sarachi-save2', JSON.stringify(G)); } catch (e) {} }

// ---------- boot ----------
G = newGame();
buildMap();
render();
showIntro();
$('btnEnd').onclick = endTurn;
$('btnTree').onclick = showTree;
$('snd').onclick = () => { soundOn = !soundOn; $('snd').textContent = soundOn ? '音 ON' : '音 OFF'; $('snd').setAttribute('aria-pressed', soundOn); try { localStorage.setItem('sarachi-sound', soundOn ? 'on' : 'off'); } catch (e) {} if (soundOn) sfx('coin'); };
$('snd').textContent = soundOn ? '音 ON' : '音 OFF';
$('regs').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { G.sel = b.dataset.r; render(); } });
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; const ts = tabsList().map(t => t.id); setTab(b.dataset.t, Math.sign(ts.indexOf(b.dataset.t) - ts.indexOf(G.tab))); });
$('deck').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) { build(FAC.find(x => x.id === f.dataset.f)); return; }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = allActs().find(x => x.key === b.dataset.a); if (a) doAct(a);
});
// swipe left / right on the cards to switch tabs
let sw = null;
$('deck').addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
$('deck').addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * .7) return;
  const ts = tabsList().map(t => t.id), i = ts.indexOf(G.tab), j = (i + (dx < 0 ? 1 : -1) + ts.length) % ts.length;
  setTab(ts[j], dx < 0 ? 1 : -1);
});
document.addEventListener('keydown', e => {
  if ($('ovl').innerHTML) { if (e.key === 'Escape' && $('tclose')) { closeOv(); render(); } return; }
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { const ts = tabsList().map(t => t.id), i = ts.indexOf(G.tab), dir = e.key === 'ArrowRight' ? 1 : -1; setTab(ts[(i + dir + ts.length) % ts.length], dir); }
});
</script>
