<title>地球さら地化計画</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
/* Layout: an alien invader's war table. Status strip on top, the world map on the left,
   orders on the right; the research tree opens as a full overlay. Deliberately one dark look. */
:root {
  --space: #120d1f;
  --panel: #1d1630;
  --panel-2: #261d3f;
  --line: #3b2f5c;
  --text: #efe9f7;
  --muted: #a99fc0;
  --scorch: #e3a252;
  --toxic: #d94fd0;
  --human: #5fb8ff;
  --danger: #ff5a5a;
  --gold: #ffd34d;
  --land: #4b8a5f;
  --sea: #10284a;
  --f-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --f-dot: 'DotGothic16', 'Osaka-Mono', 'MS Gothic', monospace;
  --f-body: 'M PLUS 1p', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--space);
  background-image: radial-gradient(1px 1px at 12% 20%, #fff8 50%, transparent 51%),
    radial-gradient(1px 1px at 72% 12%, #fff6 50%, transparent 51%),
    radial-gradient(1.5px 1.5px at 40% 80%, #fff5 50%, transparent 51%),
    radial-gradient(1px 1px at 88% 66%, #fff7 50%, transparent 51%);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 15px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px;
  overflow-x: hidden;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.app { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; }

/* status strip */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
.logo { font-family: var(--f-display); font-size: 22px; letter-spacing: .04em; color: var(--scorch); margin-right: auto; text-wrap: balance; }
.logo small { display: block; font-family: var(--f-dot); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.stats { display: flex; flex-wrap: wrap; gap: 6px; }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font-family: var(--f-dot); font-variant-numeric: tabular-nums; font-size: 15px; display: flex; gap: 6px; align-items: baseline; }
.stat b { font-weight: normal; font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.stat.alert { min-width: 150px; }
.bar { height: 6px; width: 70px; background: #0006; border-radius: 3px; overflow: hidden; align-self: center; }
.bar i { display: block; height: 100%; background: var(--human); transition: width .4s; }
.hp { color: var(--danger); letter-spacing: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; align-items: start; }
@media (max-width: 880px) { .main { grid-template-columns: minmax(0, 1fr); } }

/* map */
.mapbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.earth { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.earth .big { font-family: var(--f-display); font-size: 34px; color: var(--scorch); font-variant-numeric: tabular-nums; line-height: 1; }
.earth .lbl { font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.earth .goal { margin-left: auto; font-family: var(--f-dot); font-size: 13px; color: var(--muted); }
.gauge { height: 10px; background: #0007; border-radius: 5px; overflow: hidden; position: relative; }
.gauge i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, #a5602a, var(--scorch)); transition: width .5s; }
.gauge::after { content: ""; position: absolute; left: 95%; top: 0; bottom: 0; width: 2px; background: var(--gold); }
svg.map { width: 100%; height: auto; display: block; border-radius: 8px; background: var(--sea); max-width: 100%; }
.reg { cursor: pointer; stroke: #0c1a30; stroke-width: 1; transition: fill .4s; }
.reg.sel { stroke: var(--gold); stroke-width: 2.4; }
.rlabel { font-family: var(--f-dot); font-size: 11px; fill: #fff; paint-order: stroke; stroke: #000a; stroke-width: 3px; pointer-events: none; text-anchor: middle; }
.boom { fill: none; stroke-width: 3; animation: boom .9s ease-out forwards; }
@keyframes boom { from { r: 2; opacity: 1; } to { r: 46; opacity: 0; } }
.pop { font-family: var(--f-display); font-size: 16px; text-anchor: middle; paint-order: stroke; stroke: #000; stroke-width: 3px; animation: pop 1.2s ease-out forwards; }
@keyframes pop { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }
.streak { stroke-width: 3; stroke-linecap: round; animation: streak .5s ease-in forwards; }
@keyframes streak { from { stroke-dashoffset: 120; } to { stroke-dashoffset: 0; } }
.shake { animation: shake .35s; }
@keyframes shake { 25% { transform: translate(3px, -2px); } 50% { transform: translate(-3px, 2px); } 75% { transform: translate(2px, 1px); } }
@media (prefers-reduced-motion: reduce) { .boom, .pop, .streak, .shake { animation-duration: .01s; } }

.regs { display: flex; flex-wrap: wrap; gap: 5px; }
.regs button { border: 1px solid var(--line); background: var(--panel-2); border-radius: 5px; padding: 3px 8px; font-size: 12px; display: flex; gap: 5px; align-items: baseline; }
.regs button span { font-family: var(--f-dot); color: var(--scorch); font-variant-numeric: tabular-nums; }
.regs button[aria-pressed="true"] { border-color: var(--gold); background: #3a2f12; }
.rinfo { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13px; align-items: center; }
.rinfo h3 { grid-column: 1 / -1; margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 18px; }
.rinfo .k { color: var(--muted); font-size: 12px; }
.rinfo .trait { grid-column: 1 / -1; color: var(--human); font-size: 12px; }
.mini { height: 8px; background: #0007; border-radius: 4px; overflow: hidden; }
.mini i { display: block; height: 100%; }

.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px; padding: 10px 14px; font-weight: 800; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--scorch); color: #2a1606; border-color: var(--scorch); }
.btn.primary:hover { filter: brightness(1.08); }
.btn[disabled] { opacity: .4; cursor: default; }
.grow { flex: 1; }

/* orders */
.orders { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.orders h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 17px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.orders h2 span { font-family: var(--f-dot); font-size: 13px; color: var(--muted); }
.list { display: flex; flex-direction: column; gap: 6px; max-height: 640px; overflow-y: auto; padding-right: 2px; }
.grp { font-size: 11px; letter-spacing: .14em; color: var(--muted); margin-top: 4px; }
.act { text-align: left; border: 1px solid var(--line); border-left: 4px solid var(--c, var(--line)); background: var(--panel-2); border-radius: 6px; padding: 7px 10px; display: flex; flex-direction: column; gap: 3px; }
.act:hover:not([disabled]) { border-color: var(--c, var(--muted)); }
.act[disabled] { opacity: .42; cursor: default; }
.act .nm { font-weight: 800; display: flex; justify-content: space-between; gap: 8px; }
.act .nm small { font-weight: 500; color: var(--muted); font-size: 11px; white-space: nowrap; }
.act .ds { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; font-family: var(--f-dot); font-size: 12px; }
.chip { padding: 1px 6px; border-radius: 4px; background: #0005; }
.chip.s { color: var(--scorch); } .chip.p { color: var(--toxic); } .chip.a { color: var(--human); } .chip.g { color: #9be39b; } .chip.c { color: var(--muted); }
.chip.res { color: var(--danger); }

.log { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); max-height: 110px; overflow-y: auto; }
.log p { margin: 2px 0; }
.log p:first-child { color: var(--text); }

/* overlays */
.ov { position: fixed; inset: 0; background: #07040fe6; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px; width: min(620px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 24px; color: var(--scorch); text-wrap: balance; }
.card p { margin: 0; line-height: 1.75; }
.news { border-top: 2px solid var(--scorch); padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.news .row { display: grid; grid-template-columns: 5.5em 1fr; gap: 8px; font-size: 14px; line-height: 1.5; }
.news .row b { font-family: var(--f-dot); font-weight: normal; font-size: 12px; color: var(--muted); padding-top: 2px; }
.news .row.hot b { color: var(--danger); }
.news .row.good b { color: var(--scorch); }
.kicker { font-family: var(--f-dot); font-size: 13px; color: var(--muted); letter-spacing: .12em; }

.tree { width: min(1180px, 100%); height: 100%; max-height: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; }
.tree header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tree header h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 20px; margin-right: auto; }
.tscroll { overflow: auto; flex: 1; min-height: 0; }
.tdetail { border-top: 1px solid var(--line); padding: 10px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; min-height: 72px; }
.tdetail .tx { flex: 1; min-width: 220px; font-size: 13px; line-height: 1.6; }
.tdetail .tx strong { font-size: 16px; }
.node { cursor: pointer; }
.node rect { stroke-width: 1.5; }
.node text { font-family: var(--f-body); font-size: 13px; font-weight: 800; pointer-events: none; }
.node .cost { font-family: var(--f-dot); font-size: 11px; font-weight: normal; }
.node.locked { opacity: .32; }
.node.avail rect { animation: glow 1.6s ease-in-out infinite; }
@keyframes glow { 50% { stroke-opacity: .35; } }
.node.sel rect { stroke: var(--gold) !important; stroke-width: 3; }
.rowlbl { font-family: var(--f-dot); font-size: 12px; fill: var(--muted); }
</style>

<div class="app" id="app">
  <div class="top">
    <div class="logo">地球さら地化計画<small>サラチ星人 地球侵略作戦卓</small></div>
    <div class="stats" id="stats"></div>
  </div>
  <div class="main">
    <section class="mapbox" id="mapbox">
      <div class="earth">
        <div><div class="lbl">地球さら地率</div><div class="big" id="gsar">0.0%</div></div>
        <div><div class="lbl">平均汚染</div><div class="big" id="gpol" style="color:var(--toxic);font-size:22px">0</div></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="gauge"><i id="ggauge" style="width:0"></i></div>
      <svg class="map" id="map" viewBox="0 0 720 330" role="img" aria-label="世界地図"></svg>
      <div class="regs" id="regs" role="group" aria-label="地域を選ぶ"></div>
      <div class="rinfo" id="rinfo"></div>
      <div class="controls">
        <button class="btn" id="btnTree">研究ツリー</button>
        <button class="btn primary grow" id="btnEnd">今月を終える</button>
      </div>
    </section>
    <section class="orders">
      <h2>作戦 <span id="apline"></span></h2>
      <div class="list" id="acts"></div>
    </section>
  </div>
  <div class="log" id="log"></div>
</div>
<div id="ovl"></div>

<script>
// ---------- world ----------
const P = (lon, lat) => [(lon + 180) * 2, (90 - lat) * 2 - 20];
const REG = [
  { id: 'na', name: '北米', w: 5, trait: { space: .25, weapon: .2 }, tt: '隕石迎撃と防空網が強い（宇宙-25%・兵器-20%）',
    polys: [[[-165,65],[-140,70],[-95,72],[-75,62],[-60,50],[-80,32],[-82,25],[-97,20],[-105,22],[-117,32],[-125,48],[-140,60]],

    polys: [[[-10,36],[-9,43],[-2,48],[-5,58],[5,62],[15,70],[30,70],[40,62],[40,46],[28,40],[20,38],[12,44],[3,42]]] },

    polys: [[[28,40],[40,46],[60,50],[75,40],[90,30],[92,22],[80,8],[72,20],[57,25],[52,13],[43,12],[35,30]]] },

  { id: 'jp', name: '日本', w: 1, trait: { bio: .35, crust: .25 }, tt: '怪獣と地震に慣れすぎている（生物-35%・地殻-25%）', base: true,

  { id: 'oc', name: 'オセアニア', w: 3, trait: { bio: .25 }, tt: '元から生き物がヤバいので怪獣に驚かない（生物-25%）',
    polys: [[[114,-22],[122,-18],[132,-12],[142,-11],[153,-25],[150,-37],[140,-38],[130,-32],[116,-34]],
            [[95,5],[105,-6],[120,-9],[140,-5],[125,5],[110,2]]] },
];
const RW = REG.reduce((s, r) => s + r.w, 0);

// ---------- research tree ----------
const BR = {
  base:    { name: '基盤',   row: 0, c: '#e8c770' },
  stealth: { name: '隠密',   row: 1, c: '#8fa6c4' },
  trick:   { name: 'からめ手', row: 2, c: '#f07ad6' },

  crust:   { name: '地殻',   row: 7, c: '#c98a4a' },
  combo:   { name: '合わせ技', c: '#ffd34d' },
};
// act fields: t = target ('reg' | 'all' | 'none'), pw = さら地 power, dur = turns (power per turn), pol, al = alert,
// m/r = money/materials cost, gm/gr/grp = gains, cd = cooldown turns
const NODES = [
  { id: 'lang', br: 'base', col: 0, row: 0, cost: 8, req: [], name: '地球語', desc: '現地の言葉を覚える。時給が上がり、ほかの研究の入口になる。' },

  { id: 'sci', br: 'base', col: 2, cost: 50, req: ['shell'], name: '地球人科学者を雇う', desc: '毎月の研究が +8。「給料がいいので」と誰も疑わない。' },
  { id: 'crew', br: 'base', col: 3, cost: 95, req: ['sci'], name: '戦闘員募集', desc: '毎月の行動回数 +1、研究 +3。求人誌に「アットホームな職場です」。' },
  { id: 'corp', br: 'base', col: 4, cost: 180, req: ['crew'], name: '多国籍企業', desc: '毎月の資金 +60、研究 +6。人類の経済を内側から握る。' },

  { id: 'h1', br: 'stealth', col: 1, cost: 20, req: ['lang'], name: '変装', desc: '人類の警戒の上がり方が 20% 減る。メガネと付けひげ。' },

  { id: 'k1', br: 'trick', col: 1, cost: 30, req: ['lang'], name: 'ネットを止める', desc: '地域の復興を 3 か月止める。人類は何もできなくなる。',

  { id: 'k2', br: 'trick', col: 2, cost: 55, req: ['k1'], name: 'だらけ電波', desc: '人類がやる気をなくして街を放っておく。建物は残る。',
    act: { name: 'だらけ電波', t: 'reg', pw: 2.5, dur: 5, freeze: 5, al: 3, m: 20, desc: '5か月かけてじわじわ無人に' } },
  { id: 'k3', br: 'trick', col: 3, cost: 130, req: ['k2'], name: '全員を眠らせる', desc: '地域まるごと眠らせる。汚染ゼロ、建物はそのまま。',
    act: { name: '全員を眠らせる', t: 'reg', pw: 20, al: 7, m: 60, r: 10, desc: '地域まるごと無人に' } },
  { id: 'k4', br: 'trick', col: 4, cost: 275, req: ['k3'], name: 'よその星へ引っ越し', desc: '「もっといい星があります」と人類を送り出す。',

  { id: 'w1', br: 'weapon', col: 1, cost: 20, req: ['lang'], name: '手製爆弾', desc: '現地のホームセンターで材料をそろえる。',

const resKey = n => (n.br === 'combo' ? n.id : n.br);

function allActs() {
  const out = BASE_ACTS.map(a => ({ ...a, key: a.id }));
  for (const n of NODES) {
    if (!has(n.id)) continue;
    if (n.act) out.push({ ...n.act, key: n.id, node: n, grp: n.act.t === 'none' ? 'earn' : (n.act.clean ? 'support' : 'destroy') });
    if (n.act2) out.push({ ...n.act2, key: n.id + '_2', node: n, grp: 'earn' });

}
function effMul(a, r) {
  if (!a.node) return 1;

  return Math.max(.15, 1 - res);

function doAct(a) {

    else if (a.pw) shown = applyDmg(r, a.pw * effMul(a, r), n);
    if (a.pol && !a.dur) st.pol = Math.min(100, st.pol + a.pol);

function applyDmg(r, d, n) {

}

  // base raid
  if (G.alert >= 85 && Math.random() < (G.alert - 78) / 60 * (has('h4') ? .5 : 1)) {
    G.hp--; G.money = Math.floor(G.money * .7); G.mat = Math.floor(G.mat * .7); G.alert = clamp(G.alert - 25, 0, 100);
    news.push({ tag: '基地襲撃', hot: true, text: `地球防衛軍が基地に突入！ 資金と資材の3割を失った（基地の耐久 残り${G.hp}）` });
  }
  if (!news.length) news.push({ tag: '平和', text: pick(['今月は特に何も起きなかった。人類はのんきに暮らしている', '世界は今日も平和。侵略者はアルバイトに励んでいる']) });
  G.turn++; G.ap = maxAP();
  save(); render();
  if (!checkEnd()) showNews(news);
}
function checkEnd() {
  if (G.over) return true;
  let kind = null;
  if (globalSar() >= 95) kind = 'win';
  else if (G.hp <= 0) kind = 'caught';
  else if (G.turn > MAX_TURN) kind = 'time';
  if (!kind) return false;
  G.over = true; save(); showEnding(kind); return true;
}

// ---------- rendering ----------
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pick = a => a[Math.floor(Math.random() * a.length)];
const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, '0')).join(''); };
function landColor(st) {
  const s = st.sar / 100;
  let c = s < .5 ? mix('#4b8a5f', '#8a7a3c', s * 2) : mix('#8a7a3c', '#e2c48a', (s - .5) * 2);
  if (st.pol > 0) c = mix(c, '#b03aa8', Math.min(.7, st.pol / 110));
  return c;
}
function buildMap() {
  const svg = $('map');
  let h = '<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff10"/></pattern></defs><rect width="720" height="330" fill="url(#grid)"/>';
  for (const r of REG) {
    const pts = r.polys.map(poly => poly.map(([lo, la]) => P(lo, la)));
    const main = pts[0];
    r.cx = main.reduce((s, p) => s + p[0], 0) / main.length;
    r.cy = main.reduce((s, p) => s + p[1], 0) / main.length;
    if (r.id === 'jp') { r.cx += 20; r.cy += 4; }
    h += `<g data-r="${r.id}">` + pts.map(p => `<polygon class="reg" data-r="${r.id}" points="${p.map(q => q.join(',')).join(' ')}"/>`).join('') + '</g>';
  }
  for (const r of REG) h += `<text class="rlabel" id="lb_${r.id}" x="${r.cx.toFixed(0)}" y="${r.cy.toFixed(0)}"></text>`;
  const jp = REG.find(r => r.id === 'jp');
  h += `<g id="basemark" transform="translate(${(jp.cx - 26).toFixed(0)},${(jp.cy - 18).toFixed(0)})"><path d="M0 8 L8 0 L16 8 Z" fill="var(--gold)"/><text x="8" y="-3" class="rlabel" style="font-size:9px">基地</text></g>`;
  h += '<g id="fxl"></g>';
  svg.innerHTML = h;
  svg.addEventListener('click', e => { const t = e.target.closest('[data-r]'); if (t) { G.sel = t.dataset.r; render(); } });
}
function fxBoom(r, n) {
  const l = $('fxl'), c = BR[n.br].c, ns = 'http://www.w3.org/2000/svg';
  if (n.br === 'space' || n.id === 'x_sat' || n.id === 'w4') {
    const ln = document.createElementNS(ns, 'line');
    ln.setAttribute('x1', r.cx - 60); ln.setAttribute('y1', r.cy - 90); ln.setAttribute('x2', r.cx); ln.setAttribute('y2', r.cy);
    ln.setAttribute('stroke', c); ln.setAttribute('stroke-dasharray', '120'); ln.setAttribute('class', 'streak');
    l.appendChild(ln); setTimeout(() => ln.remove(), 700);
  }
  for (let i = 0; i < 2; i++) {
    const ci = document.createElementNS(ns, 'circle');
    ci.setAttribute('cx', r.cx); ci.setAttribute('cy', r.cy); ci.setAttribute('r', 2); ci.setAttribute('stroke', c); ci.setAttribute('class', 'boom');
    ci.style.animationDelay = (i * .18) + 's';
    l.appendChild(ci); setTimeout(() => ci.remove(), 1300);
  }
}
function fxPop(r, txt, color) {
  const l = $('fxl'), t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  t.setAttribute('x', r.cx); t.setAttribute('y', r.cy - 14); t.setAttribute('class', 'pop'); t.setAttribute('fill', color); t.textContent = txt;
  l.appendChild(t); setTimeout(() => t.remove(), 1300);
}
function render() {
  const gs = globalSar(), gp = globalPol();
  $('stats').innerHTML = `
    <div class="stat"><b>日付</b>${dateStr(G.turn)}</div>
    <div class="stat"><b>資金</b>${G.money}</div>
    <div class="stat"><b>資材</b>${G.mat}</div>
    <div class="stat"><b>研究</b>${G.rp}<span style="color:var(--muted);font-size:11px">+${rpPerTurn()}/月</span></div>
    <div class="stat alert"><b>人類の警戒</b>${Math.round(G.alert)}<span class="bar"><i style="width:${G.alert}%;background:${G.alert >= 80 ? 'var(--danger)' : 'var(--human)'}"></i></span></div>
    <div class="stat"><b>基地</b><span class="hp">${'■'.repeat(G.hp)}${'□'.repeat(Math.max(0, G.maxhp + (has('h3') ? 1 : 0) - G.hp))}</span></div>`;
  $('gsar').textContent = gs.toFixed(1) + '%';
  $('gpol').textContent = gp.toFixed(0);

  }
  $('regs').innerHTML = REG.map(x => `<button data-r="${x.id}" aria-pressed="${G.sel === x.id}">${x.name}<span>${G.reg[x.id].sar.toFixed(0)}%</span></button>`).join('');
  // region panel
  const r = REG.find(x => x.id === G.sel), st = G.reg[r.id];
  const fxs = G.fx.filter(f => f.reg === r.id).map(f => `${NODE[f.key].name}（残り${f.turns > 50 ? '∞' : f.turns}）`);
  $('rinfo').innerHTML = `<h3>${r.name}${r.base ? '<span style="font-size:12px;color:var(--gold);margin-left:8px">基地あり</span>' : ''}</h3>
    <span class="k">さら地</span><div class="mini"><i style="width:${st.sar}%;background:var(--scorch)"></i></div>
    <span class="k">汚染</span><div class="mini"><i style="width:${st.pol}%;background:var(--toxic)"></i></div>
    <div class="trait">特色：${r.tt}</div>
    ${st.freeze ? `<div class="trait" style="color:var(--muted)">復興停止中（残り${st.freeze}か月）</div>` : ''}
    ${fxs.length ? `<div class="trait" style="color:var(--muted)">進行中：${fxs.join('、')}</div>` : ''}`;
  // orders
  $('apline').textContent = `今月の行動 ${G.ap} / ${maxAP()}`;
  const acts = allActs();
  const groups = [['earn', '稼ぐ・調べる'], ['destroy', 'さら地にする'], ['support', '後始末']];
  let h = '';
  for (const [g, label] of groups) {
    const list = acts.filter(a => a.grp === g);
    if (!list.length) continue;
    h += `<div class="grp">${label}</div>`;
    for (const a of list) {
      const n = a.node, c = n ? BR[n.br].c : '#6c6288';
      const chips = [];
      const gain = gainOf(a);
      if (gain.m) chips.push(`<span class="chip g">資金+${gain.m}</span>`);
      if (gain.r) chips.push(`<span class="chip g">資材+${gain.r}</span>`);

      if (a.pw) {
        const reg = a.t === 'reg' ? r : null;
        const v = a.pw * effMul(a, reg);
        chips.push(`<span class="chip s">さら地+${v.toFixed(1)}${a.dur ? (a.dur > 50 ? '/月' : '×' + a.dur) : ''}${a.t === 'all' ? ' 全世界' : ''}</span>`);
      }
      if (a.clean) chips.push(`<span class="chip a">汚染-${a.clean}</span>`);
      if (a.pol) chips.push(`<span class="chip p">汚染+${a.pol}</span>`);
      if (a.al) chips.push(`<span class="chip a">警戒${a.al > 0 ? '+' + Math.round(a.al * stealthMul()) : a.al}</span>`);
      if (a.m) chips.push(`<span class="chip c">資金-${a.m}</span>`);
      if (a.r) chips.push(`<span class="chip c">資材-${a.r}</span>`);
      const res = n && a.pw ? (G.resist[resKey(n)] || 0) : 0;
      if (res >= .05) chips.push(`<span class="chip res">人類の対策 -${Math.round(res * 100)}%</span>`);
      if (G.cd[a.key] > 0) chips.push(`<span class="chip c">準備中 ${G.cd[a.key]}か月</span>`);
      const where = a.t === 'reg' ? r.name : a.t === 'all' ? '全世界' : '';
      h += `<button class="act" style="--c:${c}" data-a="${a.key}" ${canDo(a) ? '' : 'disabled'}>
        <span class="nm">${a.name}<small>${where}</small></span><span class="ds">${a.desc}</span><span class="chips">${chips.join('')}</span></button>`;
    }
  }
  if (!acts.some(a => a.grp === 'destroy')) h += `<p class="ds" style="color:var(--muted);font-size:13px;margin:6px 2px">まだ何も壊せない。研究ポイントを貯めて「研究ツリー」から研究すると、壊す手段が増えていく。最初は「地球語」から。</p>`;
  $('acts').innerHTML = h;
  $('btnEnd').disabled = G.over;

}
function logLine(t) { G.log.push(`${dateStr(G.turn)}　${t}`); }

// ---------- overlays ----------

function showEnding(kind) {
  const gp = globalPol();
  const tot = Object.values(G.contrib).reduce((s, v) => s + v, 0) || 1;
  const trickShare = (G.contrib.trick || 0) / tot;
  let title, body;
  if (kind === 'caught') { title = '正体がバレた'; body = '地球防衛軍に基地を押さえられた。サラチ星人はコンビニの夜勤に戻された。今もレジに立っている。'; }
  else if (kind === 'time') { title = '期限切れ'; body = `10年たっても人類はしぶとく暮らしていた。本星の総帥が到着し、まだ人がいる地球を見て黙って帰っていった。（さら地率 ${globalSar().toFixed(1)}%）`; }
  else if (gp >= 45) { title = 'さら地にはなった。でも住めない'; body = '地球は見事に更地になった。ただし汚染がひどすぎて、サラチ星人は防護服なしでは外に出られない。本星への報告書には「住めます（たぶん）」と書いた。'; }
  else if (trickShare >= .4) { title = '人類の家に住んでいるだけ'; body = '人類はいなくなったが、街はまるごと残った。サラチ星人は人類のマンションに住み、人類のコンビニの品出しをしている。これは侵略だったのだろうか。'; }
  else if (gp < 15) { title = 'サラチ星人の楽園'; body = '汚染の少ない、まっさらな地球ができあがった。本星から仲間が次々と移住してくる。さあ、ここから自分たちの街を作ろう。'; }
  else { title = '荒れ地だけど住める'; body = 'あちこち焦げているが、なんとか住めそうだ。サラチ星人はまず、瓦礫の片付けから始めることにした。'; }
  const top = Object.entries(G.contrib).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, v]) => `${(BR[k] || { name: k }).name} ${Math.round(v / tot * 100)}%`).join('　');
  overlay(`<div class="card"><div class="kicker">${dateStr(Math.min(G.turn, MAX_TURN))}　計画終了</div><h2>${title}</h2><p>${body}</p>
    <div class="news">

      <div class="row"><b>平均汚染</b><span>${gp.toFixed(0)}</span></div>

  $('again').onclick = () => { G = newGame(); save(); closeOv(); render(); };
}

// ---------- research tree ----------
let treeSel = null;
const TX = c => 110 + c * 175, TY = r => 18 + r * 100, NW = 140, NH = 44;
function nodeState(n) {
  if (has(n.id)) return 'owned';
  return n.req.every(has) ? 'avail' : 'locked';
}
function treeSvg() {
  const W = TX(4) + NW + 20, H = TY(7) + NH + 20;
  let h = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block">`;
  for (const k in BR) if (BR[k].row !== undefined) h += `<text class="rowlbl" x="10" y="${TY(BR[k].row) + 27}" fill="${BR[k].c}" style="fill:${BR[k].c}">${BR[k].name}</text>`;
  for (const n of NODES) for (const q of n.req) {
    const p = NODE[q], x1 = TX(p.col) + NW, y1 = TY(p.row) + NH / 2, x2 = TX(n.col), y2 = TY(n.row) + NH / 2, mx = (x1 + x2) / 2;
    const lit = has(q);
    h += `<path d="M${x1} ${y1} C${mx} ${y1} ${mx} ${y2} ${x2} ${y2}" fill="none" stroke="${n.br === 'combo' ? '#ffd34d' : '#6c5f92'}" stroke-opacity="${lit ? .9 : .3}" stroke-width="${n.br === 'combo' ? 2 : 1.5}" ${n.br === 'combo' ? 'stroke-dasharray="5 4"' : ''}/>`;
  }
  for (const n of NODES) {
    const s = nodeState(n), c = BR[n.br].c, x = TX(n.col), y = TY(n.row);
    const fill = s === 'owned' ? mix(c, '#1d1630', .55) : '#1d1630';
    h += `<g class="node ${s === 'locked' ? 'locked' : s === 'avail' ? 'avail' : ''} ${treeSel === n.id ? 'sel' : ''}" data-n="${n.id}" tabindex="0" role="button" aria-label="${n.name}">
      <rect x="${x}" y="${y}" width="${NW}" height="${NH}" rx="${n.br === 'combo' ? 14 : 6}" fill="${fill}" stroke="${c}"/>
      <text x="${x + 8}" y="${y + 18}" fill="#efe9f7" style="font-size:${n.name.length > 9 ? 11 : 13}px">${n.name}</text>
      <text class="cost" x="${x + 8}" y="${y + 35}" fill="${s === 'owned' ? c : '#a99fc0'}">${s === 'owned' ? '研究済み' : '研究 ' + n.cost}</text></g>`;
  }
  return h + '</svg>';
}
function showTree() {
  overlay(`<div class="tree"><header><h2>研究ツリー</h2><span class="stat"><b>研究</b>${G.rp}</span><button class="btn" id="tclose">閉じる</button></header>
    <div class="tscroll" id="tscroll">${treeSvg()}</div><div class="tdetail" id="tdetail"></div></div>`);
  $('tclose').onclick = () => { closeOv(); render(); };
  const sc = $('tscroll');
  sc.addEventListener('click', e => { const g = e.target.closest('[data-n]'); if (g) { treeSel = g.dataset.n; refreshTree(); } });
  sc.addEventListener('keydown', e => { const g = e.target.closest('[data-n]'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); treeSel = g.dataset.n; refreshTree(); } });
  if (!treeSel) treeSel = (NODES.find(n => nodeState(n) === 'avail') || NODES[0]).id;
  refreshTree(false);
}
function refreshTree(redraw = true) {
  if (redraw) { const sc = $('tscroll'), l = sc.scrollLeft, t = sc.scrollTop; sc.innerHTML = treeSvg(); sc.scrollLeft = l; sc.scrollTop = t; }
  document.querySelector('.tree header .stat').innerHTML = `<b>研究</b>${G.rp}`;
  const n = NODE[treeSel], s = nodeState(n);
  const reqTxt = n.req.length ? '必要：' + n.req.map(q => (has(q) ? '✓' : '') + NODE[q].name).join(' ＋ ') : '';
  let btn;
  if (s === 'owned') btn = '<button class="btn" disabled>研究済み</button>';
  else if (s === 'locked') btn = '<button class="btn" disabled>前の研究が必要</button>';
  else btn = `<button class="btn primary" id="tbuy" ${G.rp < n.cost ? 'disabled' : ''}>研究する（${n.cost}）</button>`;
  $('tdetail').innerHTML = `<div class="tx"><strong style="color:${BR[n.br].c}">${n.name}</strong>　<span style="color:var(--muted)">${BR[n.br].name}　${reqTxt}</span><br>${n.desc}</div>${btn}`;
  if ($('tbuy')) $('tbuy').onclick = () => {
    if (G.rp < n.cost) return;
    G.rp -= n.cost; G.owned[n.id] = 1;
    if (n.id === 'crew' || n.id === 'h3') G.ap++;
    if (n.id === 'h3') G.hp++;
    logLine(`研究完了：${n.name}`); save(); refreshTree();
  };
}
