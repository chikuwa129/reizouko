<title>荒野ロック平和伝</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=DotGothic16&family=M+PLUS+1p:wght@500;800&display=swap">
<style>
/* Layout: a mohawk's hideout in a ruined gas station. Wasteland map of gang turf on the left,
   the garage studio and the tabbed workbench on the right. Dusty sand + rust + one neon pink. One look. */
:root {
  --sand: #e9d3a6;
  --dust: #f4e6c8;
  --card: #fbf2df;
  --ink: #2a1f1a;
  --muted: #7d6a58;
  --line: #d5b98a;
  --rust: #b5452a;
  --neon: #ff3d8b;
  --calm: #3a9a62;
  --warn: #e0a020;
  --melody: #ff3d8b;
  --groove: #e07a1a;
  --sky: #3f8fc0;
  --f-display: 'Dela Gothic One', 'Hiragino Sans', 'Noto Sans JP', sans-serif;
  --f-dot: 'DotGothic16', 'Osaka-Mono', 'MS Gothic', monospace;
  --f-body: 'M PLUS 1p', 'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sand);
  background-image: radial-gradient(#d9bd88 1px, transparent 1.3px), radial-gradient(#f3e2bd 1px, transparent 1.3px);
  background-size: 22px 22px, 31px 31px;
  background-position: 0 0, 11px 7px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--neon); outline-offset: 2px; }
.app { max-width: 1280px; height: 100%; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.logo { font-family: var(--f-display); font-size: 25px; color: var(--ink); margin-right: auto; line-height: 1.05; letter-spacing: .02em; text-shadow: 2px 2px 0 var(--neon); }
.logo small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: .08em; font-weight: 500; text-shadow: none; }
.stats { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.stat { background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 2px 9px; font-family: var(--f-dot); font-variant-numeric: tabular-nums; font-size: 15px; display: flex; gap: 5px; align-items: baseline; box-shadow: 2px 2px 0 var(--ink); }
.stat b { font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--muted); }
.stat.neg { color: var(--rust); }
.speed { display: flex; gap: 3px; background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 3px; box-shadow: 2px 2px 0 var(--ink); }
.speed button { border: 0; background: transparent; border-radius: 4px; padding: 3px 8px; font-size: 12px; font-weight: 800; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--dust); }
.snd { background: var(--card); border: 2px solid var(--ink); border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 800; box-shadow: 2px 2px 0 var(--ink); }

.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.panel { background: var(--card); border: 2px solid var(--ink); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; box-shadow: 4px 4px 0 var(--ink); }

.peace { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.peace .big { font-family: var(--f-display); font-size: 30px; color: var(--calm); line-height: 1; font-variant-numeric: tabular-nums; }
.peace .lbl { font-size: 11px; color: var(--muted); }
.peace .goal { margin-left: auto; font-family: var(--f-dot); font-size: 12px; color: var(--muted); text-align: right; }
.stage { container-type: inline-size; position: relative; border-radius: 8px; overflow: hidden; background: #d9b779; aspect-ratio: 720 / 330; max-width: 100%; flex: none; border: 2px solid var(--ink); }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.terr { cursor: pointer; }
.terr circle.body { stroke: var(--ink); stroke-width: 2.5; transition: fill .8s; }
.terr.sel circle.ring { stroke: var(--neon); stroke-width: 4; fill: none; }
.terr.locked { opacity: .45; }
.tlabel { font-family: var(--f-body); font-weight: 800; font-size: 13px; fill: var(--ink); paint-order: stroke; stroke: #f4e6c8; stroke-width: 4px; text-anchor: middle; pointer-events: none; }
.tval { font-family: var(--f-dot); font-size: 12px; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #f4e6c8; stroke-width: 3px; }
.bandmark { animation: bob .6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-4px); } }

.rinfo { display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
.rinfo h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rinfo h3 small { font-weight: 500; color: var(--rust); font-size: 12px; }
.rinfo .row { display: flex; flex-wrap: wrap; gap: 4px 12px; color: var(--muted); }
.rinfo .row b { color: var(--ink); font-weight: 800; }
.tbar { height: 9px; background: #ead7b2; border-radius: 4px; overflow: hidden; border: 1px solid var(--line); }
.tbar i { display: block; height: 100%; transition: width .6s, background .6s; }
.ticker { font-size: 12px; color: var(--muted); border-top: 2px dashed var(--line); padding-top: 6px; line-height: 1.5; }
.ticker b { color: var(--ink); }

.room { position: relative; border-radius: 8px; overflow: hidden; border: 2px solid var(--ink); aspect-ratio: 360 / 104; flex: none; max-width: 100%; }
.room svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mem { animation: bob .45s ease-in-out infinite alternate; }
.mem.idle { animation-duration: 1.4s; }
.bub { font-family: var(--f-dot); font-size: 11px; paint-order: stroke; stroke: #fff; stroke-width: 3px; animation: bub 1.1s ease-out both; text-anchor: middle; }
@keyframes bub { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 2px solid var(--ink); background: var(--dust); border-radius: 6px; padding: 3px 12px; font-size: 13px; font-weight: 800; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--dust); }
.desk { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
.desk.slide-l { animation: slideL .2s ease-out; } .desk.slide-r { animation: slideR .2s ease-out; }
@keyframes slideL { from { transform: translateX(26px); opacity: 0; } } @keyframes slideR { from { transform: translateX(-26px); opacity: 0; } }
.lab { font-size: 11px; color: var(--muted); letter-spacing: .06em; }
.chipset { display: flex; flex-wrap: wrap; gap: 4px; }
.pick { border: 2px solid var(--line); background: var(--dust); border-radius: 5px; padding: 3px 8px; font-size: 13px; display: flex; gap: 4px; align-items: center; }
.pick[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--dust); }
.pick .mk { font-size: 12px; font-weight: 800; }
.pick.fusion { border-style: dashed; border-color: var(--neon); }
.go { border: 2px solid var(--ink); background: var(--neon); color: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 800; font-size: 15px; box-shadow: 3px 3px 0 var(--ink); }
.go:active:not([disabled]) { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.go[disabled] { background: #cdb894; color: #fff; box-shadow: none; cursor: default; }
.go.alt { background: var(--rust); }
.prog { display: flex; flex-direction: column; gap: 6px; background: var(--dust); border-radius: 8px; padding: 8px 10px; border: 2px solid var(--line); }
.prog .t { font-weight: 800; font-size: 15px; }
.pbar { height: 12px; background: #ead7b2; border-radius: 6px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--neon); transition: width .4s; }
.mn { display: flex; gap: 12px; font-family: var(--f-dot); font-size: 14px; }
.mn .m { color: var(--melody); } .mn .n { color: var(--groove); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.item { border: 2px solid var(--line); background: var(--dust); border-radius: 8px; padding: 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.item.empty { border-style: dashed; color: var(--muted); justify-content: center; align-items: center; min-height: 40px; font-size: 12px; text-align: center; }
button.item[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
button.item[disabled] { opacity: .4; cursor: default; }
.item .nm { font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.item .sub { font-size: 11px; color: var(--muted); }
.rank { font-family: var(--f-display); font-size: 15px; line-height: 1; }
.rank.S { color: var(--neon); } .rank.A { color: var(--rust); } .rank.B { color: var(--sky); } .rank.C, .rank.D { color: var(--muted); }
.tag { font-size: 11px; padding: 0 5px; border-radius: 4px; background: #ead7b2; }
.tag.like { background: #d3ecd9; color: #1d6a3c; } .tag.hate { background: #f6d2c8; color: #922f1a; } .tag.tired { background: #eee; color: var(--muted); }
.sbar { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2em; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.sbar span:last-child { font-family: var(--f-dot); color: var(--ink); text-align: right; }
.sbar .tb { height: 5px; background: #ead7b2; border-radius: 3px; overflow: hidden; }
.sbar .tb i { display: block; height: 100%; }
.small { border: 2px solid var(--ink); background: #fff; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 800; }
.small[disabled] { opacity: .4; cursor: default; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.foot { font-size: 11px; color: var(--muted); text-align: center; }

/* cut-in theatre */
.cutin { position: absolute; inset: 0; z-index: 3; cursor: pointer; background: #000; container-type: inline-size; }
.cutin svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px 10px; background: linear-gradient(transparent, #000c 45%); display: flex; align-items: flex-end; gap: 10px; color: #fff; pointer-events: none; }
.cap .nm { font-family: var(--f-display); font-size: clamp(15px, 4cqw, 30px); line-height: 1.1; animation: capin .3s cubic-bezier(.2,1.6,.4,1) both; }
.cap .rg { font-size: 12px; opacity: .85; }
.cap .val { margin-left: auto; font-family: var(--f-display); font-size: clamp(15px, 4cqw, 30px); color: #9ff0b8; white-space: nowrap; animation: capin .3s .4s cubic-bezier(.2,1.6,.4,1) both; }
.cap .val.bad { color: #ff9a86; }
@keyframes capin { from { transform: scale(1.8); opacity: 0; } }
.say { position: absolute; right: 3%; top: 6%; max-width: 46%; background: #fff; color: var(--ink); border: 3px solid var(--ink); border-radius: 14px; padding: 5px 12px; font-weight: 800; font-size: clamp(11px, 2.4cqw, 18px); line-height: 1.35; animation: capin .3s 1s both; pointer-events: none; }
.stamp { position: absolute; left: 44%; top: 40%; transform: translate(-50%, -50%) rotate(-8deg); font-family: var(--f-display); font-size: var(--fs, 7cqw); color: #fff; border: 5px solid #fff; padding: 2px 16px; border-radius: 10px; background: #ff3d8bdd; white-space: nowrap; animation: stamp .35s 1.3s cubic-bezier(.3,1.8,.5,1) both; pointer-events: none; }
.stamp.gold { background: #e0a020ee; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(3); opacity: 0; } }
.skip { position: absolute; left: 8px; top: 4px; font-size: 10px; color: #fff9; font-family: var(--f-dot); pointer-events: none; }
.hud { position: absolute; left: 8px; top: 8px; width: min(46%, 300px); background: #000b; color: #fff; border-radius: 8px; padding: 6px 10px; display: flex; flex-direction: column; gap: 3px; font-size: 12px; pointer-events: none; }
.hrow { display: flex; justify-content: space-between; gap: 6px; }
.hrow b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar { height: 8px; background: #fff3; border-radius: 4px; overflow: hidden; }
.hbar i { display: block; height: 100%; width: 0; background: #9ff0b8; }
.hbar.danger i { background: #ff5a3a; }
.hsub { font-size: 11px; opacity: .8; }
.cutin.battle { position: fixed; left: 50%; top: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: min(1100px, 96vw); aspect-ratio: 720 / 330; max-height: 92vh; z-index: 18; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 100vmax #000a; cursor: default; }
.hypebtn { position: absolute; left: 14px; bottom: 12px; border: 3px solid #fff; background: var(--neon); color: #fff; font-family: var(--f-display); font-size: clamp(16px, 4cqw, 26px); padding: 8px 18px; border-radius: 999px; box-shadow: 0 4px 0 #8a1a4a; }
.hypebtn[disabled] { opacity: .5; }
.hypebtn:active:not([disabled]) { transform: translateY(3px); box-shadow: 0 1px 0 #8a1a4a; }
.scene * { transform-box: fill-box; }
.fly { animation: fly 1.6s ease-out both; }
@keyframes fly { from { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--dx, 20px), -110px); opacity: 0; } }
.drop { transform-origin: 50% 100%; animation: drop .5s ease-in both; }
@keyframes drop { to { transform: translateY(26px) rotate(80deg); opacity: 0; } }
.dance { transform-origin: 50% 100%; animation: dance .32s ease-in-out infinite alternate; }
@keyframes dance { from { transform: rotate(-7deg); } to { transform: rotate(7deg) translateY(-3px); } }
.armsup { transform-origin: 50% 100%; animation: armsup .3s both; }
@keyframes armsup { from { transform: scaleY(0); } }
.angry { animation: angry .12s linear infinite alternate; }
@keyframes angry { to { transform: translateX(3px); } }
.sleepy { transform-origin: 50% 100%; animation: sleepy 1s ease-in-out both; }
@keyframes sleepy { to { transform: rotate(-70deg) translateY(10px); } }
.head { transform-origin: 50% 100%; animation: bang .22s ease-in-out infinite alternate; }
@keyframes bang { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
.spin { transform-origin: center; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pop { transform-origin: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: scale(0); } }
.light { transform-origin: 50% 0; animation: light 1.2s ease-in-out infinite alternate; }
@keyframes light { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }
.tear { animation: tear .6s ease-in infinite; }
@keyframes tear { from { transform: translateY(0); opacity: 1; } to { transform: translateY(18px); opacity: 0; } }
.shake { animation: angry .1s linear 8 alternate; }

/* overlays */
.ov { position: fixed; inset: 0; background: #2a1f1acc; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--card); border: 3px solid var(--ink); border-radius: 12px; padding: 20px; width: min(600px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; box-shadow: 6px 6px 0 var(--neon); }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 28px; text-wrap: balance; }
.card p { margin: 0; line-height: 1.8; }
.kicker { font-family: var(--f-dot); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.rows { border-top: 2px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.rows div { display: grid; grid-template-columns: 7em 1fr; gap: 8px; }
.rows b { font-weight: 500; color: var(--muted); font-size: 12px; }
.choice { display: flex; flex-direction: column; gap: 6px; }
.choice button { text-align: left; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--dust); padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 800; z-index: 30; animation: toast 1.6s ease-out both; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { transform: translate(-50%, 20px); opacity: 0; } 12% { transform: translate(-50%, 0); opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .cutin { position: fixed; left: 0; right: 0; top: 0; bottom: auto; aspect-ratio: 720 / 330; max-height: 60vh; z-index: 15; box-shadow: 0 10px 30px #0008; }
  .logo small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scene *, .mem, .bandmark, .bub, .toast, .stamp, .say, .cap * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>

<div class="app">
  <div class="top">
    <div class="logo">荒野ロック平和伝<small>モヒカンのザコ、ギター一本で世界を平和にする</small></div>
    <div class="stats" id="stats"></div>
    <div class="speed" id="speed" role="group" aria-label="時間の速さ">
      <button data-s="0">停止</button><button data-s="1">1倍</button><button data-s="2">2倍</button><button data-s="4">4倍</button>
    </div>
    <button class="snd" id="snd">音 ON</button>
  </div>
  <div class="main">
    <section class="panel">
      <div class="peace">
        <div><div class="lbl">荒野の平和度</div><div class="big" id="gpeace">0%</div></div>
        <div><div class="lbl">信者</div><div class="big" id="gfans" style="font-size:22px;color:var(--neon)">0</div></div>
        <div><div class="lbl">ステージ</div><div class="big" id="gvenue" style="font-size:18px;color:var(--ink)">路上</div></div>
        <div><div class="lbl">警備スタッフ</div><div class="big" id="gguard" style="font-size:18px;color:#b08000">0</div></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="stage" id="stage">
        <svg id="map" viewBox="0 0 720 330" role="img" aria-label="荒野の地図。縄張りをタップして選ぶ"></svg>
        <div id="cut"></div>
      </div>
      <div class="rinfo" id="rinfo"></div>
      <div class="ticker" id="ticker" aria-live="polite"></div>

    <section class="panel">
      <div class="room" id="room"></div>
      <div class="tabs" id="tabs" role="tablist"></div>

  </div>
</div>
<div id="ovl"></div>

<script>
// ================= data =================
// turf on the wasteland map. A boss runs each one; liberate it with music and the boss joins you.
const TERR = [
  { id: 'base', name: 'ガソスタ跡', x: 80, y: 255, home: true },
  { id: 'junk', name: '鉄くず谷', x: 205, y: 165, ten: 20, likes: ['metal', 'rock'], hates: ['ballad'], tape: 'metal', war: '鉄くずを奪い合っている',
    boss: { name: 'ガラクタ王', role: 'staff', job: 'craft', line: 'こんな音が…鉄くずから出せるのか…！', look: { hair: 'bald', hc: '#8a8a8a', shirt: '#6a6a6a', pads: true, beard: true } } },
  { id: 'buggy', name: '爆走荒野', x: 225, y: 285, ten: 25, likes: ['punk', 'rock'], hates: ['lullaby'], tape: 'punk', war: 'バギーで走り回って何でも轢く',
    boss: { name: '爆走のジン', role: 'band', part: 'dr', line: '俺の太鼓より…熱いじゃねえか', look: { hair: 'mohawk', hc: '#d0452f', shirt: '#2a1f1a', pads: true } } },
  { id: 'water', name: '水の砦', x: 345, y: 95, ten: 45, likes: ['ballad', 'enka'], hates: ['punk'], tape: 'enka', war: 'アマゾネスの女戦士たちが水を独り占めしている',
    boss: { name: '砦の女王レイラ', role: 'staff', job: 'manager', line: '…水より、しみるじゃない。気に入ったわ', look: { hair: 'long', hc: '#7a2a1a', shirt: '#8a5a2a', skin: '#c98d5e', fem: true, band: '#e0a020' } } },
  { id: 'fire', name: '火炎峡谷', x: 370, y: 230, ten: 50, likes: ['metal', 'punk'], hates: ['enka'], tape: 'gospel', war: '気に入らないものは全部燃やす',

// ================= the clock =================
function tick() {
  if (G.over) return;
  G.week++;
  if (G.prod && !G.tour) {
    for (const m of G.band.filter(x => !busy(x))) {
      const dm = Math.round((m.comp * .6 + m.sing * .3) * R(.6, 1.4)), dn = Math.round((m.play * .6 + m.sing * .3 + m.star * .1) * R(.6, 1.4));
      G.prod.m += dm; G.prod.n += dn; bubble(m.id, dm, dn);
    }
    G.prod.prog += 1 + G.fac.studio * .3;
    if (G.prod.prog >= 4) finishSong();
  }
  if (G.tour) { G.tour.left--; if (G.tour.left <= 0) (G.tour.street ? streetResult() : concert()); }
  if (G.won) return;
  for (const m of allMembers()) if (m.train > 0) {
    m.train--;
    if (m.train === 0) { m.trained++; const k = hasJob('medic') ? 2 : 1; m.comp += Math.round(R(1, 3) * k); m.play += Math.round(R(1, 3) * k); m.sing += Math.round(R(1, 3) * k); m.star += Math.round(R(0, 2) * k); news(`${m.name} の特訓が終わった。能力アップ！`); }
  }
  // tapes keep spreading: goods and believers come in, turf you can reach cools down a little
  for (const s of G.songs) {
    if (s.out >= 20) continue;
    const decay = .85 ** s.out;
    G.goods += Math.round(s.q * .12 * decay * (hasJob('manager') ? 1.4 : 1)); G.fans += Math.round(s.q * .4 * decay); s.out++;
    for (const r of TERR) if (!G.t[r.id].free && !r.final && reach(r.id)) G.t[r.id].ten = clamp(G.t[r.id].ten - Math.sqrt(s.q) / 160 * likeOf(r, s.g) * decay, 0, 100);
  }
  // liberated turf pays tribute; opening bands tour on their own
  G.goods += Math.round((freeCount() * 2 + G.fac.tower * 3) * (hasJob('manager') ? 1.4 : 1));
  const opPow = G.openers.reduce((s, b) => s + b.pow, 0);
  for (const r of TERR) {
    const st = G.t[r.id]; if (st.free) continue;
    if (r.final) { st.ten = clamp(st.ten + .3, 0, 100); continue; }
    st.ten = clamp(st.ten + (reach(r.id) ? .1 : 0) - (reach(r.id) ? opPow / 1500 : 0), 0, 100);
  }
  for (const b of G.openers) b.pow += .05;
  // believers form their own bands
  while (G.fans >= G.nextBand) { G.nextBand = Math.round(G.nextBand * 1.7); formBand({ name: '信者たち' }); }
  if (G.week % 4 === 1) {
    G.goods -= allMembers().length * 2;
    if (G.week > 12 && Math.random() < .5) { const cand = TERR.filter(r => !r.home && !G.t[r.id].free && !r.final && reach(r.id)); if (cand.length) { const r = pick(cand); G.t[r.id].ten = clamp(G.t[r.id].ten + R(2, 5), 0, 100); news(`${r.name}でまた騒ぎ：${r.war}`); } }
  }
  if (G.week % PER_YEAR === 1 && G.week > 1) award();
  if (G.goods < -60) return end('broke');
  if (G.week > WEEKS) return end('time');
  renderLive();
  if (G.tab === 'make' || G.week % 4 === 1) renderDesk();
  showJoin();
}

}

    h += `<g transform="translate(${72 + i * 72},84)" id="mem_${m.id}"><g class="mem ${G.prod ? '' : 'idle'}">${person(m)}</g>${busy(m) ? `<text x="0" y="-70" text-anchor="middle" style="font-size:10px;font-weight:800;fill:#b5452a">特訓中</text>` : ''}</g>`;
  });
  $('room').innerHTML = h + '</svg>';
}
function bubble(id, dm, dn) {
  if (window.FAST) return;
  const g = document.getElementById('mem_' + id); if (!g) return;
  [[dm, '#ff3d8b', -10], [dn, '#e07a1a', 12]].forEach(([v, c, dx], i) => {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text'); t.setAttribute('class', 'bub'); t.setAttribute('x', dx); t.setAttribute('y', -66); t.setAttribute('fill', c);
    t.style.animationDelay = (i * .15) + 's'; t.textContent = '+' + v; g.appendChild(t); setTimeout(() => t.remove(), 1400);
  });
}
const TABS = [['make', '曲づくり'], ['tour', 'ライブ'], ['crew', '仲間'], ['base', '拠点']];
function renderDesk() {
  $('tabs').innerHTML = TABS.map(([id, n]) => `<button class="tab" role="tab" data-t="${id}" aria-selected="${G.tab === id}">${n}</button>`).join('');
  let h = '';
  if (G.tab === 'make') {
    if (G.prod) {
      const g = GEN[G.prod.g], c = compat(G.prod.g, G.prod.t), known = G.known[G.prod.g + '|' + G.prod.t];
      h = `<div class="prog"><div class="t">制作中：${g.name} × ${G.prod.t}　<span style="font-size:12px;color:var(--muted)">相性 ${known ? CMARK[c] : '？'}</span></div>
        <div class="pbar"><i style="width:${Math.min(100, G.prod.prog / 4 * 100)}%"></i></div>
        <div class="mn"><span class="m">メロディ ${G.prod.m}</span><span class="n">ノリ ${G.prod.n}</span></div>
        <div class="note">${g.name}は${g.m > .6 ? 'メロディ' : g.n > .6 ? 'ノリ' : 'メロディとノリの両方'}が大事。</div></div>`;
    } else if (G.tour) h = `<div class="note">ツアー中は曲を作れない。</div>`;
    else {
      const gs = GENRES.filter(x => G.genres[x.id]);
      h = `<div class="lab">ジャンル（${gs.length}/${GENRES.length}　縄張りを解放するとテープが見つかる）</div><div class="chipset">${gs.map(x => `<button class="pick ${x.fusion ? 'fusion' : ''}" data-g="${x.id}" aria-pressed="${G.pickG === x.id}" style="${G.pickG === x.id ? `background:${x.c};border-color:${x.c}` : ''}">${x.name}</button>`).join('')}</div>
        <div class="lab">テーマ（相性は作ってみるとわかる）</div><div class="chipset">${THEMES.map(t => { const k = G.known[G.pickG + '|' + t]; return `<button class="pick" data-th="${t}" aria-pressed="${G.pickT === t}">${t}<span class="mk">${k ? CMARK[compat(G.pickG, t)] : ''}</span></button>`; }).join('')}</div>
        <button class="go" id="goMake">${GEN[G.pickG].name} × ${G.pickT} で曲を作る</button>
        <div class="note">バンド全員で作曲する。できた曲はカセットにして荒野にばらまく（物資と信者が増え、近くの殺気も少し下がる）。同じ2ジャンルで2曲ずつ作ると、新しいジャンルが生まれることがある。</div>`;
    }
  }
  if (G.tab === 'tour') {
    if (G.tour) h = `<div class="prog"><div class="t">${G.tour.street ? terrOf(G.tour.reg).name + 'で路上ライブ中' : terrOf(G.tour.reg).name + 'へ移動中'}</div><div class="note">あと ${G.tour.left} 週。</div></div>`;
    else {
      const r = terrOf(G.sel), st = G.t[r.id];
      const canStreet = !r.final && (r.home || st.free || reach(r.id));
      const street = canStreet ? `<button class="go" id="goStreet" ${G.prod || G.goods < 2 ? 'disabled' : ''} style="background:#e0a020">${r.name}で路上ライブ（1週・物資2）→ 警備スタッフが増える</button>` : '';
      if (r.home || st.free) h = `<div class="note">ボスに挑むなら、地図で まだ解放していない縄張りを選ぼう。ここでは路上ライブで警備スタッフ（今 ${G.guards}人）を増やせる。</div>${street}`;
      else if (!canGo(r.id)) h = `<div class="note">${r.final && reach(r.id) ? '荒野の王都は「荒野フェス」でしか戦えない。拠点タブでステージを大きくしよう。' : 'まだ道がない。となりの縄張りを先に解放しよう。'}</div>${street}`;
      else {
        const sc = s => ourPower(r, s).d;
        const list = G.songs.slice().sort((a, b) => sc(b) - sc(a)).slice(0, 4);
        if (!G.pickSong || !list.some(s => s.id === G.pickSong)) G.pickSong = list[0] && list[0].id;
        const op = openerPower(), fes = VENUES[G.venue].fes;
        const bossP = .4 + st.ten / 90, ourP = guardPush({ fes }) + .25, ratio = ourP / bossP;
        const odds = ratio > 1.05 ? ['有利', 'like'] : ratio > .75 ? ['互角（あおりで押し返せ）', ''] : ['不利（警備スタッフを増やそう）', 'hate'];
        h = `<div class="lab">行き先：<b style="color:var(--ink)">${r.name}</b>　殺気 ${Math.round(st.ten)}　ステージ：${VENUES[G.venue].name}</div>
          <div class="lab">押し合い：警備スタッフ ${G.guards}人${fes && op.acts.length ? '＋荒野のバンドたち' : ''} vs ${r.boss.name}の手下　<span class="tag ${odds[1]}">${odds[0]}</span></div>`;
        if (!list.length) h += `<div class="note">まだ曲がない。まず「曲づくり」で1曲作ろう。</div>`;
        else {
          h += `<div class="grid2">${list.map(s => {
            const lk = likeOf(r, s.g), n = st.played[s.id] || 0;
            return `<button class="item" data-song="${s.id}" aria-pressed="${G.pickSong === s.id}"><span class="nm"><span>「${s.title}」</span><span class="rank ${s.rank}">${s.rank}</span></span>
              <span class="sub">${GEN[s.g].name}×${s.t}　最後まで演れば 殺気-${(sc(s) * (fes ? 1.4 : 1)).toFixed(1)}前後</span><span>${lk > 1.2 ? '<span class="tag like">好き</span>' : lk < 1 ? '<span class="tag hate">苦手</span>' : ''} ${GEN[s.g].hot >= 2 ? '<span class="tag hate">激しい</span>' : GEN[s.g].hot < 0 ? '<span class="tag like">癒し</span>' : ''} ${n ? `<span class="tag tired">${n}回目</span>` : ''}</span></button>`;
          }).join('')}</div>
          <button class="go alt" id="goTour" ${G.prod || G.goods < travelCost() ? 'disabled' : ''}>${r.name}へ殴り込みライブ（${travelWeeks()}週・物資${travelCost()}）</button>
          <div class="note">${G.prod ? '曲の制作中は出発できない。' : `ライブ中、${r.boss.name}の手下がステージに押し寄せる。警備スタッフが押しとどめている間に1曲演りきれ。「あおる！」で押し返せる。${fes ? '荒野フェスは2days。1日目はみんなで、2日目は自分たちだけ。' : '激しい曲は効くが、相手も熱くなる。子守唄は相手がだんだん眠くなる。'}`}</div>${street}`;
        }
      }
    }
  }
  if (G.tab === 'crew') {
    const sbar = (l, v, c) => `<div class="sbar"><span>${l}</span><span class="tb"><i style="width:${Math.min(100, v)}%;background:${c}"></i></span><span>${v}</span></div>`;
    const card = m => `<div class="item"><span class="nm"><span>${m.name}</span><span style="font-size:11px">${m.part ? 'Lv' + m.lv : ''}</span></span><span class="sub">${m.part ? PARTS[m.part] : JOBS[m.job].title + '：' + JOBS[m.job].eff}</span>
      ${m.part ? `<span class="sub" style="font-family:var(--f-dot);color:var(--ink)"><span style="color:#ff3d8b">作${m.comp}</span> <span style="color:#e07a1a">演${m.play}</span> <span style="color:#3f8fc0">歌${m.sing}</span> <span style="color:#b08000">華${m.star}</span></span>` + `<button class="small" data-train="${m.id}" ${busy(m) || G.goods < trainCost(m) ? 'disabled' : ''}>${busy(m) ? '特訓中' : `特訓（物資${trainCost(m)}）`}</button>` : ''}</div>`;
    h = `<div class="lab">バンド（${G.band.length}/${BAND_SLOTS}）</div><div class="grid2">${G.band.map(card).join('')}${Array.from({ length: BAND_SLOTS - G.band.length }, () => `<div class="item empty">空き：縄張りのボスを音楽で屈服させると加わる</div>`).join('')}</div>
      <div class="lab">スタッフ（${G.staff.length}/${STAFF_SLOTS}）</div><div class="grid2">${G.staff.map(card).join('')}${Array.from({ length: STAFF_SLOTS - G.staff.length }, () => `<div class="item empty">空き</div>`).join('')}</div>
      ${G.alumni.length ? `<div class="lab">客席から応援している元スタッフ</div><div class="note">${G.alumni.map(a => `<b>${a.name}</b>`).join('　')}</div>` : ''}
      <div class="lab">荒野のバンド</div>
      <div class="note">${shownBands().length ? shownBands().map(b => `<b>${b.name}</b>`).join('　') + (G.openers.length > shownBands().length ? '　ほか噂が少し' : '') : G.openers.length ? `噂だけが聞こえてくる…（${G.openers.length}件）` : 'まだ何も聞かない。'}</div>`;
  }
  if (G.tab === 'base') {
    const nv = VENUES[G.venue + 1];
    h = `<div class="grid2">${nv ? `<button class="item" data-venue="1" ${G.goods < nv.cost ? 'disabled' : ''} style="grid-column:1/-1;border-color:var(--neon)"><span class="nm"><span>ステージを「${nv.name}」に</span><span class="tag">物資 ${nv.cost}</span></span>
      <span class="sub">いま：${VENUES[G.venue].name} → ${nv.fes ? '2days フェス。荒野の王都に挑めるようになる' : `ライブの効果 +${Math.round(nv.bonus * 100)}%`}</span></button>` : `<div class="item" style="grid-column:1/-1"><span class="nm">ステージは最大（荒野フェス）</span></div>`}
      ${FAC.map(f => { const c = facCost(f); return `<button class="item" data-fac="${f.id}" ${G.goods < c ? 'disabled' : ''}><span class="nm"><span>${f.name}</span><span style="font-size:11px">Lv${G.fac[f.id]}</span></span>
      <span class="sub">${f.desc}</span><span class="sub">${f.eff(G.fac[f.id])} → ${f.eff(G.fac[f.id] + 1)}</span><span class="tag">物資 ${c}</span></button>`; }).join('')}</div>
      <div class="note">物資は、カセット・ライブ・解放した縄張りから入る。毎月、仲間ひとりにつき物資2を食べる。</div>`;
  }
  $('desk').innerHTML = h;
}
function renderAll() { renderLive(); renderDesk(); renderTicker(); syncSpeed(); }
function syncSpeed() { document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === G.speed)); $('snd').textContent = soundOn ? '音 ON' : '音 OFF'; }
function setTab(id, dir) { G.tab = id; renderDesk(); const d = $('desk'); d.classList.remove('slide-l', 'slide-r'); void d.offsetWidth; if (dir) d.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }

// ================= overlays =================
function overlay(html) { $('ovl').innerHTML = `<div class="ov" role="dialog" aria-modal="true">${html}</div>`; }
function closeOv() { $('ovl').innerHTML = ''; }
function showIntro() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('koya-save') || 'null'); } catch (e) {}
  overlay(`<div class="card"><div class="kicker">文明が滅んで何十年</div><h2>ヒャッハー！ …いや、ロックだ。</h2>
    <p>荒れ果てた荒野。娯楽はなく、縄張り争いばかり。あなたはそんな世界の、ただのモヒカンのザコだった。</p>
    <p>ある日、廃墟で拾った一本のカセットテープ。流れてきたのは<strong>ロック</strong>だった。</p>
    <p>ギターを片手に曲を作り、縄張りに殴り込んでライブをしよう。殺気を0にすればボスは仲間になる。仲間にするかは自分で決める。バンドは一度入れたら入れ替えない。最後は荒野の王都で2daysフェスだ。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${saved && !saved.over ? '<button class="go alt" id="cont">続きから</button>' : ''}<button class="go" id="start" style="flex:1">ギターを手に取る</button></div></div>`);
  $('start').onclick = () => { G = newGame(); news('ガソスタ跡をねぐらにした。まずは1曲作ろう'); closeOv(); renderAll(); save(); };
  if ($('cont')) $('cont').onclick = () => { G = saved; G.alumni = G.alumni || []; pendingJoin = []; closeOv(); renderAll(); };
}
function end(kind) {
  if (G.over) return;
  G.over = true; save();
  if (window.FAST) return;
  const gp = globalPeace(), fc = freeCount();
  let title, body;
  if (kind === 'broke') { title = 'バンド、解散'; body = '物資が尽きた。仲間はそれぞれの縄張りに帰った。でも荒野のあちこちで、誰かがあの曲を口ずさんでいる。'; }
  else if (kind === 'peace') { title = '荒野に音楽が戻った'; body = '荒野の王は、ずっと歌いたかったのに音痴を笑われるのが怖くて、音楽を禁止していた。フェスの最後、王は泣きながらマイクを握った。下手だった。でも全員が一緒に歌った。それから荒野で殴り合いをする者はいない。'; }
  else if (fc >= 5) { title = 'まだ王都は遠い'; body = 'いくつもの縄張りが仲間になった。でも王都にはまだ音楽が届いていない。ツアーは続く。'; }
  else { title = '荒野は今日も荒れている'; body = 'ロックだけでは足りなかった…。いや、まだ曲が足りなかっただけだ。'; }
  const best = G.songs.slice().sort((a, b) => b.q - a.q)[0];
  overlay(`<div class="card"><div class="kicker">${dateStr(Math.min(G.week, WEEKS))}</div><h2>${title}</h2><p>${body}</p>
    <div class="rows"><div><b>平和度</b><span>${gp.toFixed(1)}%</span></div><div><b>解放した縄張り</b><span>${fc}/${TERR.length - 1}</span></div><div><b>信者</b><span>${G.fans.toLocaleString()}人</span></div>
    <div><b>荒野のバンド</b><span>${G.openers.length}組</span></div><div><b>代表曲</b><span>${best ? `「${best.title}」（${best.rank}）` : 'なし'}</span></div></div>
    <button class="go" id="again">もう一度やる</button></div>`);
  if (kind === 'peace') sfx('win');
  $('again').onclick = () => { closeOv(); showIntro(); };
}

// ================= save / loop / input =================
function save() { if (window.FAST) return; try { localStorage.setItem('koya-save', JSON.stringify(G)); } catch (e) {} }
let acc = 0, last = performance.now();
function loop(now) {
  const dt = Math.min(250, now - last); last = now;
  if (G && !G.over && !G.won && G.speed > 0 && !pausedByCut && !$('ovl').innerHTML) {
    acc += dt * G.speed;
    if (acc >= 1500) { acc = 0; tick(); if (G.week % 4 === 0) save(); }
  }
  requestAnimationFrame(loop);
}
G = newGame();
buildMap(); renderAll(); showIntro();
requestAnimationFrame(loop);

$('speed').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { G.speed = +b.dataset.s; syncSpeed(); } });
$('snd').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('koya-sound', soundOn ? 'on' : 'off'); } catch (e) {} syncSpeed(); if (soundOn) sfx('coin'); };
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; const ids = TABS.map(t => t[0]); setTab(b.dataset.t, Math.sign(ids.indexOf(b.dataset.t) - ids.indexOf(G.tab))); });
$('desk').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.g) { G.pickG = t.dataset.g; renderDesk(); }
  else if (t.dataset.th) { G.pickT = t.dataset.th; renderDesk(); }
  else if (t.id === 'goMake') startSong();
  else if (t.dataset.song) { G.pickSong = t.dataset.song; renderDesk(); }
  else if (t.id === 'goTour') startTour();
  else if (t.id === 'goStreet') streetLive();
  else if (t.dataset.train) train(t.dataset.train);
  else if (t.dataset.fac) buildFac(t.dataset.fac);
  else if (t.dataset.venue) upVenue();
});
let sw = null;
$('desk').addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
$('desk').addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * .7) return;
  const ids = TABS.map(t => t[0]), i = ids.indexOf(G.tab), dir = dx < 0 ? 1 : -1;
  setTab(ids[(i + dir + ids.length) % ids.length], dir);
});
document.addEventListener('keydown', e => {
  if ($('ovl').innerHTML) return;
  if (e.key === ' ' && (e.target === document.body || e.target.tagName === 'BUTTON')) { e.preventDefault(); G.speed = G.speed ? 0 : 1; syncSpeed(); }
});
</script>
