<title>平和音楽事務所</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a small music agency's office on one screen. World map (tension → peace) on the left,
   the studio room and tabbed desk on the right. Warm, poster-ish, deliberately one light look. */
:root {
  --paper: #fbf3e4;
  --card: #fffaf0;
  --ink: #2d2433;
  --muted: #7b6f80;
  --line: #e2d3bb;
  --peace: #3fae6a;
  --tense: #e0503a;
  --mid: #f0b93a;
  --melody: #e5568f;
  --groove: #f08a24;
  --sky: #5aa8d8;
  --gold: #e8a400;
  --sea: #cfe6f2;
  --f-display: 'Rampart One', 'Hiragino Maru Gothic ProN', 'M PLUS Rounded 1c', sans-serif;
  --f-dot: 'DotGothic16', 'Osaka-Mono', 'MS Gothic', monospace;
  --f-body: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Noto Sans JP', system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--paper);
  background-image: radial-gradient(#e9dcc4 1px, transparent 1.2px);
  background-size: 18px 18px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 14px;
  box-sizing: border-box;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
.app { max-width: 1280px; height: 100%; margin: 0 auto; display: grid; grid-template-rows: auto minmax(0, 1fr); gap: 10px; }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.logo { font-family: var(--f-display); font-size: 24px; color: var(--ink); margin-right: auto; line-height: 1.05; letter-spacing: .02em; }
.logo small { display: block; font-family: var(--f-body); font-size: 11px; color: var(--muted); letter-spacing: .08em; font-weight: 500; }
.stats { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.stat { background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 3px 9px; font-family: var(--f-dot); font-variant-numeric: tabular-nums; font-size: 15px; display: flex; gap: 5px; align-items: baseline; }
.stat b { font-family: var(--f-body); font-weight: 500; font-size: 11px; color: var(--muted); }
.stat.neg { color: var(--tense); }
.speed { display: flex; gap: 3px; background: var(--card); border: 2px solid var(--line); border-radius: 10px; padding: 3px; }
.speed button { border: 0; background: transparent; border-radius: 7px; padding: 3px 8px; font-size: 12px; font-weight: 800; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

.main { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 12px; min-height: 0; }
.panel { background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }

.peace { display: flex; align-items: flex-end; gap: 14px; flex-wrap: wrap; }
.peace .big { font-family: var(--f-display); font-size: 34px; color: var(--peace); line-height: 1; font-variant-numeric: tabular-nums; }
.peace .lbl { font-size: 11px; color: var(--muted); }
.peace .goal { margin-left: auto; font-family: var(--f-dot); font-size: 12px; color: var(--muted); text-align: right; }
.gauge { height: 10px; background: #efe4d0; border-radius: 5px; overflow: hidden; position: relative; flex: none; }
.gauge i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--mid), var(--peace)); transition: width .6s; }
.gauge::after { content: ""; position: absolute; left: 90%; top: 0; bottom: 0; width: 2px; background: var(--ink); }
.stage { container-type: inline-size; position: relative; border-radius: 10px; overflow: hidden; background: var(--sea); aspect-ratio: 720 / 330; max-width: 100%; flex: none; border: 2px solid var(--line); }
.stage > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.reg { cursor: pointer; stroke: #fff; stroke-width: 1.5; transition: fill .8s; }
.reg.sel { stroke: var(--ink); stroke-width: 3; }
.rlabel { font-family: var(--f-dot); font-size: 12px; fill: var(--ink); paint-order: stroke; stroke: #fffc; stroke-width: 3px; pointer-events: none; text-anchor: middle; }
.bandmark { animation: bob .6s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-4px); } }

.regs { display: flex; flex-wrap: wrap; gap: 4px; }
.regs button { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 2px 9px; font-size: 12px; display: flex; gap: 5px; align-items: baseline; }
.regs button span { font-family: var(--f-dot); font-variant-numeric: tabular-nums; }
.regs button[aria-pressed="true"] { border-color: var(--ink); background: #fff; font-weight: 800; }
.rinfo { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.rinfo h3 { margin: 0; font-size: 16px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.rinfo h3 small { font-weight: 500; color: var(--tense); font-size: 12px; }
.rinfo .row { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); }
.rinfo .row b { color: var(--ink); font-weight: 800; }
.tbar { height: 8px; background: #efe4d0; border-radius: 4px; overflow: hidden; }
.tbar i { display: block; height: 100%; transition: width .6s, background .6s; }

.ticker { font-size: 12px; color: var(--muted); border-top: 2px dashed var(--line); padding-top: 6px; min-height: 2.6em; line-height: 1.45; }
.ticker b { color: var(--ink); }

/* studio room */
.room { position: relative; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); aspect-ratio: 360 / 104; flex: none; max-width: 100%; }
.room svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.mem { animation: bob .45s ease-in-out infinite alternate; }
.mem.idle { animation-duration: 1.4s; }
.bub { font-family: var(--f-dot); font-size: 11px; paint-order: stroke; stroke: #fff; stroke-width: 3px; animation: bub 1.1s ease-out both; text-anchor: middle; }
@keyframes bub { from { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-26px); opacity: 0; } }

.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { border: 2px solid var(--line); background: var(--paper); border-radius: 999px; padding: 3px 12px; font-size: 13px; font-weight: 800; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.desk { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
.desk.slide-l { animation: slideL .2s ease-out; } .desk.slide-r { animation: slideR .2s ease-out; }
@keyframes slideL { from { transform: translateX(26px); opacity: 0; } } @keyframes slideR { from { transform: translateX(-26px); opacity: 0; } }
.lab { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
.chipset { display: flex; flex-wrap: wrap; gap: 4px; }
.pick { border: 2px solid var(--line); background: var(--paper); border-radius: 8px; padding: 3px 8px; font-size: 13px; display: flex; gap: 4px; align-items: center; }
.pick[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.pick .mk { font-size: 12px; font-weight: 800; }
.pick.fusion { border-style: dashed; }
.pick[disabled] { opacity: .35; cursor: default; }
.go { border: 0; background: var(--peace); color: #fff; border-radius: 10px; padding: 10px 14px; font-weight: 800; font-size: 15px; box-shadow: 0 3px 0 #2a7a4a; }
.go:active:not([disabled]) { transform: translateY(2px); box-shadow: 0 1px 0 #2a7a4a; }
.go[disabled] { background: #c9bfae; box-shadow: none; cursor: default; }
.go.alt { background: var(--sky); box-shadow: 0 3px 0 #2f7aa8; }
.prog { display: flex; flex-direction: column; gap: 6px; background: var(--paper); border-radius: 10px; padding: 8px 10px; border: 2px solid var(--line); }
.prog .t { font-weight: 800; font-size: 15px; }
.pbar { height: 12px; background: #efe4d0; border-radius: 6px; overflow: hidden; }
.pbar i { display: block; height: 100%; background: var(--sky); transition: width .4s; }
.mn { display: flex; gap: 12px; font-family: var(--f-dot); font-size: 14px; }
.mn .m { color: var(--melody); } .mn .n { color: var(--groove); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.item { border: 2px solid var(--line); background: var(--paper); border-radius: 10px; padding: 6px 8px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
button.item[aria-pressed="true"] { border-color: var(--ink); background: #fff; }
button.item[disabled] { opacity: .4; cursor: default; }
.item .nm { font-weight: 800; font-size: 13px; display: flex; justify-content: space-between; gap: 6px; }
.item .sub { font-size: 11px; color: var(--muted); }
.rank { font-family: var(--f-display); font-size: 15px; line-height: 1; }
.rank.S { color: var(--gold); } .rank.A { color: var(--melody); } .rank.B { color: var(--sky); } .rank.C, .rank.D { color: var(--muted); }
.tag { font-size: 11px; padding: 0 5px; border-radius: 4px; background: #efe4d0; }
.tag.like { background: #d6f0de; color: #1d6a3c; } .tag.hate { background: #fbdcd5; color: #a3301d; } .tag.tired { background: #eee; color: var(--muted); }
.sbar { display: grid; grid-template-columns: 2.6em minmax(0, 1fr) 2em; gap: 4px; align-items: center; font-size: 11px; color: var(--muted); }
.sbar span:last-child { font-family: var(--f-dot); color: var(--ink); text-align: right; }
.sbar .tb { height: 5px; background: #efe4d0; border-radius: 3px; overflow: hidden; }
.sbar .tb i { display: block; height: 100%; }
.small { border: 2px solid var(--line); background: #fff; border-radius: 8px; padding: 3px 8px; font-size: 12px; font-weight: 800; }
.small[disabled] { opacity: .4; cursor: default; }
.note { font-size: 12px; color: var(--muted); line-height: 1.6; }
.foot { display: flex; gap: 8px; align-items: center; font-size: 11px; color: var(--muted); justify-content: center; }

/* cut-in over the map */
.cutin { position: absolute; inset: 0; z-index: 3; cursor: pointer; background: #000; }
.cutin svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px 14px 10px; background: linear-gradient(transparent, #000b 45%); display: flex; align-items: flex-end; gap: 10px; color: #fff; pointer-events: none; }
.cap .nm { font-family: var(--f-display); font-size: clamp(18px, 3vw, 28px); line-height: 1.1; animation: capin .3s cubic-bezier(.2,1.6,.4,1) both; }
.cap .rg { font-size: 12px; opacity: .85; }
.cap .val { margin-left: auto; font-family: var(--f-display); font-size: clamp(18px, 3.2vw, 30px); color: #9ff0b8; white-space: nowrap; animation: capin .3s .4s cubic-bezier(.2,1.6,.4,1) both; }
.cap .val.bad { color: #ff9a86; }
@keyframes capin { from { transform: scale(1.8); opacity: 0; } }
.stamp { position: absolute; left: 50%; top: 32%; transform: translate(-50%, -50%) rotate(-8deg); font-family: var(--f-display); font-size: var(--fs, 7cqw); color: #fff; border: 5px solid #fff; padding: 2px 16px; border-radius: 12px; background: #e5568fcc; white-space: nowrap; animation: stamp .35s .9s cubic-bezier(.3,1.8,.5,1) both; pointer-events: none; }
.stamp.gold { background: #e8a400dd; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-8deg) scale(3); opacity: 0; } }
.skip { position: absolute; right: 8px; top: 6px; font-size: 11px; color: #fffa; font-family: var(--f-dot); pointer-events: none; }
.scene * { transform-box: fill-box; }
.fly { animation: fly 1.6s ease-out both; }
@keyframes fly { from { transform: translate(0, 0); opacity: 0; } 15% { opacity: 1; } to { transform: translate(var(--dx, 20px), -110px); opacity: 0; } }
.drop { transform-origin: 50% 100%; animation: drop .5s ease-in both; }
@keyframes drop { to { transform: translateY(26px) rotate(80deg); opacity: 0; } }
.dance { transform-origin: 50% 100%; animation: dance .32s ease-in-out infinite alternate; }
@keyframes dance { from { transform: rotate(-7deg); } to { transform: rotate(7deg) translateY(-3px); } }
.armsup { transform-origin: 50% 100%; animation: armsup .3s both; }
@keyframes armsup { from { transform: scaleY(0); } }
.angry { animation: angry .12s linear infinite alternate; }
@keyframes angry { to { transform: translateX(3px); } }
.sleepy { transform-origin: 50% 100%; animation: sleepy 1s ease-in-out both; }
@keyframes sleepy { to { transform: rotate(-70deg) translateY(10px); } }
.head { transform-origin: 50% 100%; animation: bang .22s ease-in-out infinite alternate; }
@keyframes bang { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
.spin { transform-origin: center; animation: spin 1.2s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.pop { transform-origin: center; animation: pop .5s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes pop { from { transform: scale(0); } }
.appear { animation: appear .3s both; }
@keyframes appear { from { opacity: 0; } }
.light { transform-origin: 50% 0; animation: light 1.2s ease-in-out infinite alternate; }
@keyframes light { from { transform: rotate(-14deg); } to { transform: rotate(14deg); } }

/* overlays */
.ov { position: fixed; inset: 0; background: #2d2433cc; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.card { background: var(--card); border: 3px solid var(--ink); border-radius: 16px; padding: 20px; width: min(600px, 100%); max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--f-display); font-weight: normal; font-size: 28px; text-wrap: balance; }
.card p { margin: 0; line-height: 1.8; }
.kicker { font-family: var(--f-dot); font-size: 12px; color: var(--muted); letter-spacing: .1em; }
.rows { border-top: 2px dashed var(--line); padding-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.rows div { display: grid; grid-template-columns: 7em 1fr; gap: 8px; }
.rows b { font-weight: 500; color: var(--muted); font-size: 12px; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 800; z-index: 30; animation: toast 1.6s ease-out both; pointer-events: none; white-space: nowrap; }
@keyframes toast { 0% { transform: translate(-50%, 20px); opacity: 0; } 12% { transform: translate(-50%, 0); opacity: 1; } 82% { opacity: 1; } 100% { opacity: 0; } }

@media (max-width: 860px) {
  html, body { height: auto; }
  .app { height: auto; }
  .main { grid-template-columns: minmax(0, 1fr); }
  .regs { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; }
  .regs button { flex: none; }
  .cutin { position: fixed; left: 0; right: 0; top: 0; bottom: auto; aspect-ratio: 720 / 330; max-height: 60vh; z-index: 15; box-shadow: 0 10px 30px #0008; }
  .logo small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .scene *, .mem, .bandmark, .bub, .toast, .stamp, .cap * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } }
</style>

<div class="app">
  <div class="top">
    <div class="logo">平和音楽事務所<small>音楽の力で、世界の争いを止める</small></div>
    <div class="stats" id="stats"></div>
    <div class="speed" id="speed" role="group" aria-label="時間の速さ">
      <button data-s="0">停止</button><button data-s="1">1倍</button><button data-s="2">2倍</button><button data-s="4">4倍</button>
    </div>
  </div>
  <div class="main">
    <section class="panel">
      <div class="peace">
        <div><div class="lbl">世界の平和度</div><div class="big" id="gpeace">0%</div></div>
        <div><div class="lbl">ファン</div><div class="big" id="gfans" style="font-size:22px;color:var(--melody)">0</div></div>
        <div class="goal" id="goal"></div>
      </div>
      <div class="gauge"><i id="gg" style="width:0"></i></div>
      <div class="stage" id="stage">
        <svg id="map" viewBox="0 0 720 330" role="img" aria-label="世界地図。地域をタップして選ぶ"></svg>
        <div id="cut"></div>
      </div>
      <div class="regs" id="regs" role="group" aria-label="地域を選ぶ"></div>
      <div class="rinfo" id="rinfo"></div>
      <div class="ticker" id="ticker" aria-live="polite"></div>
    </section>
    <section class="panel">
      <div class="room" id="room"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
      <div class="desk" id="desk" role="tabpanel"></div>
      <div class="foot">左右にスワイプでもタブを切り替え</div>
    </section>
  </div>
</div>
<div id="ovl"></div>

<script>
// ================= data =================
const P = (lon, lat) => [(lon + 180) * 2, (90 - lat) * 2 - 20];
const POLYS = {"na":[[[-165,65],[-140,70],[-95,72],[-75,62],[-60,50],[-80,32],[-82,25],[-97,20],[-105,22],[-117,32],[-125,48],[-140,60]],[[-55,60],[-45,60],[-20,70],[-25,82],[-60,80],[-70,76]]],"sa":[[[-97,20],[-80,10],[-60,8],[-50,0],[-35,-7],[-40,-22],[-58,-38],[-68,-55],[-75,-45],[-72,-20],[-81,-5],[-85,10]]],"eu":[[[-10,36],[-9,43],[-2,48],[-5,58],[5,62],[15,70],[30,70],[40,62],[40,46],[28,40],[20,38],[12,44],[3,42]]],"af":[[[-17,15],[-10,30],[0,36],[10,37],[32,31],[43,12],[51,11],[40,-5],[35,-25],[20,-35],[12,-18],[9,4],[-8,5]]],"ru":[[[40,46],[40,62],[30,70],[60,72],[100,78],[140,72],[180,68],[170,60],[140,55],[130,48],[90,50],[75,40],[60,50]]],"mi":[[[28,40],[40,46],[60,50],[75,40],[90,30],[92,22],[80,8],[72,20],[57,25],[52,13],[43,12],[35,30]]],"ea":[[[75,40],[90,50],[130,48],[135,42],[122,30],[120,22],[108,18],[105,10],[100,14],[92,22],[90,30]]],"jp":[[[130,31],[131,34],[136,35],[140,36],[142,40],[141,45],[145,44],[140,41],[140,35],[135,33]]],"oc":[[[114,-22],[122,-18],[132,-12],[142,-11],[153,-25],[150,-37],[140,-38],[130,-32],[116,-34]],[[95,5],[105,-6],[120,-9],[140,-5],[125,5],[110,2]]]};
// each region: what it likes, what it hates, the genre you learn by playing there, and the silly conflict
const REG = [
  { id: 'jp', name: '日本', w: 1, likes: ['enka', 'pop'], hates: ['metal'], local: 'enka', war: 'きのこ派とたけのこ派の冷戦', ten: 45 },
  { id: 'ea', name: '東アジア', w: 4, likes: ['pop', 'edm'], hates: ['enka'], local: 'edm', war: '国境の餃子の皮の厚さ論争', ten: 60 },
  { id: 'mi', name: '中東・インド', w: 4, likes: ['kayo', 'folk'], hates: ['classic'], local: 'kayo', war: 'カレーの辛さをめぐる百年戦争', ten: 75 },
  { id: 'ru', name: 'ロシア・北アジア', w: 5, likes: ['metal', 'classic'], hates: ['reggae'], local: 'metal', war: '寒すぎて全員が機嫌が悪い', ten: 70 },
  { id: 'eu', name: 'ヨーロッパ', w: 3, likes: ['classic', 'edm'], hates: ['enka'], local: 'classic', war: 'サッカーの判定をめぐる大論争', ten: 55 },
  { id: 'af', name: 'アフリカ', w: 5, likes: ['folk', 'reggae'], hates: ['classic'], local: 'folk', war: '太鼓の音量をめぐるご近所トラブル', ten: 65 },
  { id: 'na', name: '北米', w: 5, likes: ['rock', 'hiphop'], hates: ['enka'], local: 'hiphop', war: 'ピザにパイナップルを乗せるかの内戦', ten: 70 },
  { id: 'sa', name: '南米', w: 4, likes: ['latin', 'reggae'], hates: ['classic'], local: 'latin', war: 'お祭りの日程が決まらない', ten: 60 },
  { id: 'oc', name: 'オセアニア', w: 3, likes: ['reggae', 'rock'], hates: ['metal'], local: 'reggae', war: 'カンガルーと人間の縄張り争い', ten: 50 },
];
REG.forEach(r => r.polys = POLYS[r.id]);
const RW = REG.reduce((s, r) => s + r.w, 0);

// m/n = how much the genre weighs melody vs groove; hot = how fired-up it gets a crowd
const GENRES = [
  { id: 'pop', name: 'ポップ', m: .5, n: .5, hot: 1, c: '#e5568f', start: true },
  { id: 'rock', name: 'ロック', m: .4, n: .6, hot: 2, c: '#d0452f', start: true },
  { id: 'enka', name: '演歌', m: .7, n: .3, hot: 0, c: '#8a5a2c' },
  { id: 'edm', name: 'EDM', m: .25, n: .75, hot: 2, c: '#6a4fd8' },

const genreOk = id => !!G.genres[id];

const regOf = id => REG.find(r => r.id === id);

const trainCost = m => 30 + m.lv * 10 + (m.trained || 0) * 15;

// ================= helpers =================
const $ = id => document.getElementById(id);
const pick = a => a[Math.floor(Math.random() * a.length)];
const R = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const mix = (a, b, t) => { const p = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const A = p(a), B = p(b); return '#' + A.map((x, i) => Math.round(x + (B[i] - x) * t).toString(16).padStart(2, '0')).join(''); };
const tenColor = t => t > 50 ? mix('#f0b93a', '#e0503a', (t - 50) / 50) : mix('#3fae6a', '#f0b93a', t / 50);
function news(text, kind = '') { G.news.unshift({ w: G.week, text, kind }); G.news = G.news.slice(0, 8); renderTicker(); }
function toast(t) { if (window.FAST) return; const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1700); }

// ================= sound =================
let AC = null, soundOn = true;
try { soundOn = localStorage.getItem('heiwa-sound') !== 'off'; } catch (e) {}
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function note(f, t, dur, type = 'triangle', vol = .14) {
  const c = ac(); if (!c) return;
  const s = c.currentTime + t, o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(vol, s + .02); g.gain.exponentialRampToValueAtTime(.001, s + dur);

const hz = n => 440 * 2 ** ((n - 69) / 12);
// short phrases per genre feel
const PHRASE = {
  0: [[67, 0], [64, .3], [60, .6], [64, .9], [62, 1.2]],             // calm
  1: [[60, 0], [64, .15], [67, .3], [72, .45], [67, .6], [72, .9]],   // bright
  2: [[52, 0], [52, .12], [55, .24], [57, .36], [52, .6], [59, .75]], // driving
  3: [[40, 0], [40, .1], [43, .2], [40, .3], [46, .4], [45, .55]],    // heavy
  '-1': [[72, 0], [69, .5], [67, 1], [64, 1.5]],                       // lullaby
};
function sfx(name, arg) {
  if (!soundOn || window.FAST) return; const c = ac(); if (!c) return; if (c.state === 'suspended') c.resume();
  if (name === 'concert') { const hot = arg; (PHRASE[hot] || PHRASE[1]).forEach(([n, t]) => { note(hz(n), t, .35, hot >= 2 ? 'sawtooth' : 'triangle', hot >= 2 ? .07 : .14); note(hz(n - 12), t, .3, 'sine', .1); }); }
  if (name === 'done') [60, 64, 67, 72, 76].forEach((n, i) => note(hz(n), i * .08, .4, 'square', .06));
  if (name === 'award') [72, 76, 79, 84, 79, 84].forEach((n, i) => note(hz(n), i * .12, .5, 'triangle', .14));
  if (name === 'boo') { note(110, 0, .5, 'sawtooth', .1); note(98, .3, .6, 'sawtooth', .1); }
  if (name === 'coin') { note(988, 0, .1, 'square', .07); note(1319, .08, .25, 'square', .07); }
  if (name === 'pop') note(880, 0, .08, 'sine', .08);
}

// ================= actions =================
function startSong() {
  if (G.prod || G.tour) return;
  const avail = G.members.filter(m => !busy(m));
  if (!avail.length) return;
  G.prod = { g: G.pickG, t: G.pickT, prog: 0, m: 0, n: 0 };
  sfx('pop');

}
function finishSong() {
  const p = G.prod, g = GEN[p.g], c = compat(p.g, p.t);
  const raw = (p.m * g.m + p.n * g.n) * 2 / 8;
  const q = Math.round(raw * CMUL[c] * (g.fusion ? 1.2 : 1));
  const key = p.g + '|' + p.t, newKnow = !G.known[key];
  G.known[key] = 1;
  const title = (p.t === '平和' && Math.random() < .5 ? 'ピース' : p.t) + pick(TITLE_TAIL[p.g]);
  const song = { id: Math.random().toString(36).slice(2, 8), title, g: p.g, t: p.t, q, rank: rankOf(q), out: 0, sold: 0, week: G.week };
  G.songs.unshift(song);

  G.prod = null;

  playCut('record', { name: `「${song.title}」完成`, where: `${g.name} × ${p.t}`, val: `曲の力 ${q}`, rank: song.rank, color: g.c,
    stamp: newKnow ? `相性 ${CMARK[c]} 発見！` : '', gold: c === 3 });
  for (const f of fused) setTimeout(() => { playCut('fusion', { name: `新ジャンル「${f.name}」誕生！`, where: f.fusion.map(x => GEN[x].name).join(' × '), val: 'どの地域でも好かれる', color: f.c }); news(`新ジャンル「${f.name}」が生まれた！`, 'good'); }, window.FAST ? 0 : 2600);
  save();
}
function startTour() {
  const song = G.songs.find(s => s.id === G.pickSong);
  if (!song || G.prod || G.tour) return;
  const cost = travelCostAt(G.fac.bus);
  if (G.money < cost) return;
  G.money -= cost;
  const weeks = G.sel === G.at ? 1 : Math.max(1, 3 - G.fac.bus);
  G.tour = { reg: G.sel, song: song.id, left: weeks };

function concert() {
  const t = G.tour, r = regOf(t.reg), st = G.regs[r.id], song = G.songs.find(s => s.id === t.song), g = GEN[song.g];
  G.at = r.id; G.tour = null;
  const like = likeOf(r, song.g);
  const tired = .6 ** (st.played[song.id] || 0);
  const star = G.members.reduce((s, m) => s + m.star, 0);
  const local = !G.genres[r.local];
  // risk: hot music in a tense place can turn into a riot; lullabies work best where it is tense
  const riot = st.ten > 60 && g.hot >= 2 && Math.random() < (g.hot - 1) * .14 * (st.ten - 50) / 50;
  let d;
  if (riot) d = -6;
  else {
    d = 4.5 * (song.q / 50) ** .7 * like * tired * (1 + Math.max(0, g.hot) * .22) * (1 + star / 250);
    if (g.hot < 0 && st.ten > 60) d *= 1.4;
  }
  st.ten = clamp(st.ten - d, 0, 100);
  st.played[song.id] = (st.played[song.id] || 0) + 1;
  const fansGain = riot ? 0 : Math.round(song.q * like * tired * 2);
  st.fans += fansGain; G.fans += fansGain;
  const ticket = riot ? 0 : Math.round(20 + song.q * .5 * like + st.fans / 200);
  G.money += ticket;
  for (const m of G.members) gainXp(m, 5);
  if (local) { G.genres[r.local] = 1; }

  const kind = riot ? 'riot' : g.hot < 0 ? 'sleep' : g.hot >= 3 ? 'metal' : 'dance';
  playCut('concert', { kind, name: riot ? '暴動！ ライブ中止' : `${r.name}ライブ`, where: `「${song.title}」${g.name}${like > 1.2 ? '（大好き）' : like < 1 ? '（苦手）' : ''}${tired < 1 ? '・聞き飽き' : ''}`,
    val: riot ? '緊張 +6' : `緊張 -${d.toFixed(1)}`, bad: riot, hot: g.hot, color: g.c, stamp: peaceNow ? `${r.name} 平和達成！` : local ? `「${GEN[r.local].name}」を覚えた！` : '', gold: peaceNow });
  news(riot ? `${r.name}のライブで暴動。激しすぎた…` : `${r.name}でライブ。緊張 -${d.toFixed(1)}、チケット ${ticket}万、ファン +${fansGain}`, riot ? 'bad' : 'good');

function gainXp(m, x) {
  m.xp += x;

}
function hire(i) {

  const fee = c.salary * 3; if (G.money < fee) return;
  G.money -= fee; G.members.push(c); G.cands.splice(i, 1);

}

}

}
function buildFac(id) {

  G.money -= c; G.fac[id]++; sfx('coin'); toast(`${f.name} が Lv${G.fac[id]} に！`); news(`${f.name}を強化（Lv${G.fac[id]}）`); renderAll(); save();
}
function refreshCands() {
  const parts = Object.keys(PARTS);
  G.cands = Array.from({ length: 3 }, () => { const m = mkMember(pick(parts)); const boost = Math.floor(G.week / 40); m.comp += boost * 2; m.play += boost * 2; m.sing += boost * 2; m.salary = Math.round((m.comp + m.play + m.sing + m.star) / 5); return m; });
}

// ================= the clock =================
function tick() {
  if (G.over) return;
  G.week++;
  // making a song: everyone in the studio pushes melody (pink) and groove (orange)
  if (G.prod && !G.tour) {
    const g = GEN[G.prod.g];
    const team = G.members.filter(m => !busy(m));
    for (const m of team) {
      const dm = Math.round((m.comp * .6 + m.sing * .3) * R(.6, 1.4)), dn = Math.round((m.play * .6 + m.sing * .3 + m.star * .1) * R(.6, 1.4));
      G.prod.m += dm; G.prod.n += dn;
      bubble(m.id, dm, dn);
    }
    G.prod.prog += 1 + G.fac.studio * .3;
    if (G.prod.prog >= prodNeed()) finishSong();
  }
  if (G.tour) { G.tour.left--; if (G.tour.left <= 0) concert(); }
  for (const m of G.members) if (m.train > 0) {
    m.train--;
    if (m.train === 0) { const k = 1 + G.fac.gym * .25; m.comp += Math.round(R(1, 3) * k); m.play += Math.round(R(1, 3) * k); m.sing += Math.round(R(1, 3) * k); m.star += Math.round(R(0, 2) * k); m.trained = (m.trained || 0) + 1; news(`${m.name} の特訓が終わった。能力アップ！`, 'good'); }
  }
  // released songs keep selling and keep playing on radios around the world
  for (const s of G.songs) {
    if (s.out >= 24) continue;
    const decay = .85 ** s.out;
    const sale = Math.round(s.q * .5 * decay * (1 + G.fac.pr * .3) * (1 + G.fans / 20000));
    G.money += sale; s.sold += sale; s.out++;
    for (const r of REG) G.regs[r.id].ten = clamp(G.regs[r.id].ten - Math.sqrt(s.q) / 150 * likeOf(r, s.g) * decay, 0, 100);
  }
  // tension creeps back
  for (const r of REG) { const st = G.regs[r.id]; if (st.ten > 0) st.ten = clamp(st.ten + .2, 0, 100); }
  if (G.week % 4 === 1) {
    const pay = G.members.reduce((s, m) => s + m.salary, 0);
    G.money -= pay;
    if (G.week % 8 === 1) refreshCands();
    if (Math.random() < .6) {
      const r = pick(REG.filter(x => G.regs[x.id].ten > 0) .concat(REG));
      G.regs[r.id].ten = clamp(G.regs[r.id].ten + R(3, 7), 0, 100);
      news(`${r.name}でまた揉めごと：${r.war}`, 'bad');
    }
  }
  if (G.week % PER_YEAR === 1 && G.week > 1) award();
  if (G.money < -300) return end('broke');
  if (globalPeace() >= 90) return end('peace');
  if (G.week > WEEKS) return end('time');
  renderLive();
  if (G.tab === 'make' || G.week % 4 === 1) renderDesk();
}
function award() {
  const s = G.yearBest; G.yearBest = null;
  if (s && s.q >= 85) {
    const prize = 100 + s.q; G.money += prize; G.fans += s.q * 10; G.awards++;
    for (const r of REG) G.regs[r.id].ten = clamp(G.regs[r.id].ten - 3, 0, 100);
    playCut('award', { name: '世界平和音楽大賞！', where: `「${s.title}」`, val: `賞金 ${prize}万・全世界の緊張 -3`, color: GEN[s.g].c, stamp: '大賞', gold: true });
    news(`「${s.title}」が世界平和音楽大賞を受賞！`, 'good');
  } else news(`今年の世界平和音楽大賞は、ほかの事務所の曲だった…（Aランク以上が必要）`, 'bad');

function soldier(x, y, i, kind) {
  const delay = (.55 + (i % 5) * .05).toFixed(2), body = pick(['#5a6a3a', '#4a5a34', '#66744a']);
  const gun = `<line x1="10" y1="-30" x2="22" y2="-52" stroke="#222" stroke-width="4" stroke-linecap="round" class="${kind === 'riot' ? '' : 'drop'}" style="animation-delay:${delay}s"/>`;
  const arms = kind === 'riot' ? `<line x1="-8" y1="-34" x2="-16" y2="-50" stroke="${body}" stroke-width="5"/><line x1="8" y1="-34" x2="16" y2="-50" stroke="${body}" stroke-width="5"/>`
    : kind === 'sleep' ? '' : `<g class="armsup" style="animation-delay:${delay}s"><line x1="-8" y1="-34" x2="-18" y2="-56" stroke="${body}" stroke-width="5" stroke-linecap="round"/><line x1="8" y1="-34" x2="18" y2="-56" stroke="${body}" stroke-width="5" stroke-linecap="round"/></g>`;
  const head = `<g class="${kind === 'metal' ? 'head' : ''}" style="animation-delay:${delay}s"><circle cy="-44" r="9" fill="#e8c9a0"/><path d="M-11 -46 A11 10 0 0 1 11 -46 Z" fill="${body}"/></g>`;
  const cls = kind === 'riot' ? 'angry' : kind === 'sleep' ? 'sleepy' : 'dance';
  return `<g transform="translate(${x},${y})"><g class="${cls}" style="animation-delay:${kind === 'sleep' ? delay : (i % 4) * .08}s"><rect x="-10" y="-36" width="20" height="30" rx="5" fill="${body}"/><rect x="-9" y="-6" width="7" height="8" fill="#333"/><rect x="2" y="-6" width="7" height="8" fill="#333"/>${arms}${head}</g>${gun}</g>`;
}

}

    dr: `<ellipse cx="0" cy="-2" rx="20" ry="7" fill="#e0503a"/><rect x="-20" y="-2" width="40" height="10" fill="#c43a2a"/><ellipse cx="22" cy="-18" rx="8" ry="2" fill="#e8a400"/>`,

  }[m.part];

function scene(kind, o) {
  let back = '', front = '', sky = ['#2a1f4a', '#5a3a7a'];
  if (kind === 'concert') {
    const k = o.kind;
    if (k === 'riot') sky = ['#5a1a1a', '#a03a2a'];
    if (k === 'sleep') sky = ['#0e1030', '#2a2a5a'];
    back = `<rect x="0" y="236" width="720" height="94" fill="#3a2f2a"/><rect x="70" y="200" width="300" height="36" fill="#5a4a6a"/>`;
    back += [140, 260, 360].map((x, i) => `<g transform="translate(${x},0)"><polygon class="light" points="0,0 -40,220 40,220" fill="${pick(['#ffe27a', '#9ff0b8', '#ff9ad0'])}" opacity=".25" style="animation-delay:${i * .3}s"/></g>`).join('');
    back += bandOnStage(o.color);
    front = Array.from({ length: 14 }, (_, i) => soldier(420 + (i % 5) * 56 + (Math.floor(i / 5) % 2) * 26, 270 + Math.floor(i / 5) * 26, i, k)).join('');
    if (k === 'riot') front += Array.from({ length: 8 }, () => `<rect class="fly" x="${R(420, 680)}" y="${R(220, 280)}" width="8" height="12" fill="#c0c0c0" style="--dx:${-R(80, 220)}px;animation-delay:${R(.2, .9).toFixed(2)}s"/>`).join('') + `<text class="fly" x="560" y="200" fill="#fff" style="font-family:var(--f-display);font-size:30px;--dx:0px;animation-delay:.3s">ブーッ！</text>`;
    else if (k === 'sleep') front += ['Z', 'z', 'Z', 'z'].map((z, i) => `<text class="fly" x="${470 + i * 50}" y="230" fill="#c9c3ff" style="font-family:var(--f-display);font-size:26px;--dx:10px;animation-delay:${.8 + i * .2}s">${z}</text>`).join('');
    else front += Array.from({ length: 12 }, (_, i) => `<text class="fly" x="${R(120, 680)}" y="${R(150, 240)}" fill="${pick(['#ffe27a', '#9ff0b8', '#ff9ad0', '#fff'])}" style="font-size:${R(18, 30).toFixed(0)}px;--dx:${R(-30, 30).toFixed(0)}px;animation-delay:${R(0, 1.2).toFixed(2)}s">${pick(['♪', '♫', '♪', '♥'])}</text>`).join('')
      + `<g class="fly" style="--dx:120px;animation-delay:.9s"><path d="M560 120 q20 -20 40 0 q-10 -4 -20 6 q-10 -10 -20 -6z" fill="#fff"/></g>`;
  }
  if (kind === 'record' || kind === 'fusion' || kind === 'award') {
    sky = kind === 'award' ? ['#5a3a00', '#c08a10'] : ['#1e2a4a', '#3a5a8a'];
    back = Array.from({ length: 16 }, () => `<circle cx="${R(0, 720)}" cy="${R(0, 330)}" r="${R(1, 3)}" fill="#fff" opacity=".6"/>`).join('');
    if (kind === 'award') front = `<g class="pop" style="animation-delay:.1s"><path d="M310 70 h100 v40 a50 50 0 0 1 -100 0z" fill="#ffd34d" stroke="#a87a10" stroke-width="4"/><path d="M310 80 h-26 a20 20 0 0 0 26 34 M410 80 h26 a20 20 0 0 1 -26 34" fill="none" stroke="#ffd34d" stroke-width="7"/><rect x="348" y="158" width="24" height="30" fill="#ffd34d"/><rect x="320" y="188" width="80" height="18" fill="#a87a10"/></g>`;
    else front = `<g transform="translate(360,140)"><g class="spin"><circle r="96" fill="#1a1a1a"/>${[80, 64, 50].map(r => `<circle r="${r}" fill="none" stroke="#333" stroke-width="2"/>`).join('')}<circle r="34" fill="${o.color}"/><circle r="5" fill="#fff"/><rect x="-3" y="-34" width="6" height="12" fill="#fff8"/></g></g>`
      + (kind === 'fusion' ? `<g class="pop" style="animation-delay:.4s"><circle cx="250" cy="100" r="30" fill="#ffe27a"/><circle cx="470" cy="100" r="30" fill="#9ff0b8"/><text x="360" y="60" text-anchor="middle" fill="#fff" style="font-family:var(--f-display);font-size:26px">＋</text></g>` : '')
      + (o.rank ? `<text class="pop" x="560" y="120" text-anchor="middle" style="animation-delay:.5s;font-family:var(--f-display);font-size:90px;fill:${o.rank === 'S' ? '#ffd34d' : o.rank === 'A' ? '#ff9ad0' : '#9fd0ff'};paint-order:stroke;stroke:#000;stroke-width:6px">${o.rank}</text>` : '');
    front += Array.from({ length: 10 }, () => `<text class="fly" x="${R(80, 640)}" y="${R(200, 300)}" fill="#fff" style="font-size:22px;--dx:${R(-20, 20).toFixed(0)}px;animation-delay:${R(0, .8).toFixed(2)}s">${pick(['♪', '♫', '★'])}</text>`).join('');
  }
  return `<svg class="scene" viewBox="0 0 720 330" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs><rect width="720" height="330" fill="url(#sky)"/>${back}${front}</svg>`;
}
const cutQueue = [];
function playCut(kind, o) {
  if (window.FAST) return;
  if ($('cutin')) { cutQueue.push([kind, o]); return; }
  pausedByCut = true;
  $('cut').innerHTML = `<div class="cutin" id="cutin" role="status" aria-live="polite">${scene(kind, o)}
    <div class="cap"><div><div class="nm">${o.name}</div><div class="rg">${o.where || ''}</div></div>${o.val ? `<div class="val ${o.bad ? 'bad' : ''}">${o.val}</div>` : ''}</div>
    ${o.stamp ? `<div class="stamp ${o.gold ? 'gold' : ''}" style="--fs:${Math.min(8, 72 / o.stamp.length).toFixed(1)}cqw">${o.stamp}</div>` : ''}<div class="skip">タップで閉じる</div></div>`;
  $('cutin').onclick = closeCut;
  if (kind === 'concert') sfx(o.bad ? 'boo' : 'concert', o.hot); else if (kind === 'award') sfx('award'); else sfx('done');
  clearTimeout(cutTimer); cutTimer = setTimeout(closeCut, o.stamp ? 3000 : 2400);
  renderAll();
}
function closeCut() {
  clearTimeout(cutTimer); $('cut').innerHTML = ''; pausedByCut = false;
  const nx = cutQueue.shift(); if (nx) setTimeout(() => playCut(...nx), 120);
}

function buildMap() {
  let h = '';
  for (const r of REG) {
    const pts = r.polys.map(poly => poly.map(([lo, la]) => P(lo, la)));
    const main = pts[0];
    r.cx = main.reduce((s, p) => s + p[0], 0) / main.length;
    r.cy = main.reduce((s, p) => s + p[1], 0) / main.length;
    if (r.id === 'jp') { r.cx += 22; r.cy += 4; }
    h += pts.map(p => `<polygon class="reg" data-r="${r.id}" points="${p.map(q => q.join(',')).join(' ')}"/>`).join('');
  }
  for (const r of REG) h += `<text class="rlabel" id="lb_${r.id}" x="${r.cx.toFixed(0)}" y="${r.cy.toFixed(0)}"></text>`;
  h += `<g id="bandmark"></g>`;
  $('map').innerHTML = h;
  $('map').addEventListener('click', e => { const t = e.target.closest('[data-r]'); if (t) { G.sel = t.dataset.r; renderAll(); } });
}

function bubble(id, dm, dn) {
  if (window.FAST) return;
  const g = document.getElementById('mem_' + id); if (!g) return;
  const ns = 'http://www.w3.org/2000/svg';
  [[dm, '#e5568f', -10], [dn, '#f08a24', 12]].forEach(([v, c, dx], i) => {
    const t = document.createElementNS(ns, 'text'); t.setAttribute('class', 'bub'); t.setAttribute('x', dx); t.setAttribute('y', -56); t.setAttribute('fill', c);
    t.style.animationDelay = (i * .15) + 's'; t.textContent = '+' + v; g.appendChild(t); setTimeout(() => t.remove(), 1400);
  });
}

  if (G.tab === 'fac') {
    h = `<div class="grid2">${FAC.map(f => { const c = facCost(f); return `<button class="item" data-fac="${f.id}" ${G.money < c ? 'disabled' : ''}><span class="nm"><span>${f.name}</span><span style="font-size:11px">Lv${G.fac[f.id]}</span></span>
      <span class="sub">${f.desc}</span><span class="sub">いま：${f.eff(G.fac[f.id])} → ${f.eff(G.fac[f.id] + 1)}</span><span class="tag">強化 ${c}万</span></button>`; }).join('')}</div>
      <div class="note">ヒット曲の売上で施設を強化しよう。売れた曲は世界中のラジオで流れて、少しずつ緊張を下げてくれる。</div>`;
  }
  d.innerHTML = h;
}
function renderAll() { renderLive(); renderDesk(); renderTicker(); syncSpeed(); }
function syncSpeed() { document.querySelectorAll('#speed button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.s === G.speed)); }
function setTab(id, dir) { G.tab = id; renderDesk(); const d = $('desk'); d.classList.remove('slide-l', 'slide-r'); void d.offsetWidth; if (dir) d.classList.add(dir > 0 ? 'slide-l' : 'slide-r'); }

// ================= overlays =================
function overlay(html) { $('ovl').innerHTML = `<div class="ov" role="dialog" aria-modal="true">${html}</div>`; }
function closeOv() { $('ovl').innerHTML = ''; }
function showIntro() {
  let saved = null; try { saved = JSON.parse(localStorage.getItem('heiwa-save') || 'null'); } catch (e) {}
  overlay(`<div class="card"><div class="kicker">設立 1年目</div><h2>音楽で、世界を平和に。</h2>
    <p>世界のあちこちで、しょうもない理由の争いが続いている。カレーの辛さ、ピザのパイナップル、きのことたけのこ。</p>
    <p>あなたは小さな音楽事務所の社長兼ボーカル。<strong>曲を作って売り、その曲を持って各地でライブをして、争いを止めよう。</strong>5年以内に世界の平和度90%が目標。</p>
    <p>ジャンルとテーマの相性は作ってみるまでわからない。地域ごとに好きな音楽も違う。ライブをするとその土地の音楽を覚える。</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${saved && !saved.over ? '<button class="go alt" id="cont">続きから</button>' : ''}<button class="go" id="start" style="flex:1">事務所を立ち上げる</button></div></div>`);
  $('start').onclick = () => { G = newGame(); refreshCands(); news('事務所を立ち上げた。まずは1曲作ってみよう'); closeOv(); renderAll(); save(); };
  if ($('cont')) $('cont').onclick = () => { G = saved; closeOv(); renderAll(); };
}
function end(kind) {
  G.over = true; save();
  if (window.FAST) return;
  const gp = globalPeace();
  let title, body;
  if (kind === 'broke') { title = '事務所、解散'; body = 'お金が尽きた。メンバーはそれぞれの国に帰り、それぞれの町で歌っている。争いはまだ続いているが、少しだけ鼻歌が増えた。'; }
  else if (kind === 'peace') { title = '世界が平和になった'; body = '最後の揉めごとが終わった日、世界中で同じ曲が流れた。カレーは辛口と甘口の両方が選べるようになり、ピザのパイナップルは「お好みで」になった。'; }
  else if (gp >= 70) { title = 'だいたい平和'; body = 'まだ小さな揉めごとは残っているが、みんな一緒に歌えるくらいには仲良くなった。事務所は次の5年に向けて新曲を作りはじめた。'; }
  else { title = '争いは続く'; body = '音楽だけでは足りなかった…。いや、まだ曲が足りなかっただけかもしれない。'; }
  const best = G.songs.slice().sort((a, b) => b.q - a.q)[0];
  overlay(`<div class="card"><div class="kicker">${dateStr(Math.min(G.week, WEEKS))}</div><h2>${title}</h2><p>${body}</p>
    <div class="rows"><div><b>世界の平和度</b><span>${gp.toFixed(1)}%</span></div><div><b>ファン</b><span>${G.fans.toLocaleString()}人</span></div>
    <div><b>作った曲</b><span>${G.songs.length}曲</span></div><div><b>代表曲</b><span>${best ? `「${best.title}」（${best.rank}）` : 'なし'}</span></div><div><b>大賞</b><span>${G.awards}回</span></div></div>
    <button class="go" id="again">もう一度やる</button></div>`);
  if (kind === 'peace') sfx('award');
  $('again').onclick = () => { closeOv(); showIntro(); };
}

// ================= save / loop / input =================
function save() { if (window.FAST) return; try { localStorage.setItem('heiwa-save', JSON.stringify(G)); } catch (e) {} }
let acc = 0, last = performance.now();
function loop(now) {
  const dt = Math.min(250, now - last); last = now;
  if (G && !G.over && G.speed > 0 && !pausedByCut && !$('ovl').innerHTML) {
    acc += dt * G.speed;
    if (acc >= 1500) { acc = 0; tick(); if (G.week % 4 === 0) save(); }
  }
  requestAnimationFrame(loop);
}

G = newGame(); refreshCands();
buildMap(); renderAll(); showIntro();
requestAnimationFrame(loop);

$('speed').addEventListener('click', e => { const b = e.target.closest('[data-s]'); if (b) { G.speed = +b.dataset.s; syncSpeed(); } });
$('regs').addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (b) { G.sel = b.dataset.r; renderAll(); } });
$('tabs').addEventListener('click', e => { const b = e.target.closest('[data-t]'); if (!b) return; const ids = TABS.map(t => t[0]); setTab(b.dataset.t, Math.sign(ids.indexOf(b.dataset.t) - ids.indexOf(G.tab))); });
$('desk').addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.dataset.g) { G.pickG = t.dataset.g; renderDesk(); }
  else if (t.dataset.th) { G.pickT = t.dataset.th; renderDesk(); }
  else if (t.id === 'goMake') startSong();
  else if (t.dataset.song) { G.pickSong = t.dataset.song; renderDesk(); }
  else if (t.id === 'goTour') startTour();
  else if (t.dataset.train) train(t.dataset.train);
  else if (t.dataset.fire) fire(t.dataset.fire);
  else if (t.dataset.hire) hire(+t.dataset.hire);
  else if (t.dataset.fac) buildFac(t.dataset.fac);
});
let sw = null;
$('desk').addEventListener('pointerdown', e => { sw = { x: e.clientX, y: e.clientY }; });
$('desk').addEventListener('pointerup', e => {
  if (!sw) return; const dx = e.clientX - sw.x, dy = e.clientY - sw.y; sw = null;
  if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx) * .7) return;
  const ids = TABS.map(t => t[0]), i = ids.indexOf(G.tab), dir = dx < 0 ? 1 : -1;
  setTab(ids[(i + dir + ids.length) % ids.length], dir);
});
document.addEventListener('keydown', e => {
  if ($('ovl').innerHTML) return;
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); G.speed = G.speed ? 0 : 1; syncSpeed(); }
});
</script>
